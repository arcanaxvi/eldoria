<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eldoria RPG — 50 Floors of Abyss</title>
<style>
  :root{
    --bg-0:#0b0b12; --bg-1:#14141f; --bg-2:#1c1c2b; --bg-3:#242438;
    --gold:#e0b64c; --gold-dim:#8a6f2f;
    --red:#c94b4b; --hp:#c94b4b; --mp:#3f8fd6; --enemyhp:#8a3fd6;
    --text:#e8e6f0; --text-dim:#a8a4bd;
    --border:#33334a; --primary:#7a4de0;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text);font-family:var(--font);}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #1a1530 0%, #0b0b12 55%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0 2px, transparent 2px 40px);
  }
  #app{max-width:680px;margin:0 auto;padding:14px 12px 60px;min-height:100vh;display:flex;flex-direction:column;}
  header.game-header{
    text-align:center;padding:14px 8px 10px;
    border-bottom:1px solid var(--border);margin-bottom:10px;
  }
  header.game-header h1{
    margin:0;font-size:1.35rem;letter-spacing:1px;
    background:linear-gradient(90deg,var(--gold),#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 18px rgba(224,182,76,0.25);
  }
  header.game-header p{margin:4px 0 0;color:var(--text-dim);font-size:0.78rem;}

  #hud{
    background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  #hud.hidden{display:none;}
  .hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .hud-name{font-weight:700;color:var(--gold);font-size:1rem;}
  .hud-tag{color:var(--text-dim);font-size:0.78rem;}
  .hud-gold{color:var(--gold);font-size:0.85rem;font-weight:600;}
  .bar{position:relative;height:18px;background:var(--bg-3);border-radius:9px;overflow:hidden;margin:4px 0;border:1px solid var(--border);}
  .bar-fill{height:100%;transition:width .3s ease;}
  .bar-fill.hp{background:linear-gradient(90deg,#7a1f1f,var(--hp));}
  .bar-fill.mp{background:linear-gradient(90deg,#1f4f7a,var(--mp));}
  .bar-fill.enemy-hp{background:linear-gradient(90deg,#4a1f7a,var(--enemyhp));}
  .bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.72rem;text-shadow:0 1px 2px #000;white-space:nowrap;}
  .bar.enemy{margin-top:8px;}

  #screen{flex:1;}
  .panel{
    background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--border);border-radius:14px;
    padding:16px 16px 18px;margin-bottom:14px;
    box-shadow:0 6px 22px rgba(0,0,0,0.4);
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .panel h2{
    margin:0 0 10px;font-size:1.05rem;color:var(--gold);
    text-align:center;letter-spacing:0.5px;
    text-shadow:0 0 10px rgba(224,182,76,0.2);
  }
  .panel p{margin:6px 0;line-height:1.5;font-size:0.92rem;}
  .sep{border:none;border-top:1px dashed var(--border);margin:10px 0;}
  .statline{color:var(--gold-dim);font-size:0.82rem !important;}
  .logmsg{background:rgba(122,77,224,0.08);border-left:3px solid var(--primary);padding:8px 10px;border-radius:6px;font-size:0.88rem !important;}
  .storytext{white-space:pre-line;line-height:1.6;color:var(--text);}
  .poison{color:#8fd67a;font-size:0.82rem !important;}
  .zone-name{color:var(--gold);font-weight:600;font-size:1rem !important;}
  .boss-warn{color:var(--red);font-weight:700;text-align:center;font-size:0.95rem !important;}
  .boss-name{color:var(--gold);font-weight:700;text-align:center;font-size:1.15rem !important;text-transform:uppercase;letter-spacing:1px;}
  .win-title{color:#8fd67a;font-weight:700;text-align:center;font-size:1rem;}
  .ending-title{color:var(--gold);font-weight:700;text-align:center;font-size:1.05rem;margin-top:10px;}
  .battle-title{color:var(--gold);font-weight:600;text-align:center;font-size:0.95rem;}

  /* Direct selectable cards */
  .selection-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin:10px 0 4px;
  }
  .select-card{
    position:relative;
    width:100%;
    text-align:left;
    background:linear-gradient(180deg,rgba(61,43,27,.96),rgba(35,23,14,.98));
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px;
    cursor:pointer;
    font:inherit;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    min-height:118px;
  }
  .select-card:hover{transform:translateY(-2px);border-color:var(--primary-light);box-shadow:0 8px 18px rgba(0,0,0,.32)}
  .select-card:active{transform:translateY(0)}
  .select-card::after{
    content:'PILIH';
    position:absolute;right:10px;top:10px;
    font-size:.62rem;letter-spacing:1px;color:var(--gold-dim);opacity:.7;
  }
  .select-card .card-title{padding-right:45px;font-size:.98rem}
  .select-card .card-desc{line-height:1.45}
  .select-card .card-stat{margin-top:7px}
  .select-card.race-selected,.select-card.class-selected{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(215,173,85,.22), 0 10px 24px rgba(0,0,0,.35);
  }
  .class-theme-preview{
    border-left:3px solid var(--class-accent,var(--gold));
  }
  @media (max-width:640px){
    .selection-grid{grid-template-columns:1fr;gap:8px}
    .select-card{min-height:0;padding:12px}
  }

  Dynamic class themes
  body.class-theme-warrior{--primary:#9b3f2f;--primary-light:#c05a3d;--gold:#e1b75d;}
  body.class-theme-mage{--primary:#5b67c9;--primary-light:#8490ed;--gold:#c7d2ff;--mp:#5f91d0;}
  body.class-theme-rogue{--primary:#6d3e91;--primary-light:#a15bc7;--gold:#d5a7e8;--enemyhp:#713b82;}
  body.class-theme-paladin{--primary:#a77a28;--primary-light:#d4ab51;--gold:#ffe2a0;--mp:#668bc4;}
  body.class-theme-archer{--primary:#4c7b43;--primary-light:#78a86b;--gold:#d6e6a0;}
  body.class-theme-necromancer{--primary:#4f3b72;--primary-light:#7957a9;--gold:#cbb8ee;--enemyhp:#673b76;}

  body.class-theme-warrior .panel h2, body.class-theme-warrior .battle-title,
  body.class-theme-mage .panel h2, body.class-theme-mage .battle-title,
  body.class-theme-rogue .panel h2, body.class-theme-rogue .battle-title,
  body.class-theme-paladin .panel h2, body.class-theme-paladin .battle-title,
  body.class-theme-archer .panel h2, body.class-theme-archer .battle-title,
  body.class-theme-necromancer .panel h2, body.class-theme-necromancer .battle-title{color:var(--gold)}

  .card{
    background:var(--bg-3);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;margin:8px 0;
  }
  .card-title{font-weight:600;color:var(--gold);font-size:0.9rem;}
  .card-desc{color:var(--text-dim);font-size:0.8rem;margin-top:3px;}
  .card-stat{color:#8fbdd6;font-size:0.78rem;margin-top:2px;}

  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .btn{
    flex:1 1 auto;min-width:130px;
    background:linear-gradient(180deg,#2b2b40,#1c1c2b);
    color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:11px 14px;font-size:0.86rem;
    cursor:pointer;transition:all .15s ease;font-family:var(--font);
  }
  .btn:hover{background:linear-gradient(180deg,#39395a,#242438);border-color:var(--primary);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.primary{background:linear-gradient(180deg,#8a5cf0,#5b32b8);border-color:#8a5cf0;font-weight:600;}
  .btn.primary:hover{background:linear-gradient(180deg,#9a6cff,#6b3fd0);}
  .btn.danger{background:linear-gradient(180deg,#5a2a2a,#3a1a1a);border-color:#7a3a3a;}
  .btn.danger:hover{background:linear-gradient(180deg,#7a3a3a,#4a2222);}

  .inputrow{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center;}
  .textinput{
    flex:1 1 160px;background:var(--bg-3);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:var(--font);
  }
  .textinput:focus{outline:none;border-color:var(--primary);}
  .numinput{max-width:110px;flex:0 0 110px;}
  .errtext{color:var(--red);font-size:0.78rem;width:100%;}

  .statrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:0.85rem;}
  .statrow label{flex:1;}
  .statinput{width:70px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color:var(--text);font-family:var(--font);}
  #statremain{text-align:center;font-weight:600;margin-top:8px !important;}
  #statremain.overspend{color:var(--red);}

  footer{text-align:center;color:var(--text-dim);font-size:0.7rem;padding:14px 0 0;opacity:0.6;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

  .eldoria-install-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(180deg,#a66f34,#70451f);
    color:#fff3cf;border:1px solid #c18a48;
    border-radius:20px;padding:8px 16px;
    font-size:0.8rem;font-weight:600;font-family:var(--font);
    cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.35);
    transition:transform .15s ease, background .15s ease;
  }
  .eldoria-install-btn:hover{background:linear-gradient(180deg,#bd8241,#865527);transform:translateY(-1px);}
  .eldoria-install-btn:active{transform:translateY(0);}
  .eldoria-install-btn.hidden{display:none;}

  .eldoria-install-modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;padding:20px;
  }
  .eldoria-install-modal-backdrop.hidden{display:none;}
  .eldoria-install-modal{
    background:linear-gradient(180deg,#241a10,#140d08);
    border:1px solid #65492c;border-radius:14px;
    max-width:380px;width:100%;padding:18px 18px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    color:#e8e6f0;
  }
  .eldoria-install-modal h3{margin:0 0 10px;color:#e0b64c;font-size:1.02rem;text-align:center;}
  .eldoria-install-modal p{margin:6px 0;font-size:0.85rem;line-height:1.5;color:#c9c4d8;}
  .eldoria-install-modal ol{margin:8px 0;padding-left:20px;font-size:0.85rem;line-height:1.6;color:#e8e6f0;}
  .eldoria-install-modal .btnrow{display:flex;justify-content:flex-end;margin-top:14px;}
  .eldoria-install-modal button{
    background:linear-gradient(180deg,#4a3320,#2a1a10);color:#f1e5cc;
    border:1px solid #705232;border-radius:8px;padding:8px 16px;
    font-size:0.85rem;cursor:pointer;font-family:var(--font);
  }
  .eldoria-install-modal button:hover{border-color:#e0b64c;}

  /* =========================================================
     ELDORIA MEDIEVAL UI — VISUAL OVERHAUL + RESPONSIVE
     Tidak mengubah logic/gameplay JavaScript.
     ========================================================= */
  :root{
    --bg-0:#100c09;
    --bg-1:#17100c;
    --bg-2:#24170f;
    --bg-3:#302014;
    --gold:#d7ad55;
    --gold-bright:#f2d58a;
    --gold-dim:#8f6d35;
    --red:#a83b32;
    --hp:#b94a3d;
    --mp:#4c78a8;
    --enemyhp:#783b74;
    --text:#f1e5cc;
    --text-dim:#b9a98d;
    --border:#695032;
    --border-dark:#3d2a1b;
    --primary:#8b5a2b;
    --primary-light:#b67b3c;
    --font: Georgia, "Times New Roman", serif;
  }

  html{
    background:#0b0806;
    scroll-behavior:smooth;
  }

  body{
    min-height:100vh;
    color:var(--text);
    font-family:var(--font);
    background:
      radial-gradient(circle at 50% -10%, rgba(214,173,85,.13), transparent 38%),
      radial-gradient(circle at 10% 90%, rgba(139,90,43,.10), transparent 32%),
      linear-gradient(rgba(17,11,7,.94),rgba(17,11,7,.97)),
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px);
    letter-spacing:.01em;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    box-shadow:inset 0 0 110px 35px rgba(0,0,0,.72);
  }

  #app{
    width:min(100% - 24px, 920px);
    max-width:920px;
    margin:0 auto;
    padding:18px 0 54px;
    min-height:100vh;
  }

  header.game-header{
    position:relative;
    text-align:center;
    padding:20px 18px 18px;
    margin-bottom:14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:
      linear-gradient(180deg,rgba(54,36,22,.95),rgba(25,16,10,.96));
    box-shadow:
      0 10px 30px rgba(0,0,0,.5),
      inset 0 1px rgba(255,255,255,.06);
  }

  header.game-header::before,
  header.game-header::after{
    content:"✦";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold);
    opacity:.75;
    font-size:1.15rem;
  }
  header.game-header::before{left:18px}
  header.game-header::after{right:18px}

  header.game-header h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.45rem,4vw,2rem);
    letter-spacing:3px;
    text-transform:uppercase;
    background:linear-gradient(180deg,#fff1b8 0%,#d7ad55 48%,#8f6427 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 18px rgba(215,173,85,.18);
  }

  header.game-header p{
    margin:7px 0 0;
    color:var(--text-dim);
    font-size:.78rem;
    letter-spacing:1.3px;
  }

  #hud{
    position:sticky;
    top:10px;
    z-index:20;
    background:linear-gradient(180deg,rgba(50,32,19,.98),rgba(29,18,11,.98));
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.48);
    backdrop-filter:blur(8px);
  }

  .hud-name,.panel h2,.card-title{
    color:var(--gold-bright);
    text-shadow:0 1px 0 #000;
  }

  .hud-tag,.card-desc,.textinput::placeholder{color:var(--text-dim)}

  .bar{
    height:18px;
    background:#120d09;
    border:1px solid #4b3825;
    border-radius:3px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
  }

  .bar-fill.hp{background:linear-gradient(90deg,#6f211c,#c34d40)}
  .bar-fill.mp{background:linear-gradient(90deg,#29486a,#5d8fbe)}
  .bar-fill.enemy-hp{background:linear-gradient(90deg,#45223f,#8b477e)}

  #screen{flex:1}

  .panel{
    position:relative;
    background:
      linear-gradient(180deg,rgba(49,32,20,.97),rgba(30,19,12,.98));
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:
      0 10px 28px rgba(0,0,0,.42),
      inset 0 1px rgba(255,255,255,.035);
  }

  .panel::after{
    content:"";
    position:absolute;
    inset:5px;
    pointer-events:none;
    border:1px solid rgba(215,173,85,.08);
    border-radius:5px;
  }

  .panel h2{
    font-size:1.1rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding-bottom:10px;
    margin-bottom:13px;
    border-bottom:1px solid rgba(215,173,85,.25);
  }

  .panel p{font-size:.94rem;line-height:1.65}
  .sep{border-top:1px solid rgba(215,173,85,.18)}
  .storytext{line-height:1.75}
  .zone-name,.boss-name,.battle-title,.ending-title{color:var(--gold-bright)}
  .boss-warn{color:#df6a5d}

  .card{
    background:linear-gradient(180deg,#392619,#28190f);
    border:1px solid #63472c;
    border-radius:6px;
    padding:13px 14px;
    margin:9px 0;
    box-shadow:inset 0 1px rgba(255,255,255,.035);
  }

  .card:hover{
    border-color:#8b693d;
    background:linear-gradient(180deg,#402b1a,#2d1c10);
  }

  .card-stat{color:#b7c6c8}

  .btnrow{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:9px;
    margin:13px 0 5px;
  }

  .btn{
    width:100%;
    min-width:0;
    min-height:44px;
    background:linear-gradient(180deg,#4a3320,#2a1a10);
    color:#f1e5cc;
    border:1px solid #705232;
    border-radius:5px;
    padding:11px 14px;
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
    font-family:var(--font);
    box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.05);
  }

  .btn:hover{
    background:linear-gradient(180deg,#604329,#382311);
    border-color:var(--gold);
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(0,0,0,.34),0 0 12px rgba(215,173,85,.08);
  }

  .btn:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  .btn.primary{
    background:linear-gradient(180deg,#a66f34,#70451f);
    border-color:#c18a48;
    color:#fff3cf;
  }

  .btn.primary:hover{background:linear-gradient(180deg,#bd8241,#865527)}
  .btn.danger{background:linear-gradient(180deg,#632b25,#3c1814);border-color:#7d3a31}
  .btn.danger:hover{background:linear-gradient(180deg,#7b342c,#4d1c18)}

  .inputrow{
    display:flex;
    gap:8px;
    margin:11px 0;
    flex-wrap:wrap;
  }

  .textinput,.statinput{
    background:#17100b;
    border:1px solid #65492c;
    color:var(--text);
    border-radius:5px;
    font-family:var(--font);
  }

  .textinput{padding:11px 12px;min-height:44px}
  .textinput:focus,.statinput:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(215,173,85,.10);
  }

  .statinput{padding:7px 8px}
  .logmsg{
    background:rgba(139,90,43,.12);
    border-left:3px solid var(--gold-dim);
    border-radius:3px;
  }

  footer{
    color:#8f806b;
    font-size:.7rem;
    padding:18px 8px 0;
    opacity:.72;
    line-height:1.5;
  }

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:#0c0907}
  ::-webkit-scrollbar-thumb{background:#4a3420;border-radius:5px;border:2px solid #0c0907}
  ::-webkit-scrollbar-thumb:hover{background:#6a4a2b}

  /* Tablet */
  @media (max-width:700px){
    #app{width:min(100% - 18px,680px);padding-top:10px}
    header.game-header{padding:16px 12px}
    header.game-header::before,header.game-header::after{display:none}
    .panel{padding:16px}
    #hud{top:6px}
  }

  /* Phone */
  @media (max-width:480px){
    #app{width:100%;padding:7px 8px 38px}
    header.game-header{
      border-radius:6px;
      padding:14px 10px;
      margin-bottom:9px;
    }
    header.game-header h1{font-size:1.25rem;letter-spacing:1.5px}
    header.game-header p{font-size:.68rem;letter-spacing:.7px}

    #hud{
      position:relative;
      top:auto;
      padding:10px;
      border-radius:6px;
      margin-bottom:9px;
    }

    .hud-row{gap:4px;margin-bottom:5px}
    .hud-name{font-size:.92rem}
    .hud-tag,.hud-gold{font-size:.72rem}
    .bar{height:17px}

    .panel{
      padding:14px 12px;
      margin-bottom:9px;
      border-radius:6px;
    }
    .panel::after{inset:4px}
    .panel h2{font-size:.95rem;letter-spacing:1px}
    .panel p{font-size:.88rem;line-height:1.55}
    .storytext{line-height:1.6}

    .card{padding:11px 10px}
    .card-title{font-size:.86rem}
    .card-desc{font-size:.76rem}
    .card-stat{font-size:.74rem}

      grid-template-columns:1fr;
      gap:7px;
      margin-top:10px;

    .btn{
      min-height:46px;
      padding:12px 11px;

      display:grid;
      grid-template-columns:1fr 72px;

    *,*::before,*::after{
      animation-duration:.01ms!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important;

<style id="eldoria-class-themes">
/* =========================================================
   ELDORIA — CLASS THEMES
   Theme is applied to body via .class-theme-*.
   ========================================================= */

/* Shared theme variables */
:root {
  --theme-primary: #8B0000;
  --theme-secondary: #708090;
  --theme-accent: #D4AF37;
  --theme-bg: #120909;
  --theme-panel: #241212;
  --theme-panel-2: #321818;
  --theme-text: #F5E8D0;
  --theme-muted: #C5B6A0;
  --theme-border: #8B0000;
  --theme-glow: rgba(139,0,0,.32);
}

/* Warrior — blood red / iron */
body.class-theme-warrior {
  --theme-primary: #8B0000;
  --theme-secondary: #708090;
  --theme-accent: #C0C0C0;
  --theme-bg: #120707;
  --theme-panel: #241010;
  --theme-panel-2: #351616;
  --theme-border: #8B0000;
  --theme-glow: rgba(139,0,0,.42);
}

/* Mage — electric blue / mystic violet */
body.class-theme-mage {
  --theme-primary: #0000FF;
  --theme-secondary: #8A2BE2;
  --theme-accent: #B8C7FF;
  --theme-bg: #07071A;
  --theme-panel: #10102C;
  --theme-panel-2: #191945;
  --theme-border: #4A35D8;
  --theme-glow: rgba(0,0,255,.38);
}

/* Rogue — shadow black / poison green */
body.class-theme-rogue {
  --theme-primary: #1C1C1C;
  --theme-secondary: #2E8B57;
  --theme-accent: #6FCF97;
  --theme-bg: #080B09;
  --theme-panel: #121714;
  --theme-panel-2: #1B241F;
  --theme-border: #2E8B57;
  --theme-glow: rgba(46,139,87,.36);
}

/* Paladin — holy gold / silver */
body.class-theme-paladin {
  --theme-primary: #FFD700;
  --theme-secondary: #F8F8FF;
  --theme-accent: #FFF2A6;
  --theme-bg: #15130A;
  --theme-panel: #28230F;
  --theme-panel-2: #3A3213;
  --theme-border: #FFD700;
  --theme-glow: rgba(255,215,0,.38);
}

/* Archer — forest green / wood brown */
body.class-theme-archer {
  --theme-primary: #228B22;
  --theme-secondary: #8B4513;
  --theme-accent: #9ACD32;
  --theme-bg: #081008;
  --theme-panel: #122015;
  --theme-panel-2: #1A2B1C;
  --theme-border: #228B22;
  --theme-glow: rgba(34,139,34,.36);
}

/* Necromancer — neon poison / dark indigo */
body.class-theme-necromancer {
  --theme-primary: #39FF14;
  --theme-secondary: #4B0082;
  --theme-accent: #9CFF85;
  --theme-bg: #07020D;
  --theme-panel: #12081A;
  --theme-panel-2: #1D0D2B;
  --theme-border: #4B0082;
  --theme-glow: rgba(57,255,20,.30);
}

/* Override the fixed brown medieval palette with theme variables. */
body[class*="class-theme-"] {
  background:
    radial-gradient(circle at 50% -10%, var(--theme-glow), transparent 42%),
    linear-gradient(180deg, var(--theme-bg), #080808 78%);
  color: var(--theme-text);
  transition: background .35s ease, color .25s ease;
}

body[class*="class-theme-"] .panel,
body[class*="class-theme-"] .card,
body[class*="class-theme-"] .modal,
body[class*="class-theme-"] .box,
body[class*="class-theme-"] .section,
body[class*="class-theme-"] .menu,
body[class*="class-theme-"] .game-panel {
  background: linear-gradient(145deg, var(--theme-panel-2), var(--theme-panel));
  border-color: var(--theme-border);
  box-shadow: 0 8px 28px rgba(0,0,0,.30);
}

body[class*="class-theme-"] h1,
body[class*="class-theme-"] h2,
body[class*="class-theme-"] h3,
body[class*="class-theme-"] .title,
body[class*="class-theme-"] .card-title,
body[class*="class-theme-"] .gold,
body[class*="class-theme-"] .accent {
  color: var(--theme-accent);
}

body[class*="class-theme-"] .btn,
body[class*="class-theme-"] button.primary,
body[class*="class-theme-"] .primary-btn {
  background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
  border-color: var(--theme-accent);
  color: #fff;
  box-shadow: 0 4px 14px var(--theme-glow);
}

body[class*="class-theme-"] .select-card {
  border-color: color-mix(in srgb, var(--theme-border) 55%, #777);
  background: linear-gradient(145deg, var(--theme-panel-2), var(--theme-panel));
}

body[class*="class-theme-"] .select-card:hover,
body[class*="class-theme-"] .select-card.selected,
body[class*="class-theme-"] .select-card.race-selected,
body[class*="class-theme-"] .select-card.class-selected,
body[class*="class-theme-"] .select-card.weapon-selected {
  border-color: var(--theme-accent);
  box-shadow: 0 0 0 1px var(--theme-primary), 0 0 24px var(--theme-glow);
}

body[class*="class-theme-"] input,
body[class*="class-theme-"] select,
body[class*="class-theme-"] textarea {
  background: var(--theme-panel);
  color: var(--theme-text);
  border-color: var(--theme-border);
}

body[class*="class-theme-"] .progress,
body[class*="class-theme-"] .bar,
body[class*="class-theme-"] .meter {
  border-color: var(--theme-border);
}

body[class*="class-theme-"] .progress > *,
body[class*="class-theme-"] .bar > *,
body[class*="class-theme-"] .meter > * {
  background: linear-gradient(90deg, var(--theme-primary), var(--theme-secondary));
}

/* Keep the medieval parchment readable while still reflecting the class. */
body[class*="class-theme-"] .parchment,
body[class*="class-theme-"] .lore,
body[class*="class-theme-"] .description {
  border-color: var(--theme-border);
}
</style>


<style id="eldoria-fixed-hp-mp-bars">
/* HP/MP bars are gameplay indicators, not class-theme accents.
   HP is always red, MP is always blue, enemy HP is always violet.
   The actual DOM markup is <div class="bar-fill hp|mp|enemy-hp">,
   so these are the selectors that must be targeted (the old rules
   below referenced .hp-fill/.bar-hp/etc, which never matched
   anything in the real markup — that's why the theme's generic
   `body[class*="class-theme-"] .bar > *` rule was winning and
   recoloring the bars). !important is used because that generic
   theme rule has higher specificity than a plain .bar-fill.hp rule. */
body[class*="class-theme-"] .bar-fill.hp {
  background: linear-gradient(90deg, #7a1f1f, #c94b4b) !important;
}
body[class*="class-theme-"] .bar-fill.mp {
  background: linear-gradient(90deg, #1f4f7a, #3f8fd6) !important;
}
body[class*="class-theme-"] .bar-fill.enemy-hp {
  background: linear-gradient(90deg, #4a1f7a, #8a3fd6) !important;
}

/* Non-standard bar markup, kept as a safety net in case other
   parts of the UI ever use these class names instead. */
body[class*="class-theme-"] .hp-bar,
body[class*="class-theme-"] .hp-fill,
body[class*="class-theme-"] .bar-hp,
body[class*="class-theme-"] .health-bar,
body[class*="class-theme-"] .health-fill,
body[class*="class-theme-"] .stat-bar.hp .fill,
body[class*="class-theme-"] .stat-bar.health .fill {
  background: #8B0000 !important;
  background-image: linear-gradient(90deg, #8B0000, #FF3333) !important;
}

body[class*="class-theme-"] .mp-bar,
body[class*="class-theme-"] .mp-fill,
body[class*="class-theme-"] .bar-mp,
body[class*="class-theme-"] .mana-bar,
body[class*="class-theme-"] .mana-fill,
body[class*="class-theme-"] .stat-bar.mp .fill,
body[class*="class-theme-"] .stat-bar.mana .fill {
  background: #0000FF !important;
  background-image: linear-gradient(90deg, #0000FF, #4D7CFF) !important;
}

/* The empty portion stays dark; only the fill width represents current HP/MP. */
.hp-bar, .mp-bar, .bar-hp, .bar-mp, .health-bar, .mana-bar, .bar {
  overflow: hidden;
}

/* .bar-label is also a direct child of .bar (sibling of .bar-fill), and it's
   positioned absolute + inset:0, covering the whole bar. The theme's generic
   `.bar > *` rule was giving IT a solid gradient background too, which sat on
   top of and completely hid the actual HP/MP fill underneath. It must stay
   transparent so only its text shows and the fill/width remains visible. */
body[class*="class-theme-"] .bar-label {
  background: none !important;
}
</style>

}, {"name": "Pedang Serigala Bertulang Emas", "type": "weapon", "atk": 48, "requires": {"Taring Serigala Bayangan": 4, "Tulang Ksatria Tua": 3}, "desc": "Bilah kokoh bermata taring serigala bayangan."}, {"name": "Jubah Arwah Penjaga", "type": "armor", "def": 35, "hp": 150, "requires": {"Debu Arwah Prajurit": 4, "Jubah Pemuja Gelap": 3}, "desc": "Jubah berhawa dingin pelindung serangan sihir."}, {"name": "Kapak Golem Magma Raksasa", "type": "weapon", "atk": 95, "requires": {"Kulit Orc Mengeras": 4, "Batu Magma Berkristal": 3, "Inti Api Salamander": 2}, "desc": "Kapak tempur bersuhu ratusan derajat celcius."}, {"name": "Zirah Sisik Wyvern Vulkanik", "type": "armor", "def": 75, "hp": 380, "requires": {"Sisik Wyvern Api": 4, "Batu Magma Berkristal": 3}, "desc": "Zirah kebal api terbuat dari sisik wyvern kawah."}, {"name": "Pedang Naga Kegelapan Abyss", "type": "weapon", "atk": 165, "requires": {"Sisik Naga Bayangan": 4, "Esensi Kegelapan Murni": 3, "Zirah Hitam Abyss": 2}, "desc": "Pedang pengisap cahaya berkekuatan jurang Abyss."}, {"name": "Mantel Pelindung Jiwa Abyss", "type": "armor", "def": 125, "hp": 800, "requires": {"Esensi Kegelapan Murni": 4, "Batu Gerbang Kematian": 3}, "desc": "Melindungi pemakainya dari bisikan kutukan kegelapan."}, {"name": "Bilah Singularitas Kosmik", "type": "weapon", "atk": 290, "requires": {"Pecahan Logam Kosmik": 5, "Esensi Singularitas": 4, "Debu Kosmik Gelap": 3}, "desc": "Senjata pamungkas penembus segel dimensi waktu."}, {"name": "Zirah Takhta Abadi Genesis", "type": "armor", "def": 210, "hp": 1800, "requires": {"Esensi Singularitas": 4, "Cakar Naga Tiga Kepala": 3, "Pecahan Logam Kosmik": 4}, "desc": "Zirah terkuat yang pernah diciptakan di muka bumi."}], "STORY_DATA": {"1": "📜 LANTAI 1 - GERBANG RERUNTUHAN ELDORIA\nPintu gerbang batu berlumut runtuh berkeping-keping. Obor para prajurit terdahulu masih berkedip lemah, seolah menunggu seseorang datang menyalakannya kembali.", "2": "📜 LANTAI 2 - LORONG PERTEMPURAN TERAKHIR\nBekas darah kering membentuk jejak panjang di lantai batu. Tombak-tombak patah tergeletak berserakan, dan dari kedalaman lorong terdengar isak tangis samar yang tak jelas asalnya.", "3": "📜 LANTAI 3 - DINDING NAMA YANG TERHAPUS\nRatusan nama prajurit gugur terpahat rapi di dinding sebagai penghormatan. Namun satu nama tampak digores paksa hingga tak terbaca—seolah seseorang ingin dia dilupakan selamanya.", "4": "📜 LANTAI 4 - RUANG SURAT RAHASIA\nUap dingin menyembul dari retakan lantai. Di sudut ruangan kamu menemukan surat lusuh berisi perintah rahasia berstempel Dewan Tetua, tintanya nyaris pudar dimakan waktu.", "5": "📜 LANTAI 5 - SARANG RAJA SLIME PURBA\nLantai bergetar oleh genangan asam pekat. Tumpukan tulang belulang prajurit yang gagal mengalahkan penguasa lendir ini menjadi peringatan bagi siapa pun yang berani melangkah lebih jauh.", "6": "📜 LANTAI 6 - LORONG SETELAH KEMENANGAN\nSetelah Raja Slime tumbang, retakan besar terbuka menuju ruang bawah yang lebih gelap. Udara di sini terasa berat, sarat oleh dendam yang belum terselesaikan.", "7": "📜 LANTAI 7 - FRESKO TUJUH BINTANG\nSebuah fresko raksasa menghiasi dinding: tujuh bintang bersegel mengelilingi seekor naga yang tertidur damai. Namun satu bintang tampak retak dan cahayanya nyaris padam.", "8": "📜 LANTAI 8 - RUANG TAHANAN TERLUPAKAN\nRantai besi berkarat tergantung dari langit-langit, bekas ruang tahanan yang telah lama ditinggalkan. Di batu dinding, satu kata terpahat kasar dengan amarah: 'PENGKHIANATAN'.", "9": "📜 LANTAI 9 - GERBANG SANG PENJAGA\nGerbang ganda berlambang kerajaan berdiri kokoh di hadapanmu. Dari baliknya, langkah kaki berat bergema pelan—seakan seseorang, atau sesuatu, telah lama menunggu kedatanganmu.", "10": "📜 LANTAI 10 - AULA MAKAM PAHLAWAN GUGUR\nRatusan nisan ksatria Eldoria berbaris rapi dalam keheningan abadi. Arwah Kapten Kaelen berdiri tegak menjaga gerbang zona berikutnya, matanya menyala oleh dendam yang tak kunjung padam.", "11": "📜 LANTAI 11 - KANOPI HUTAN BAWAH TANAH\nUdara lembab berganti aroma kayu basah. Bisikan dedaunan bercahaya biru mistis terdengar seperti nyanyian pelan yang menyambut sekaligus memperingatkanmu.", "12": "📜 LANTAI 12 - JEMBATAN AKAR PURBA\nAkar raksasa membentuk jembatan alami melintasi jurang hutan. Ukiran kuno di kulit kayu menceritakan pakta pertama antara manusia dan naga—sebuah aliansi yang kini nyaris terlupakan.", "13": "📜 LANTAI 13 - KABUT PEMANGGIL\nKabut biru pekat menyelimuti segalanya hingga jarak pandang nyaris nol. Dari balik kabut, bisikan lembut berulang kali memanggil namamu, seolah mengenalmu sejak lama.", "14": "📜 LANTAI 14 - SARANG SANG RATU BADAI\nSarang burung raksasa bertumpuk tinggi di dahan pohon purba. Bulu-bulu badai berserakan di tanah, pertanda Ratu Harpy telah lama berjaga di wilayah ini tanpa ada yang berani mendekat.", "15": "📜 LANTAI 15 - MENARA BADAI HARPY\nAngin kencang menderu dari celah tebing bawah tanah tempat kawanan Harpy bertengger. Ratu mereka menatap tajam ke arahmu—penyusup pertama dalam satu generasi.", "16": "📜 LANTAI 16 - CAHAYA MENARA PERTAMA\nMenara kristal pertama muncul di kejauhan, memancarkan cahaya biru redup yang menembus kabut abadi. Dengungan sihir kuno terasa bergetar lembut di bawah kakimu.", "17": "📜 LANTAI 17 - LANTAI RUNE ARKANA\nLantai marmer retak berukir rune-rune arkana kuno. Sisa energi sihir masih terasa menyengat kulit setiap kali kamu melangkah melewatinya.", "18": "📜 LANTAI 18 - PERPUSTAKAAN RERUNTUHAN\nRak-rak berisi gulungan yang sebagian besar telah terbakar berdiri sunyi. Satu gulungan tetap utuh, menyimpan sejarah asli tentang penciptaan Segel Tujuh Bintang.", "19": "📜 LANTAI 19 - LORONG MENUJU INTI MENARA\nLorong menyempit drastis saat kamu mendekati inti menara. Dengungan energi sang penjaga golem terasa semakin kuat, bergema di setiap tulangmu.", "20": "📜 LANTAI 20 - RUANG SEGEL ARKANA KEDUA\nLingkaran sihir raksasa berputar lambat di tengah ruangan. Golem pelindung batu bersiap menguji kelayakanmu untuk melangkah lebih dalam ke jantung Eldoria.", "21": "📜 LANTAI 21 - CEKUNGAN SUNGAI LAVA\nSuhu melonjak drastis begitu kamu memasuki zona ini. Batu pijar meleleh menjadi sungai magma yang membakar tapak sepatu, memaksa setiap langkah dilakukan dengan hati-hati.", "22": "📜 LANTAI 22 - JEMBATAN SANG KSATRIA LELEH\nSebuah jembatan batu membentang di atas sungai lava. Patung seorang ksatria berdiri di tengahnya, separuh tubuhnya meleleh—monumen peringatan bagi mereka yang gagal menyeberang.", "23": "📜 LANTAI 23 - ALTAR PEMUJA NAGA\nAltar tua berlumur abu vulkanik berdiri sunyi. Sisa sesajen yang mengering menunjukkan sebuah ritual yang ditinggalkan secara tergesa-gesa, seolah pemujanya melarikan diri dari sesuatu yang mengerikan.", "24": "📜 LANTAI 24 - GUA KRISTAL OBSIDIAN\nDinding gua berkilau memantulkan cahaya api dari kejauhan. Suara auman menggema samar dari kedalaman terowongan, semakin dekat dengan setiap langkahmu.", "25": "📜 LANTAI 25 - KAWAH DRAKE PURBA\nAbu vulkanik berjatuhan seperti salju hitam di atas sarang naga api merah. Drake Pyrath membuka mata, merasakan kehadiran penyusup di wilayah kekuasaannya.", "26": "📜 LANTAI 26 - RERUNTUHAN BENTENG VULKANIK\nReruntuhan benteng ini dulunya markas pasukan Panglima Malakor, sebelum dia menghilang ditelan kegelapan Abyss dalam semalam tanpa jejak.", "27": "📜 LANTAI 27 - DINDING KISAH PERANG SAUDARA\nUkiran di dinding batu menceritakan sebuah perang saudara yang kelam: seorang panglima besar dikhianati oleh rekan seperjuangannya sendiri demi kekuasaan.", "28": "📜 LANTAI 28 - KOLAM LAVA TENANG\nSebuah kolam lava yang tenang memantulkan bayangan samar sosok berzirah hitam legam. Saat kamu mendekat untuk melihat lebih jelas, bayangan itu lenyap tanpa jejak.", "29": "📜 LANTAI 29 - GERBANG KUIL TERAKHIR\nDua patung naga raksasa berdiri menjaga gerbang kuil terdalam. Mata batu mereka seakan mengikuti setiap gerakanmu, seolah menilai apakah kamu layak melangkah lebih jauh.", "30": "📜 LANTAI 30 - KUIL MALAKOR SANG PENGKHIANAT\nTahta hitam berlumuran darah kuno berdiri di tengah kuil. Patung-patung dewa perang telah dihancurkan tanpa sisa—jejak amarah seorang panglima yang kehilangan segalanya.", "31": "📜 LANTAI 31 - GERBANG JURANG ABYSS\nCahaya obor tak lagi mampu menembus kegelapan pekat di depanmu. Gravitasi terasa aneh dan bisikan tak dikenal menggema dari segala arah, mencoba merasuki pikiranmu.", "32": "📜 LANTAI 32 - LORONG GRAVITASI PATAH\nLangkahmu sesekali melayang tanpa peringatan, seolah hukum alam tak berlaku di sini. Bisikan tak dikenal menyebut namamu berulang kali, pelan namun mengganggu.", "33": "📜 LANTAI 33 - ISTANA YANG MELAYANG\nReruntuhan sebuah istana melayang bebas di kehampaan ruang. Sebuah potret keluarga kerajaan yang robek tergantung terbalik, mengisyaratkan kehancuran yang datang dari dalam.", "34": "📜 LANTAI 34 - WAJAH-WAJAH DALAM KABUT\nKabut hitam pekat sesekali membentuk wajah-wajah yang menjerit sesaat sebelum lenyap ditelan kegelapan kembali. Kamu memilih untuk tidak berhenti dan menatapnya terlalu lama.", "35": "📜 LANTAI 35 - AULA RATU MALAM VESPERA\nBunga-bunga mawar hitam bermekaran di atas lantai kristal ungu yang dingin membeku. Ratu Vespera menantimu di singgasananya, tersenyum seolah telah lama mengetahui kedatanganmu.", "36": "📜 LANTAI 36 - SISA TAHTA RATU YANG JATUH\nRuang singgasana kecil bertirai ungu lusuh menjadi saksi sisa kejayaan Vespera sebelum ia sepenuhnya menyatu dengan kegelapan yang dulu ia coba lawan.", "37": "📜 LANTAI 37 - MURAL KEDUA: HAKIKAT SANG NAGA\nSebuah mural besar menampilkan Ignis bukan sebagai monster buas, melainkan penjaga gerbang yang menahan Abyss agar tak menelan seluruh benua Eldoria.", "38": "📜 LANTAI 38 - CERUK CERMIN RETAK\nDi ceruk sunyi ini berdiri sebuah cermin retak berdebu. Pantulanmu sesaat menunjukkan wajah asing berzirah gelap sebelum kembali normal—sebuah peringatan tentang apa yang bisa kamu jadi.", "39": "📜 LANTAI 39 - JEMBATAN TULANG RAKSASA\nJurang tanpa dasar terbentang luas di hadapanmu. Satu-satunya jalan menyeberang adalah jembatan yang tersusun dari tulang-belulang makhluk raksasa yang telah lama mati.", "40": "📜 LANTAI 40 - SARANG WYRM JURANG PURBA\nTanah berguncang dahsyat tanpa peringatan. Retakan jurang terdalam menjadi rumah bagi monster pemangsa zaman purba yang telah tidur selama ribuan tahun.", "41": "📜 LANTAI 41 - SINGULARITAS DIMENSI RETAK\nPotongan reruntuhan kerajaan melayang bebas di udara hampa tanpa gravitasi. Kamu menyadari bahwa dirimu kini berjalan di batas antara dunia nyata dan Abyss itu sendiri.", "42": "📜 LANTAI 42 - WAKTU YANG MEMBEKU\nWaktu terasa melambat drastis di lantai ini. Serpihan reruntuhan melayang membeku di udara seakan setiap detik dihentikan paksa oleh kekuatan yang tak terlihat.", "43": "📜 LANTAI 43 - CAHAYA BINTANG PURBA\nCahaya bintang purba menembus retakan dimensi di sekelilingmu. Kamu merasakan kehadiran sesuatu yang sangat kuno tengah mengawasi setiap langkahmu dari kejauhan.", "44": "📜 LANTAI 44 - LORONG NYANYIAN KRISTAL\nDinding kristal di lorong ini bernyanyi pelan, melodi kuno yang terdengar seperti doa perpisahan—sebuah requiem bagi mereka yang gugur menjaga segel selama ini.", "45": "📜 LANTAI 45 - ALTAR PENJAGA SUCI ELARA\nCahaya bulan lembut memancar dari kristal segel terakhir. Elara menatapmu dengan pandangan penuh haru, seolah menanggung beban ribuan tahun sendirian.", "46": "📜 LANTAI 46 - RUANG MEDITASI ELARA\nRuangan ini dipenuhi lilin yang telah lama padam dan gulungan doa yang belum sempat selesai ditulis—jejak keputusasaan sang penjaga terakhir dalam kesendiriannya.", "47": "📜 LANTAI 47 - RANTAI SEGEL YANG RETAK\nRantai segel raksasa mulai terlihat jelas, berkilau namun retak di banyak titik. Kamu menyadari betapa rapuhnya penghalang terakhir yang menahan sesuatu yang amat besar.", "48": "📜 LANTAI 48 - GERBANG PANAS DAN DINGIN\nSuhu udara berubah drastis tanpa peringatan, panas membara bercampur dingin membeku dalam satu ruangan yang sama—pertanda gerbang terakhir sudah sangat dekat.", "49": "📜 LANTAI 49 - SINGGASANA TAKDIR TERAKHIR\nSebuah singgasana kosong berdiri megah di hadapan gerbang naga raksasa. Ukiran terakhir di lantai bertuliskan tegas: 'Pembebas atau Penakluk, pilihlah takdirmu sendiri.'", "50": "📜 LANTAI 50 - SINGGASANA NAGA PRIMORDIAL IGNIS\nLantai terdasar dari seluruh dunia terbentang di hadapanmu. Rantai segel raksasa mengikat tubuh naga purba Ignis—dan kini nasib Eldoria sepenuhnya berada di tanganmu."}, "STORY_EVENTS": {"1": [["kael_intro", "🕯️ HELM KAPTEN KAEL\nDi antara puing gerbang, kamu menemukan helm tua berukir lambang kerajaan Eldoria.\nSebuah bisikan terdengar: 'Jangan percaya kata Dewan Tetua... pergilah lebih dalam.'"], ["seal_fragment_1", "🔷 PECAHAN SEGEL I\nKristal biru berdenyut hangat di tanganmu. Kamu memperoleh [Pecahan Segel Eldoria]!"], ["kaelen_diary", "📖 BUKU HARIAN TERAKHIR KAELEN\n'Hari ke-40 pengepungan. Bala bantuan tak kunjung datang. Aku mulai curiga kami sengaja ditinggalkan...'\nHalaman terakhir robek, seolah ditulis terburu-buru sebelum gugur."], ["noble_seal_choice", "👑 STEMPEL BERLUMUR DARAH\nKamu menemukan stempel kerajaan berlumur darah kering, bukti bahwa para bangsawan pernah\nmemalsukan perintah evakuasi demi menyelamatkan diri mereka sendiri saat Gerhana Abadi.\nApa yang akan kamu lakukan dengan bukti ini?", [{"label": "Simpan sebagai bukti untuk mengadili Dewan Tetua kelak", "rep": 8, "flag": "expose_council", "result": "Kamu menyimpan stempel itu erat-erat. Suatu hari, keadilan akan ditegakkan."}, {"label": "Hancurkan bukti demi menjaga stabilitas & persatuan rakyat", "rep": 2, "result": "Kamu menghancurkan stempel itu. Mungkin sebagian kebenaran lebih baik terkubur demi kedamaian."}, {"label": "Serap sisa mana gelap dari stempel untuk kekuatan pribadi", "rep": -6, "stat": ["CRS", 2], "result": "Energi gelap merasuk ke dalam nadimu. Kamu merasa lebih kuat... namun juga lebih dingin."}]]], "2": [["kael_truth", "👻 KEBENARAN KAELEN\n'Kami dikorbankan agar para bangsawan bisa melarikan diri saat gerhana...' Arwah Kaelen menunduk hormat."], ["ancient_mural_1", "📜 MURAL I: KEBANGKITAN PERTAMA\nUkiran menggambarkan manusia dan naga pernah bertarung bahu membahu melawan monster Void."], ["harpy_nest_secret", "🪶 RAHASIA SARANG HARPY\nDi antara tumpukan bulu, kamu menemukan telur harpy yang masih hidup, ditinggalkan sang induk yang gugur.\nSuara cicitan lemah terdengar dari dalamnya."], ["golem_core_memory", "🗿 INGATAN INTI GOLEM\nSaat menyentuh sisa inti golem yang hancur, kilasan memori terlihat: para tetua pertama menciptakannya\nbukan untuk menyerang, melainkan untuk melindungi segel dari tangan-tangan tamak."], ["arcana_tome_choice", "📘 KITAB ARKANA TERLARANG\nSebuah kitab bersampul kulit gelap tergeletak di reruntuhan menara, memancarkan hawa dingin.\nDi dalamnya tertulis mantra terlarang yang mampu memanipulasi jiwa musuh.", [{"label": "Pelajari mantra terlarang demi kekuatan lebih besar", "rep": -5, "stat": ["INT", 2], "result": "Pengetahuan gelap mengalir ke dalam pikiranmu. Kekuatanmu bertambah, tapi jiwamu terasa sedikit lebih berat."}, {"label": "Serahkan kitab pada roh penjaga hutan agar dimusnahkan", "rep": 6, "stat": ["CHA", 2], "result": "Roh hutan berterima kasih atas kebijaksanaanmu. Cahaya hangat menyelimuti tubuhmu sesaat."}]]], "3": [["malakor_memory", "⚔️ MEMORI MALAKOR\nSebuah visi memperlihatkan panglima Malakor meminum darah naga demi menyelamatkan pasukannya dari kepunahan."], ["seal_fragment_2", "🔷 PECAHAN SEGEL II\nPecahan kristal kedua menyatu dengan yang pertama, memancarkan aura perlindungan ilahi!"], ["malakor_betrayal_detail", "🗡️ RINCIAN PENGKHIANATAN\nUkiran dinding kuil mengungkap nama sang pengkhianat yang menjatuhkan Malakor: sahabat karibnya sendiri,\nseorang penasihat yang kini duduk tenang di Dewan Tetua Eldoria."], ["drake_pyrath_lore", "🔥 LEGENDA DRAKE PYRATH\nPenduduk kawah dahulu percaya Pyrath adalah penjaga api suci sebelum korupsi Abyss membutakan pikirannya\nmenjadi monster haus darah yang kini menjaga kawah dengan amarah membara."], ["cursed_blade_choice", "🗡️ BILAH TERKUTUK MALAKOR\nSebilah pedang hitam tertancap di reruntuhan altar, berbisik pelan menawarkan kekuatan tak terbatas\nkepada siapa pun yang berani menggenggamnya.", [{"label": "Genggam bilah itu dan rasakan kekuatannya", "rep": -6, "stat": ["STR", 2], "result": "Kekuatan gelap mengalir deras ke lenganmu. Otot-ototmu terasa jauh lebih kuat dari sebelumnya."}, {"label": "Hancurkan bilah itu agar tak menjerat korban lain", "rep": 7, "result": "Bilah itu pecah berkeping-keping disertai jeritan yang lenyap ditelan angin. Kamu merasa lega."}]]], "4": [["elara_whisper", "🌙 BISIKAN ELARA\n'Ignis bukan musuh sejati. Jika Ignis mati tanpa segel diperbaiki, Abyss akan menelan benua dalam hitungan menit.'"], ["ancient_mural_2", "📜 MURAL II: HAKIKAT ABYSS\nTulisan kuno menegaskan: 'Ignis adalah kunci gembok penjara, bukan tahanannya.'"], ["vespera_fall", "🖤 KEJATUHAN VESPERA\nSebuah cermin retak menampilkan visi Ratu Vespera muda, dulu seorang penyihir istana yang dikhianati\nkekasihnya sendiri sebelum ia membelot dan menyatu dengan kegelapan Abyss."], ["abyss_whisper_lore", "🌑 BISIKAN ABYSS\nSuara tanpa wujud berbisik: 'Kami bukan penjajah... kami adalah tahanan yang mencoba pulang.'\nKamu tak yakin harus mempercayainya atau tidak."], ["wyrm_ancient_lore", "🐉 LEGENDA WYRM JURANG PURBA\nCatatan kuno menyebut Wyrm ini pernah menjadi penjaga terakhir sebelum Segel Tujuh Bintang diciptakan,\nkini ia hanya mengenal insting lapar tanpa akhir."], ["dark_whisper_choice", "🌀 BISIKAN KEGELAPAN JURANG\nSuara-suara di kegelapan menawarkan pengetahuan terlarang tentang cara menaklukkan Abyss dari dalam,\ndengan syarat kamu membiarkan sedikit kegelapan itu bersemayam dalam dirimu.", [{"label": "Dengarkan bisikan itu dan serap pengetahuannya", "rep": -7, "stat": ["CRS", 3], "result": "Bisikan itu merasuk ke dalam jiwamu. Kamu kini memahami Abyss lebih dari siapa pun... dengan risikonya sendiri."}, {"label": "Tutup telingamu rapat-rapat dan terus melangkah", "rep": 5, "stat": ["CHA", 2], "result": "Kamu menolak godaan itu. Tekadmu yang teguh membuat hatimu terasa lebih ringan."}]]], "5": [["final_revelation", "🌌 WAHYU TERAKHIR\nSeluruh sejarah Eldoria terbentang di depan matamu. Nasib jutaan jiwa kini berada di ujung pedangmu."], ["ignis_true_nature", "🔥 HAKIKAT SEJATI IGNIS\nCatatan terakhir Elara mengungkap kebenaran penuh: Ignis adalah naga pertama yang rela dirantai\nselamanya agar seluruh Abyss tak pernah bisa menembus dunia manusia."], ["throne_final_choice_lore", "👑 BISIKAN SINGGASANA KOSONG\nSaat kamu mendekati singgasana terakhir, sebuah suara dalam kepalamu bertanya pelan:\n'Setelah semua yang kau lihat... akankah kau menjadi penjaga, atau penguasa baru?'"], ["elara_prayer_choice", "🕯️ DOA TERAKHIR ELARA YANG BELUM SELESAI\nDi ruang meditasinya, kamu menemukan gulungan doa Elara yang terhenti di tengah kalimat—\nseakan ia dipanggil mendadak untuk bertarung sebelum sempat menyelesaikannya.", [{"label": "Selesaikan doa itu atas namanya", "rep": 8, "flag": "completed_elara_prayer", "result": "Kamu menuliskan kalimat terakhir dengan hati-hati. Cahaya lembut sesaat memenuhi ruangan, seolah berterima kasih."}, {"label": "Biarkan doa itu tetap tak selesai, itu bukan urusanmu", "rep": -2, "result": "Kamu memilih untuk tidak ikut campur. Ruangan itu kembali sunyi seperti semula."}]]]}, "GUARANTEED_STORY_FLOORS": {"3": "kael_intro", "7": "seal_fragment_1", "13": "kael_truth", "23": "seal_fragment_2", "33": "elara_whisper", "43": "final_revelation", "47": "ignis_true_nature"}, "MAX_FLOORS": 50, "MAX_ACTIVE_SKILLS": 3, "LEGENDARY_LOOT": {"1": {"weapon": {"name": "🌟 Pedang Roh Penjaga Gerbang (Legendaris)", "atk": 42, "price": 900, "lore": "Ditempa dari sisa jiwa prajurit pertama Eldoria yang gugur menjaga gerbang."}, "armor": {"name": "🌟 Zirah Kulit Naga Muda Tersembunyi (Legendaris)", "def": 24, "hp": 110, "price": 900, "lore": "Zirah rahasia yang disembunyikan jauh di bawah reruntuhan gerbang."}, "skill": {"name": "🌟 Amukan Inti Krist
