   PROMOSI KELAS
   ============================================================ */
async function checkAndPromoteClass(player) {
  const options = CLASS_PROMOTIONS[player.class_name] || [];
  const validOptions = options.filter(o => player.level >= o.req_level);
  if (validOptions.length === 0) return false;

  let body = `<p>Pahlawan <b>${esc(player.name)}</b> telah mencapai Level ${player.level}!</p>
  <p>Pilihlah cabang jalan evolusi takdirmu:</p>${divider()}`;
  validOptions.forEach((opt, i) => {
    const bonusParts = [];
    if (opt.hp) bonusParts.push(`+${opt.hp} HP`);
    if (opt.mp) bonusParts.push(`+${opt.mp} MP`);
    if (opt.atk) bonusParts.push(`+${opt.atk} ATK`);
    if (opt.def) bonusParts.push(`+${opt.def} DEF`);
    body += `<div class="card">
      <div class="card-title">🏆 ${esc(opt.name)}</div>
      <div class="card-desc">📜 ${esc(opt.lore || '')}</div>
      <div class="card-stat">📈 Bonus Stat: ${bonusParts.join(', ')}</div>
      <div class="card-stat">✨ Skill Baru: ${esc(opt.skill_name)} (${opt.skill_cost} MP, +${opt.skill_dmg} DMG)</div>
    </div>`;
  });
  render(box('🌟🌟 EVOLUSI KELAS TINGKAT TINGGI 🌟🌟', body));
  const idx = await choose(validOptions.map((o, i) => ({ label: `Pilih ${esc(o.name)}`, value: i, cls: 'primary' })));
  const chosen = validOptions[idx];

  player.class_name = chosen.name;
  applyClassTheme(player.class_name);
  player.tier += 1;
  player.base_max_hp += chosen.hp || 0;
  player.base_max_mp += chosen.mp || 0;
  player.base_atk += chosen.atk || 0;
  player.base_def += chosen.def || 0;

  const promoBonus = 3 * player.tier;
  player.STR += promoBonus; player.INT += promoBonus; player.CHA += promoBonus;
  player.SPD += promoBonus; player.DEX += promoBonus; player.CRS += Math.floor(promoBonus / 2);

  player.recalcHpMp();
  player.hp = player.max_hp; player.mp = player.max_mp;

  const newSkill = decorateSkill({
    name: chosen.skill_name, cost: chosen.skill_cost, dmg: chosen.skill_dmg,
    heal: chosen.skill_heal || 0, lifesteal: chosen.skill_lifesteal || 0,
    poison_turns: chosen.skill_poison_turns || 0, poison_dmg: chosen.skill_poison_dmg || 0,
  });
  learnSkill(player, newSkill);

  render(box('🎉 EVOLUSI BERHASIL!', `
    <p>Kamu telah berevolusi menjadi: <b>${esc(chosen.name)}</b>!</p>
    <p>✨ Mempelajari jurus pamungkas: [${esc(chosen.skill_name)}]!</p>
    <p>📈 Semua stat tambahan meningkat +${promoBonus} (CRS +${Math.floor(promoBonus / 2)})!</p>
    <p>💖 Status tempur diperkuat secara permanen!</p>
  `));
  updateHud(player);
  await continueBtn('Lanjutkan petualangan ➜');
  return true;
}

/* ============================================================
   SISTEM SKILL SIGNATURE — SETIAP JURUS PUNYA MEKANIK SENDIRI
   ------------------------------------------------------------
   Tidak lagi semua skill memakai Rune Combo yang sama.
   Setiap skill diberi signature berdasarkan nama jurus: ada timing,
   charge, combo arah, bidik, refleks, chain, shield, meteor, poison,
   soul harvest, gravity, genesis, dll. Parameter juga diskalakan dari
   DEX/INT/SPD dan tier skill sehingga jurus lama sampai tier 40 tetap
   terasa berbeda.
   ============================================================ */
function skillHash(name) {
  let h = 2166136261;
  for (let i = 0; i < String(name).length; i++) { h ^= String(name).charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const SKILL_SIGNATURES = [
  ['timing','⏱️ TIMING PRESISI','Tekan saat inti serangan masuk lingkaran emas.'],
  ['charge','🔋 CHARGE OVERLOAD','Tahan tombol lalu lepas tepat di zona inti.'],
  ['mash','🔥 RAGE INPUT','Tekan secepat mungkin untuk menambah daya jurus.'],
  ['rhythm','🎵 RHYTHM CHAIN','Ikuti 4 ketukan berurutan tanpa memutus ritme.'],
  ['reflex','✨ REFLEX TARGET','Hancurkan target yang muncul sebelum menghilang.'],
  ['aim','🎯 WEAKPOINT AIM','Bidik titik lemah yang bergerak untuk bonus besar.'],
  ['rune','🜁 ARCANE SEQUENCE','Aktifkan simbol yang menyala dalam urutan cepat.'],
  ['parry','🛡️ IMPACT PARRY','Tekan PARRY saat cincin bertemu untuk mengubah momentum menjadi damage.'],
  ['memory','🧠 MEMORY CAST','Ingat urutan simbol lalu ulangi untuk menjaga stabilitas skill.'],
  ['slash','⚔️ SLASH DIRECTION','Pilih arah tebasan yang tepat tiga kali berturut-turut.'],
  ['meteor','☄️ METEOR IMPACT','Pilih zona jatuh meteor; semakin dekat pusat, semakin brutal.'],
  ['freeze','❄️ FREEZE WINDOW','Tahan inti es sampai indikator tepat di titik beku.'],
  ['shadow','🌑 SHADOW WINDOW','Serang hanya ketika target membuka celah bayangan.'],
  ['holy','☀️ HOLY ALIGNMENT','Selaraskan cahaya dengan segel suci yang bergerak.'],
  ['poison','☠️ TOXIN STACK','Rangkai tiga dosis racun; combo menentukan durasi efek.'],
  ['soul','💀 SOUL HARVEST','Tangkap jiwa yang beterbangan sebelum waktunya habis.'],
  ['gravity','🌀 GRAVITY PULL','Tarik inti target ke pusat gravitasi dengan drag.'],
  ['genesis','🌟 GENESIS CHARGE','Bangun energi dari nol lalu lepaskan di puncak daya.'],
  ['void','🕳️ VOID BREAK','Klik celah dimensi yang muncul acak untuk menembus pertahanan.'],
  ['shield','🛡️ AEGIS REFLECT','Pantulkan proyektil balik dengan timing perisai.']
];

function decorateSkill(skill) {
  if (!skill || !skill.name) return skill;
  if (skill.signature) return skill;
  const idx = skillHash(skill.name) % SKILL_SIGNATURES.length;
  const sig = SKILL_SIGNATURES[idx];
  return Object.assign({}, skill, {
    signature: sig[0], signature_title: sig[1], signature_hint: sig[2],
    signature_id: idx,
    // Higher-tier skills get tighter windows rather than simply larger numbers.
    mechanic_level: Math.max(1, Math.floor((skill.dmg || 20) / 35))
  });
}

function skillResult(mult, tier, label, extra) {
  return Object.assign({ mult, tier, label }, extra || {});
}

function skillSignatureMiniGame(player, enemy, skill) {
  skill = decorateSkill(skill);
  const type = skill.signature;
  // Existing polished minigames are reused only when they match the skill's signature.
  if (type === 'timing') return mgTimingStrike(player, enemy);
  if (type === 'charge') return mgHoldCharge(player, enemy);
  if (type === 'mash') return mgMashButton(player, enemy);
  if (type === 'rhythm') return mgRhythmCombo(player, enemy);
  if (type === 'reflex') return mgReflexTargets(player, enemy);
  if (type === 'aim') return mgAimReticle(player, enemy);
  if (type === 'rune') return mgRuneCombo(player, enemy);
  if (type === 'parry') return mgParryQTE(player, enemy);
  if (type === 'memory') return mgMemoryGuard(player, enemy);
  return mgCustomSkillMechanic(player, enemy, skill);
}

/* 10 signature mechanics untuk jurus yang tidak cocok dengan mekanik
   serangan biasa. Semuanya menghasilkan tier/mult yang sama sehingga
   engine damage tetap konsisten. */
function mgCustomSkillMechanic(player, enemy, skill) {
  return new Promise(resolve => {
    const type = skill.signature;
    const level = Math.max(1, skill.mechanic_level || 1);
    const wrap = document.createElement('div');
    const titleMap = {
      slash:'⚔️ SLASH DIRECTION', meteor:'☄️ METEOR IMPACT', freeze:'❄️ FREEZE WINDOW',
      shadow:'🌑 SHADOW WINDOW', holy:'☀️ HOLY ALIGNMENT', poison:'☠️ TOXIN STACK',
      soul:'💀 SOUL HARVEST', gravity:'🌀 GRAVITY PULL', genesis:'🌟 GENESIS CHARGE',
      void:'🕳️ VOID BREAK', shield:'🛡️ AEGIS REFLECT'
    };
    const hintMap = {
      slash:'Pilih arah tebasan yang sesuai dengan indikator.',
      meteor:'Klik sedekat mungkin dengan pusat lingkaran dampak.',
      freeze:'Tahan tombol dan lepas ketika kristal tepat di garis putih.',
      shadow:'Tunggu celah terbuka, lalu tekan SERANG sekali.',
      holy:'Klik segel yang sedang bercahaya sebelum berpindah.',
      poison:'Aktifkan tiga vial racun tanpa salah urutan.',
      soul:'Klik semua jiwa yang muncul sebelum mereka lenyap.',
      gravity:'Klik/tahan inti dan geser sedekat mungkin ke pusat.',
      genesis:'Tahan tombol, lepaskan ketika meter menyentuh inti.',
      void:'Klik retakan dimensi yang berkedip; salah klik mengurangi stabilitas.',
      shield:'Tekan REFLECT tepat ketika proyektil memasuki cincin.'
    };
    render(box(titleMap[type] || skill.signature_title, `<p class="storytext">${hintMap[type] || skill.signature_hint}</p>`));
    const status = elFromHtml(`<p class="mg-hint">Signature: ${esc(skill.name)}</p>`);
    wrap.appendChild(status);
    appendEl(wrap);

    const finish = (hits, total, perfectMult=1.65) => {
      const ratio = hits / total;

async function chooseSkillForBattle(player) {
  let body = '';
  const opts = player.active_skills.map((sk, idx) => {
    let cost = sk.cost;
    if (player.race_info.mp_cost_reduce) cost = Math.max(1, Math.floor(cost * (1 - player.race_info.mp_cost_reduce)));
    const sig = decorateSkill(sk); const label = `${esc(sk.name)} (${cost} MP) → ${esc(sig.signature_title)} | +${sk.dmg || 0} DMG${sk.heal ? ` | Heal ${sk.heal}` : ''}${sk.lifesteal ? ` | Lifesteal ${Math.round(sk.lifesteal*100)}%` : ''}${sk.poison_turns ? ` | Racun ${sk.poison_dmg}/turn` : ''}`;
    return { label, value: idx };
  });
  opts.push({ label: 'Batal', value: -1, cls: 'danger' });
  render(box('🪄 PILIH SKILL AKTIF', body || '<p>Pilih jurus yang ingin digunakan:</p>'));
  const idx = await choose(opts);
  if (idx === -1) return null;
  return player.active_skills[idx];
}

function renderBattleScreen(player, enemy, floor, msg) {
  let html = `<div class="battle-title">🏰 LANTAI ${floor}/${MAX_FLOORS} ⚔️ ${esc(player.name)} [${esc(player.class_name)}] vs ${esc(enemy.name)}</div>${divider()}`;
  const hpPct = Math.max(0, Math.round((player.hp / player.max_hp) * 100));
  const mpPct = Math.max(0, Math.round((player.mp / player.max_mp) * 100));
  const ehpPct = Math.max(0, Math.round((enemy.hp / enemy.max_hp) * 100));
  html += `<div class="bar"><div class="bar-fill hp" style="width:${hpPct}%"></div><span class="bar-label">👤 HP: ${player.hp}/${player.max_hp}</span></div>`;
  html += `<div class="bar"><div class="bar-fill mp" style="width:${mpPct}%"></div><span class="bar-label">🔷 MP: ${player.mp}/${player.max_mp} | 🛡️ DEF: ${player.defense}</span></div>`;
  html += `<p class="statline">${player.statLine()}</p>`;
  html += `<div class="bar enemy"><div class="bar-fill enemy-hp" style="width:${ehpPct}%"></div><span class="bar-label">👹 ${esc(enemy.name)} HP: ${enemy.hp}/${enemy.max_hp}</span></div>`;
  if (player.poison_turns > 0) html += `<p class="poison">☠️ Kamu keracunan! (${player.poison_turns} turn | -${player.poison_dmg} HP/turn)</p>`;
  if (enemy.poison_turns > 0) html += `<p class="poison">☠️ ${esc(enemy.name)} keracunan! (${enemy.poison_turns} turn | -${enemy.poison_dmg} HP/turn)</p>`;
  html += divider();
  if (msg) html += `<p class="logmsg">${nl2br(msg)}</p>${divider()}`;
  render(box(null, html));
}

/* ============================================================
   SISTEM TEKA-TEKI PETI HARTA — 5 VARIASI (INTERAKTIF NYATA)
   Dipakai setiap kali menemukan peti — entah di koridor biasa
   maupun rampasan boss. Setiap kali peti ditemukan, satu dari
   5 jenis teka-teki dipilih secara ACAK: Dial Gembok Pin, Simon
   Rune (ingatan), Lintasan Ketukan Ritme, Papan Teka-Teki XO,
   dan Kartu Rune Terbalik (memory/concentration). Semua puzzle
   ini benar-benar interaktif — klik langsung pada widget, bukan
   sekadar menekan tombol pilihan berurutan — namun tetap dibuat
   RINGAN & toleran (zona/ambang lebar, banyak percobaan ulang)
   supaya seru tanpa terlalu menyulitkan. DEX memberi sedikit
   toleransi kesalahan ekstra. Gagal total = peti macet, hanya
   dapat sebagian kecil hadiah "konsolasi" (ditangani di titik
   pemanggilan).
   ============================================================ */
async function runChestPuzzle(player, difficulty, chestLabel) {
  const types = ['lockpick', 'memory', 'rhythm', 'tictactoe', 'runematch'];
  const type = choiceArr(types);
  if (type === 'lockpick') return await puzzleLockpick(player, difficulty, chestLabel);
  if (type === 'memory') return await puzzleMemorySequence(player, difficulty, chestLabel);
  if (type === 'rhythm') return await puzzleRhythmSequence(player, difficulty, chestLabel);
  if (type === 'tictactoe') return await puzzleTicTacToe(player, difficulty, chestLabel);
  return await puzzleRuneMatch(player, difficulty, chestLabel);
}

function puzzleEndBtn(wrap, statusEl, success, msg, resolve) {
  statusEl.className = success ? 'win-title' : '';
  statusEl.textContent = msg;
  const endWrap = document.createElement('div');
  endWrap.className = 'btnrow';
  const b = document.createElement('button');
  b.className = 'btn primary';
  b.textContent = 'Lanjutkan ➜';
  b.onclick = () => { wrap.remove(); resolve(success); };
  endWrap.appendChild(b);
  appendEl(endWrap);
}

/* --- Variasi 1: Dial Gembok Pin — jarum berputar terus, tekan KUNCI tepat saat berada di zona emas --- */
async function puzzleLockpick(player, difficulty, chestLabel) {
  return await new Promise(resolve => {
    const dexBonus = Math.floor((player.DEX || 0) / 10);
    const pinCount = Math.max(2, Math.min(difficulty, 4));
    const maxMistakes = 3 + dexBonus;
    let pin = 0, mistakes = 0;

    render(box(`🔐 ${chestLabel}`, `<p class="storytext">Gemboknya dipenuhi mekanisme pin kuno. Jarum pengait berputar terus — tekan tombol KUNCI tepat saat jarum berada di zona emas!</p>`));

    const wrap = document.createElement('div');
    const dialWrap = elFromHtml(`<div class="lock-dial-wrap"><div class="lock-dial"><div class="lock-needle"></div><div class="lock-dial-center"></div></div></div>`);
    const statusEl = elFromHtml(`<p class="statline" style="text-align:center;">Pin 1/${pinCount} | ❌ Kesalahan: 0/${maxMistakes}</p>`);
    const btnWrap = elFromHtml(`<div class="tap-btn-wrap"><button class="btn primary">🔧 KUNCI!</button></div>`);
    wrap.appendChild(dialWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);

    const dialEl = dialWrap.querySelector('.lock-dial');
    const needleEl = dialWrap.querySelector('.lock-needle');
    const btn = btnWrap.querySelector('button');
    let angle = 0, raf = null, zoneStart = 0, zoneWidth = 74;

    function newZone() {
      zoneWidth = 74;
      zoneStart = ri(0, 360 - zoneWidth);
      dialEl.style.background = `conic-gradient(var(--bg-3) 0deg ${zoneStart}deg, rgba(224,182,76,0.4) ${zoneStart}deg ${zoneStart + zoneWidth}deg, var(--bg-3) ${zoneStart + zoneWidth}deg 360deg)`;
    }
    function tick() {
      angle = (angle + 4) % 360;
      needleEl.style.transform = `rotate(${angle}deg)`;
      raf = requestAnimationFrame(tick);
    }
    function startPin() {
      newZone();
      angle = ri(0, 359);
      statusEl.textContent = `Pin ${pin + 1}/${pinCount} | ❌ Kesalahan: ${mistakes}/${maxMistakes}`;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }
    btn.addEventListener('click', () => {
      const a = angle % 360;
      const hit = a >= zoneStart && a <= zoneStart + zoneWidth;
      if (hit) {
        pin++;
        if (pin >= pinCount) { cancelAnimationFrame(raf); btn.disabled = true; puzzleEndBtn(wrap, statusEl, true, '🔓 GEMBOK TERBUKA! Peti berhasil dibongkar sepenuhnya!', resolve); return; }
        statusEl.textContent = `✅ *Klik!* Pin ${pin} tepat! Bersiap untuk pin ${pin + 1}/${pinCount}...`;
        setTimeout(startPin, 500);
      } else {
        mistakes++;
        if (mistakes > maxMistakes) { cancelAnimationFrame(raf); btn.disabled = true; puzzleEndBtn(wrap, statusEl, false, '💥 Jepit rambutmu PATAH! Mekanisme gembok macet total.', resolve); return; }
        statusEl.textContent = `❌ Meleset dari zona emas! (${mistakes}/${maxMistakes}) — coba lagi...`;
      }
    });
    startPin();
  });
}

/* --- Variasi 2: Simon Rune — pola cahaya berkedip otomatis, ketuk ulang pad sesuai urutan --- */
async function puzzleMemorySequence(player, difficulty, chestLabel) {
  return await new Promise(resolve => {
    const dexBonus = Math.floor((player.DEX || 0) / 10);
    const len = Math.max(3, Math.min(difficulty + 1, 5));
    const padSyms = ['🔥', '💧', '🌪️', '⚡'];
    const sequence = [];
    for (let i = 0; i < len; i++) sequence.push(ri(0, 3));
    const maxMistakes = 1 + dexBonus;
    let mistakes = 0, playerIdx = 0, accepting = false;

    render(box(`🧿 ${chestLabel}`, `<p class="storytext">Empat rune bercahaya akan berkedip membentuk sebuah pola. Perhatikan baik-baik, lalu ketuk ulang rune-rune tersebut persis sesuai urutannya!</p>`));

    const wrap = document.createElement('div');
    const gridEl = elFromHtml(`<div class="simon-pad-grid"></div>`);
    const pads = padSyms.map((s, i) => {
      const pad = elFromHtml(`<div class="simon-pad" data-pad="${i}">${s}</div>`);
      gridEl.appendChild(pad);
      return pad;
    });
    const statusEl = elFromHtml(`<p class="statline" style="text-align:center;">Perhatikan urutannya...</p>`);
    wrap.appendChild(gridEl); wrap.appendChild(statusEl);
    appendEl(wrap);

    function flashPad(i, dur) {
      return new Promise(res => {
        pads[i].classList.add('active');
        setTimeout(() => { pads[i].classList.remove('active'); setTimeout(res, 180); }, dur);
      });
    }
    async function playSequence() {
      accepting = false;
      pads.forEach(p => p.classList.add('disabled'));
      statusEl.textContent = 'Perhatikan urutannya...';
      await new Promise(r => setTimeout(r, 450));
      for (const idx of sequence) await flashPad(idx, 550);
      statusEl.textContent = `Giliranmu! Ketuk ${sequence.length} rune sesuai urutan tadi.`;
      pads.forEach(p => p.classList.remove('disabled'));
      accepting = true;
      playerIdx = 0;
    }
    pads.forEach((pad, i) => {
      pad.addEventListener('click', () => {
        if (!accepting) return;
        pad.classList.add('active');
        setTimeout(() => pad.classList.remove('active'), 200);
        if (i === sequence[playerIdx]) {
          playerIdx++;
          if (playerIdx >= sequence.length) { accepting = false; puzzleEndBtn(wrap, statusEl, true, '🔓 Urutan sempurna! Rune-rune bercahaya lalu peti pun terbuka!', resolve); }
        } else {
          mistakes++;
          if (mistakes > maxMistakes) { accepting = false; puzzleEndBtn(wrap, statusEl, false, '💥 Urutan salah! Cahaya rune padam, mekanisme peti terkunci makin rapat.', resolve); }
          else { statusEl.textContent = `❌ Salah urutan! (${mistakes}/${maxMistakes}) — memutar ulang polanya...`; setTimeout(playSequence, 900); }
        }
      });
    });
    playSequence();
  });
}

/* --- Variasi 3: Lintasan Ketukan Ritme — marker bolak-balik, TAP tepat saat masuk zona emas --- */
async function puzzleRhythmSequence(player, difficulty, chestLabel) {
  return await new Promise(resolve => {
    const dexBonus = Math.floor((player.DEX || 0) / 10);
    const totalBeats = Math.max(3, Math.min(difficulty, 4));
    const maxMistakes = 2 + dexBonus;
    let beat = 0, mistakes = 0;

    render(box(`🥁 ${chestLabel}`, `<p class="storytext">Peti ini dijaga mantra ritme kuno. Penanda akan bergerak bolak-balik di sepanjang jalur — ketuk TAP tepat saat penanda berada di zona bercahaya!</p>`));

    const wrap = document.createElement('div');
    const trackEl = elFromHtml(`<div class="tap-track"><div class="tap-zone"></div><div class="tap-marker"></div></div>`);
    const statusEl = elFromHtml(`<p class="statline" style="text-align:center;">Ketukan 1/${totalBeats} | ❌ Kesalahan: 0/${maxMistakes}</p>`);
    const btnWrap = elFromHtml(`<div class="tap-btn-wrap"><button class="btn primary">🥁 TAP!</button></div>`);
    wrap.appendChild(trackEl); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);

    const zoneEl = trackEl.querySelector('.tap-zone');
    const markerEl = trackEl.querySelector('.tap-marker');
    const tapBtn = btnWrap.querySelector('button');
    let pos = 0, dir = 1, raf = null, zoneStart = 0, zoneWidth = 26;

    function newZone() {
      zoneWidth = 26;
      zoneStart = ri(5, 100 - zoneWidth - 5);
      zoneEl.style.left = zoneStart + '%';
      zoneEl.style.width = zoneWidth + '%';
    }
    function tick() {
      pos += dir * 1.15;
      if (pos >= 96) { pos = 96; dir = -1; }
      if (pos <= 0) { pos = 0; dir = 1; }
      markerEl.style.left = pos + '%';
      raf = requestAnimationFrame(tick);
    }
    function startBeat() {
      newZone();
      pos = 0; dir = 1;
      statusEl.textContent = `Ketukan ${beat + 1}/${totalBeats} | ❌ Kesalahan: ${mistakes}/${maxMistakes}`;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tick);
    }
    tapBtn.addEventListener('click', () => {
      const hit = pos >= zoneStart && pos <= zoneStart + zoneWidth;
      if (hit) {
        beat++;
        if (beat >= totalBeats) { cancelAnimationFrame(raf); tapBtn.disabled = true; puzzleEndBtn(wrap, statusEl, true, '🔓 Ritme sempurna! Mantra penjaga peti runtuh, peti pun terbuka!', resolve); return; }
        statusEl.textContent = `✅ Tepat! Bersiap untuk ketukan ${beat + 1}/${totalBeats}...`;
        setTimeout(startBeat, 500);
      } else {
        mistakes++;
        if (mistakes > maxMistakes) { cancelAnimationFrame(raf); tapBtn.disabled = true; puzzleEndBtn(wrap, statusEl, false, '💥 Ketukanmu meleset terlalu jauh! Mantra penjaga peti gagal ditembus.', resolve); return; }
        statusEl.textContent = `❌ Meleset! (${mistakes}/${maxMistakes}) — coba lagi...`;
      }
    });
    startBeat();
  });
}

/* --- Variasi 4: Papan Teka-Teki XO — klik langsung sel, menang ATAU seri = berhasil --- */
async function puzzleTicTacToe(player, difficulty, chestLabel) {
  return await new Promise(resolve => {
    const board = new Array(9).fill(null);
    const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    function winnerOf(b) { for (const [a, c, d] of lines) { if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; } return null; }

    render(box(`❌⭕ ${chestLabel}`, `<p class="storytext">Penjaga peti menantangmu bermain Teka-Teki XO. Ketuk salah satu kotak untuk mulai — menang ATAU seri sudah cukup untuk membuka gemboknya!</p>`));

    const wrap = document.createElement('div');
    const boardEl = elFromHtml(`<div class="ttt-board"></div>`);
    const statusEl = elFromHtml(`<p class="statline" style="text-align:center;">Giliranmu (❌)</p>`);
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const cell = elFromHtml(`<div class="ttt-cell" data-i="${i}"></div>`);
      cell.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(cell);
      cells.push(cell);
    }
    wrap.appendChild(boardEl); wrap.appendChild(statusEl);
    appendEl(wrap);

    function paint() {
      board.forEach((v, i) => {
        cells[i].textContent = v === 'X' ? '❌' : v === 'O' ? '⭕' : '';
        cells[i].className = 'ttt-cell' + (v ? ' filled' : '') + (v === 'X' ? ' x' : '') + (v === 'O' ? ' o' : '');
      });
    }
    function onCellClick(i) {
      if (board[i]) return;
      board[i] = 'X'; paint();
      let w = winnerOf(board);
      if (w === 'X') { cells.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, true, '🔓 Kamu menang! Penjaga peti mengakui kehebatanmu, gembok pun terbuka!', resolve); return; }
      if (!board.includes(null)) { cells.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, true, '🔓 Hasil seri! Penjaga peti tetap membukakan gemboknya untukmu.', resolve); return; }
      const aiEmpties = board.map((v, idx) => v ? null : idx).filter(v => v !== null);
      const aiIdx = choiceArr(aiEmpties);
      board[aiIdx] = 'O'; paint();
      w = winnerOf(board);
      if (w === 'O') { cells.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, false, '💥 Penjaga peti menang telak. Gemboknya tetap terkunci rapat.', resolve); return; }
      if (!board.includes(null)) { cells.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, true, '🔓 Hasil seri! Penjaga peti tetap membukakan gemboknya untukmu.', resolve); return; }
    }
    paint();
  });
}

/* --- Variasi 5: Kartu Rune Terbalik — memory/concentration klasik, klik dua kartu untuk mencari pasangan --- */
async function puzzleRuneMatch(player, difficulty, chestLabel) {
  return await new Promise(resolve => {
    const pairCount = Math.max(3, Math.min(difficulty + 1, 6));
    const symbolPool = ['🔥', '💧', '🌪️', '⚡', '🌑', '✨', '🍀', '💎', '🦴', '👁️'];
    const chosenSyms = [];
    while (chosenSyms.length < pairCount) {
      const s = choiceArr(symbolPool);
      if (!chosenSyms.includes(s)) chosenSyms.push(s);
    }
    const symbols = [];
    chosenSyms.forEach(s => { symbols.push(s); symbols.push(s); });
    for (let i = symbols.length - 1; i > 0; i--) { const j = ri(0, i); const tmp = symbols[i]; symbols[i] = symbols[j]; symbols[j] = tmp; }

    const dexBonus = Math.floor((player.DEX || 0) / 10);
    let attemptsLeft = pairCount * 3 + 2 + dexBonus;
    let matchedCount = 0, lock = false, firstIdx = null;

    render(box(`🧠 ${chestLabel}`, `<p class="storytext">Papan berisi ${symbols.length} keping rune tertutup. Ketuk dua keping untuk membalik & mencari pasangannya!</p>`));

    const wrap = document.createElement('div');
    const gridEl = elFromHtml(`<div class="card-grid"></div>`);
    const statusEl = elFromHtml(`<p class="statline" style="text-align:center;">🔁 Sisa Kesempatan: ${attemptsLeft} | ✅ Pasangan: 0/${pairCount}</p>`);
    const cards = symbols.map((s, i) => {
      const card = elFromHtml(`<div class="flip-card" data-i="${i}"><div class="flip-card-inner"><div class="flip-card-face flip-card-back">❓</div><div class="flip-card-face flip-card-front">${s}</div></div></div>`);
      card.addEventListener('click', () => onCardClick(i));
      gridEl.appendChild(card);
      return card;
    });
    wrap.appendChild(gridEl); wrap.appendChild(statusEl);
    appendEl(wrap);

    function updateStatus() { statusEl.textContent = `🔁 Sisa Kesempatan: ${Math.max(0, attemptsLeft)} | ✅ Pasangan: ${matchedCount}/${pairCount}`; }

    function onCardClick(i) {
      if (lock || cards[i].classList.contains('flipped') || cards[i].classList.contains('matched')) return;
      cards[i].classList.add('flipped');
      if (firstIdx === null) { firstIdx = i; return; }
      const secondIdx = i;
      lock = true;
      attemptsLeft--;
      if (symbols[firstIdx] === symbols[secondIdx]) {
        cards[firstIdx].classList.add('matched');
        cards[secondIdx].classList.add('matched');
        matchedCount++;
        firstIdx = null; lock = false;
        updateStatus();
        if (matchedCount >= pairCount) { cards.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, true, '🔓 Semua pasangan rune ditemukan! Mekanisme peti terbuka!', resolve); }
        else if (attemptsLeft <= 0) { cards.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, false, '💥 Kesempatan habis sebelum semua rune cocok. Peti tetap terkunci sebagian.', resolve); }
      } else {
        updateStatus();
        setTimeout(() => {
          cards[firstIdx].classList.remove('flipped');
          cards[secondIdx].classList.remove('flipped');
          firstIdx = null; lock = false;
          if (attemptsLeft <= 0) { cards.forEach(c => c.style.pointerEvents = 'none'); puzzleEndBtn(wrap, statusEl, false, '💥 Kesempatan habis sebelum semua rune cocok. Peti tetap terkunci sebagian.', resolve); }
        }, 700);
      }
    }
  });
}

async function handleBossChest(player, floor, enemy) {
  const zone = getZoneInfo(floor);
  const zId = zone.id;
  const isMajorBoss = (floor % 10 === 0);
  const pinCount = isMajorBoss ? 5 : 4;

  render(box('📦 PETI RAMPASAN BOSS 📦', `<p class="storytext">Di balik reruntuhan sarang ${esc(enemy.name)}, tersembunyi sebuah peti besi besar berlapis rune pelindung — gemboknya jauh lebih rumit daripada peti biasa di koridor.</p>`));
  await continueBtn('Coba Bongkar Peti ➜');

  const opened = await runChestPuzzle(player, pinCount, 'PETI RAMPASAN BOSS');
  const goldFound = ri(150, 350) * zId * (isMajorBoss ? 2 : 1);

  if (opened) {
    player.gold += goldFound;
    let out = `<p class="win-title">🎉 Peti terbuka penuh! +${goldFound} Gold!</p>`;
    if (enemy.loot_drop) {
      player.inventory.push(enemy.loot_drop);
      out += `<p>📦 Material tambahan dari dalam peti: [${esc(enemy.loot_drop)}]</p>`;
    }
    player.potions += 2;
    out += `<p>🧪 +2 Potion HP dari perbekalan peti!</p>`;

    const bonusLegendChance = isMajorBoss ? 0.15 : 0.08;
    const legendPool = LEGENDARY_LOOT[zId];
    if (legendPool && rf() < bonusLegendChance) {
      const rollType = choiceArr(['weapon', 'armor', 'skill']);
      if (rollType === 'weapon') {
        const lw = Object.assign({}, legendPool.weapon);
        player.weapon_loot.push(lw);
        out += `<p class="win-title">🌟💎 BONUS PETI! Senjata Legendaris [${esc(lw.name)}] ditemukan!</p>`;
      } else if (rollType === 'armor') {
        const la = Object.assign({}, legendPool.armor);
        player.armor_loot.push(la);
        out += `<p class="win-title">🌟💎 BONUS PETI! Zirah Legendaris [${esc(la.name)}] ditemukan!</p>`;
      } else {
        const ls = Object.assign({}, legendPool.skill);
        player.skill_loot.push(ls);
        out += `<p class="win-title">🌟💎 BONUS PETI! Gulungan Skill Legendaris [${esc(ls.name)}] ditemukan!</p>`;
      }
    }
    render(box(null, out));
  } else {
    const consolation = Math.floor(goldFound * 0.2);
    player.gold += consolation;
    render(box(null, `<p>Gembok peti terlalu rumit — kamu hanya berhasil mengorek celah kecil dan mendapat +${consolation} Gold sebelum menyerah.</p>`));
  }
  updateHud(player);
  await continueBtn('Lanjutkan ➜');
}

/* ============================================================
   MEKANIK PERTARUNGAN INTERAKTIF — 10 MINIGAME BERGAYA
   UNDERTALE / DELTARUNE
   ------------------------------------------------------------
   Setiap giliran menyerang / bertahan / memakai skill TIDAK
   hanya menekan tombol pilihan — pemain harus benar-benar
   berinteraksi secara real-time (timing, drag, klik cepat,
   tahan-lepas, mengingat pola) untuk menentukan seberapa besar
   kerusakan yang dihasilkan atau seberapa efektif bertahan.

   6 mekanik SERANGAN (dipilih acak tiap giliran):
     1. mgTimingStrike  — penanda bolak-balik, tekan di zona emas
     2. mgHoldCharge    — tahan tombol, lepas di zona putih
     3. mgMashButton    — pukul tombol secepat mungkin
     4. mgRhythmCombo   — 3 ketukan berirama berturut-turut
     5. mgReflexTargets — ketuk 5 target cahaya sebelum lenyap
     6. mgAimReticle    — bidik titik lemah yang bergerak
   1 mekanik SKILL:
     7. mgRuneCombo     — ketuk rune yang menyala secara acak
   3 mekanik BERTAHAN (dipilih acak):
     8. mgBulletDodge   — gerakkan soul menghindari proyektil
     9. mgParryQTE      — tekan PARRY saat cincin berhimpit
    10. mgMemoryGuard   — ingat & blokir urutan arah serangan
   ============================================================ */
function clampNum(v, min, max) { return Math.max(min, Math.min(max, v)); }

function mgFinish(wrap, resultEl, label, resultObj, resolve) {
  resultEl.className = 'mg-tierbadge';
  resultEl.textContent = label;
  const endWrap = document.createElement('div');
  endWrap.className = 'btnrow';
  const b = document.createElement('button');
  b.className = 'btn primary';
  b.textContent = 'Lanjutkan ➜';
  b.onclick = () => { wrap.remove(); resolve(resultObj); };
  endWrap.appendChild(b);
  appendEl(endWrap);
}

/* --- 1) Serangan Waktu --- */
function mgTimingStrike(player, enemy) {
  return new Promise(resolve => {
    render(box('⚔️ Serangan Waktu', `<p class="storytext">Penanda bergerak bolak-balik. Tekan SERANG tepat saat berada di zona bercahaya untuk kerusakan maksimal!</p>`));
    const dexBonus = Math.min(10, Math.floor((player.DEX || 0) / 8));
    const goodW = Math.min(60, 34 + dexBonus);
    const perfW = Math.min(24, 12 + Math.floor(dexBonus / 2));
    const center = ri(20, 80);
    const goodStart = clampNum(center - goodW / 2, 2, 98 - goodW);
    const perfStart = clampNum(center - perfW / 2, goodStart + 2, goodStart + goodW - perfW - 2);

    const wrap = document.createElement('div');
    const trackWrap = elFromHtml(`<div class="mg-track">
      <div class="mg-zone-good" style="left:${goodStart}%;width:${goodW}%;"></div>
      <div class="mg-zone-perfect" style="left:${perfStart}%;width:${perfW}%;"></div>
      <div class="mg-needle"></div>
    </div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Tekan tombol saat penanda berada di zona emas!</p>`);
    const btnWrap = elFromHtml(`<div class="mg-act-btn-wrap"><button class="btn primary">⚔️ SERANG!</button></div>`);
    wrap.appendChild(trackWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const needleEl = trackWrap.querySelector('.mg-needle');
    const btn = btnWrap.querySelector('button');
    const t0 = performance.now();
    let raf = null;
    const speed = enemy && enemy.is_boss ? 0.0021 : 0.0016;
    function tick(t) {
      const phase = (Math.sin((t - t0) * speed) + 1) / 2;
      needleEl.style.left = (phase * 97) + '%';
      needleEl._pos = phase * 100;
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    btn.addEventListener('click', () => {
      cancelAnimationFrame(raf);
      btn.disabled = true;
      const pos = needleEl._pos || 0;
      let tier, mult, label;
      if (pos >= perfStart && pos <= perfStart + perfW) { tier = 'perfect'; mult = 1.6; label = '🌟 WAKTU SEMPURNA!'; }
      else if (pos >= goodStart && pos <= goodStart + goodW) { tier = 'good'; mult = 1.15; label = '✅ Pukulan Bagus!'; }
      else { tier = 'miss'; mult = 0.5; label = '💢 Ayunanmu meleset! Damage -50%'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    });
  });
}

/* --- 2) Tahan & Lepas --- */
function mgHoldCharge(player, enemy) {
  return new Promise(resolve => {
    render(box('💪 Tahan & Lepas', `<p class="storytext">Tahan tombol untuk mengisi tenaga, lalu lepaskan tepat saat pengisi berada di zona putih untuk hantaman penuh!</p>`));
    const dexBonus = Math.min(10, Math.floor((player.DEX || 0) / 8));
    const zoneW = Math.min(38, 22 + dexBonus);
    const zoneStart = ri(50, 90 - zoneW);
    const wrap = document.createElement('div');
    const trackWrap = elFromHtml(`<div class="mg-charge-track">
      <div class="mg-charge-zone" style="left:${zoneStart}%;width:${zoneW}%;"></div>
      <div class="mg-charge-fill"></div>
    </div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Tahan tombol untuk mengisi tenaga...</p>`);
    const btnWrap = elFromHtml(`<div class="mg-act-btn-wrap"><button class="btn primary">🔥 TAHAN (lalu lepas)</button></div>`);
    wrap.appendChild(trackWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const fillEl = trackWrap.querySelector('.mg-charge-fill');
    const btn = btnWrap.querySelector('button');
    let raf = null, holding = false, startT = 0, fill = 0, resolved = false;
    const speed = enemy && enemy.is_boss ? 0.075 : 0.06;
    function tick(t) {
      if (!holding) return;
      fill = Math.min(100, (t - startT) * speed);
      fillEl.style.width = fill + '%';
      if (fill >= 100) { finish(); return; }
      raf = requestAnimationFrame(tick);
    }
    function finish() {
      if (resolved) return;
      resolved = true;
      cancelAnimationFrame(raf); btn.disabled = true;
      let tier, mult, label;
      const dist = Math.abs(fill - (zoneStart + zoneW / 2));
      if (fill >= zoneStart && fill <= zoneStart + zoneW && dist <= zoneW * 0.28) { tier = 'perfect'; mult = 1.6; label = '🌟 TENAGA PENUH SEMPURNA!'; }
      else if (fill >= zoneStart && fill <= zoneStart + zoneW) { tier = 'good'; mult = 1.15; label = '✅ Tenaga cukup kuat!'; }
      else { tier = 'miss'; mult = 0.5; label = '💢 Waktu lepasmu meleset! Damage -50%'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    }
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      holding = true; startT = performance.now();
      statusEl.textContent = 'Isi terus... lepaskan di zona putih!';
      raf = requestAnimationFrame(tick);
    });
    btn.addEventListener('pointerup', () => { if (holding) { holding = false; finish(); } });
    btn.addEventListener('pointerleave', () => { if (holding) { holding = false; finish(); } });
  });
}

/* --- 3) Serangan Bertubi (mash) --- */
function mgMashButton(player, enemy) {
  return new Promise(resolve => {
    render(box('👊 Serangan Bertubi', `<p class="storytext">Klik tombol secepat mungkin sebelum waktu habis untuk menghantam musuh berkali-kali!</p>`));
    const dexBonus = Math.min(6, Math.floor((player.DEX || 0) / 10));
    const duration = 2200;
    const targetPerfect = Math.max(12, 20 - dexBonus);
    const targetGood = Math.max(7, 12 - dexBonus);
    const wrap = document.createElement('div');
    const trackWrap = elFromHtml(`<div class="mg-mash-track"><div class="mg-mash-fill"></div></div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Sisa waktu: ${(duration / 1000).toFixed(1)}s | Klik: 0</p>`);
    const btnWrap = elFromHtml(`<div class="mg-mash-btn-wrap"><button class="btn primary">👊 PUKUL!</button></div>`);
    wrap.appendChild(trackWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const fillEl = trackWrap.querySelector('.mg-mash-fill');
    const btn = btnWrap.querySelector('button');
    let clicks = 0;
    const t0 = performance.now();
    btn.addEventListener('click', () => {
      clicks++;
      fillEl.style.width = Math.min(100, clicks / targetPerfect * 100) + '%';
      const remain = Math.max(0, (duration - (performance.now() - t0)) / 1000);
      statusEl.textContent = `Sisa waktu: ${remain.toFixed(1)}s | Klik: ${clicks}`;
    });
    setTimeout(() => {
      btn.disabled = true;
      let tier, mult, label;
      if (clicks >= targetPerfect) { tier = 'perfect'; mult = 1.6; label = '🌟 RENTETAN PUKULAN SEMPURNA!'; }
      else if (clicks >= targetGood) { tier = 'good'; mult = 1.15; label = '✅ Rentetan cukup deras!'; }
      else { tier = 'miss'; mult = 0.5; label = '💢 Terlalu lambat memukul! Damage -50%'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    }, duration);
  });
}

/* --- 4) Kombo Berirama (multi-hit) --- */
function mgRhythmCombo(player, enemy) {
  return new Promise(resolve => {
    render(box('🎵 Kombo Berirama', `<p class="storytext">Tekan TAP setiap kali penanda memasuki zona emas. Ada 3 ketukan berturut-turut!</p>`));
    const dexBonus = Math.min(10, Math.floor((player.DEX || 0) / 8));
    const zoneW = Math.min(48, 30 + dexBonus);
    const totalBeats = 3;
    let beat = 0, hits = 0;
    const wrap = document.createElement('div');
    const trackWrap = elFromHtml(`<div class="mg-rhythm-track"><div class="mg-zone-good"></div><div class="mg-needle"></div></div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Ketukan 1/${totalBeats}</p>`);
    const btnWrap = elFromHtml(`<div class="mg-act-btn-wrap"><button class="btn primary">🥁 TAP!</button></div>`);
    wrap.appendChild(trackWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const zoneEl = trackWrap.querySelector('.mg-zone-good');
    const needleEl = trackWrap.querySelector('.mg-needle');
    const btn = btnWrap.querySelector('button');
    let raf = null, pos = 0, dir = 1, zoneStart = 0;
    const speed = enemy && enemy.is_boss ? 2.2 : 1.7;
    function newBeat() {
      zoneStart = ri(5, 95 - zoneW);
      zoneEl.style.left = zoneStart + '%'; zoneEl.style.width = zoneW + '%';
      pos = 0; dir = 1;
      statusEl.textContent = `Ketukan ${beat + 1}/${totalBeats}`;
    }
    function tick() {
      pos += dir * speed;
      if (pos >= 100) { pos = 100; dir = -1; }
      if (pos <= 0) { pos = 0; dir = 1; }
      needleEl.style.left = pos + '%';
      raf = requestAnimationFrame(tick);
    }
    newBeat();
    raf = requestAnimationFrame(tick);
    btn.addEventListener('click', () => {
      const hit = pos >= zoneStart && pos <= zoneStart + zoneW;
      if (hit) hits++;
      beat++;
      if (beat >= totalBeats) {
        cancelAnimationFrame(raf); btn.disabled = true;
        let tier, mult, label;
        if (hits >= totalBeats) { tier = 'perfect'; mult = 1.6; label = '🌟 KOMBO SEMPURNA 3/3!'; }
        else if (hits >= 1) { tier = 'good'; mult = 1.15; label = `✅ Kombo lumayan (${hits}/${totalBeats})!`; }
        else { tier = 'miss'; mult = 0.5; label = '💢 Seluruh ketukan meleset! Damage -50%'; }
        mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
      } else {
        newBeat();
      }
    });
  });
}

/* --- 5) Target Reflex --- */
function mgReflexTargets(player, enemy) {
  return new Promise(resolve => {
    render(box('🎯 Target Reflex', `<p class="storytext">Ketuk titik cahaya secepat mungkin sebelum menghilang!</p>`));
    const total = 5;
    const dexBonus = Math.min(300, Math.floor((player.DEX || 0) * 12));
    const visibleMs = Math.max(420, (enemy && enemy.is_boss ? 620 : 750) - Math.floor(dexBonus / 10));
    let hits = 0, idx = 0;
    const wrap = document.createElement('div');
    const fieldEl = elFromHtml(`<div class="mg-reflex-field"></div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Target 1/${total}</p>`);
    wrap.appendChild(fieldEl); wrap.appendChild(statusEl);
    appendEl(wrap);
    function spawn() {
      statusEl.textContent = `Target ${idx + 1}/${total} | Kena: ${hits}`;
      const t = elFromHtml(`<div class="mg-reflex-target">✨</div>`);
      t.style.left = ri(5, 78) + '%'; t.style.top = ri(5, 70) + '%';
      fieldEl.appendChild(t);
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; t.remove(); next(); } }, visibleMs);
      t.addEventListener('click', () => {
        if (done) return;
        done = true; clearTimeout(timer); hits++; t.remove(); next();
      });
    }
    function next() {
      idx++;
      if (idx >= total) {
        let tier, mult, label;
        if (hits >= total) { tier = 'perfect'; mult = 1.6; label = '🌟 SEMUA TARGET KENA!'; }
        else if (hits >= Math.ceil(total / 2)) { tier = 'good'; mult = 1.15; label = `✅ Refleks lumayan (${hits}/${total})!`; }
        else { tier = 'miss'; mult = 0.5; label = `💢 Banyak target lolos (${hits}/${total})! Damage -50%`; }
        mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
        return;
      }
      spawn();
    }
    spawn();
  });
}

/* --- 6) Bidik Titik Lemah --- */
function mgAimReticle(player, enemy) {
  return new Promise(resolve => {
    render(box('🎯 Bidik Titik Lemah', `<p class="storytext">Titik bidik bergerak melingkar. Tekan BIDIK saat tepat berada di atas titik lemah merah!</p>`));
    const wrap = document.createElement('div');
    const fieldEl = elFromHtml(`<div class="mg-aim-field"></div>`);
    const wx = ri(25, 75), wy = ri(25, 75);
    const wp = elFromHtml(`<div class="mg-aim-weakpoint">💢</div>`);
    wp.style.left = `calc(${wx}% - 29px)`; wp.style.top = `calc(${wy}% - 29px)`;
    const reticle = elFromHtml(`<div class="mg-aim-reticle"></div>`);
    fieldEl.appendChild(wp); fieldEl.appendChild(reticle);
    const statusEl = elFromHtml(`<p class="mg-hint">Tekan BIDIK saat reticle tepat di titik lemah!</p>`);
    const btnWrap = elFromHtml(`<div class="mg-aim-btn-wrap"><button class="btn primary">🏹 BIDIK!</button></div>`);
    wrap.appendChild(fieldEl); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const btn = btnWrap.querySelector('button');
    let raf = null;
    const t0 = performance.now();
    const speed = enemy && enemy.is_boss ? 0.0026 : 0.002;
    const radiusX = 34, radiusY = 30, cx = 50, cy = 50;
    function tick(t) {
      const a = (t - t0) * speed;
      const rx = cx + Math.cos(a) * radiusX;
      const ry = cy + Math.sin(a * 1.3) * radiusY;
      reticle.style.left = rx + '%'; reticle.style.top = ry + '%';
      reticle._x = rx; reticle._y = ry;
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    btn.addEventListener('click', () => {
      cancelAnimationFrame(raf); btn.disabled = true;
      const dx = (reticle._x || 0) - wx, dy = (reticle._y || 0) - wy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let tier, mult, label;
      if (dist <= 7) { tier = 'perfect'; mult = 1.6; label = '🌟 TEMBAKAN TEPAT SASARAN!'; }
      else if (dist <= 15) { tier = 'good'; mult = 1.15; label = '✅ Nyaris kena titik lemah!'; }
      else { tier = 'miss'; mult = 0.5; label = '💢 Bidikan meleset jauh! Damage -50%'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    });
  });
}

/* --- 7) Kombo Rune Cepat (dipakai saat memakai Skill) --- */
function mgRuneCombo(player, enemy) {
  return new Promise(resolve => {
    render(box('🪄 Kombo Rune Cepat', `<p class="storytext">Rune akan menyala satu per satu secara acak — ketuk secepat mungkin sebelum cahayanya padam untuk memperkuat mantramu!</p>`));
    const syms = ['🔥', '💧', '🌪️', '⚡'];
    const total = 4;
    const dexBonus = Math.min(300, Math.floor((player.DEX || 0) * 10));
    const visibleMs = Math.max(480, (enemy && enemy.is_boss ? 680 : 800) - Math.floor(dexBonus / 10));
    let hits = 0, idx = 0;
    const wrap = document.createElement('div');
    const gridEl = elFromHtml(`<div class="mg-rune-grid"></div>`);
    const pads = syms.map((s, i) => { const p = elFromHtml(`<div class="mg-rune-pad" data-i="${i}">${s}</div>`); gridEl.appendChild(p); return p; });
    const statusEl = elFromHtml(`<p class="mg-hint">Bersiap...</p>`);
    wrap.appendChild(gridEl); wrap.appendChild(statusEl);
    appendEl(wrap);
    function round() {
      statusEl.textContent = `Rune ${idx + 1}/${total} | Kena: ${hits}`;
      const i = ri(0, 3);
      pads[i].classList.add('lit');
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; pads[i].classList.remove('lit'); nextRound(); } }, visibleMs);
      function handler() {
        if (done) return;
        done = true; clearTimeout(timer); hits++; pads[i].classList.remove('lit'); pads[i].removeEventListener('click', handler); nextRound();
      }
      pads[i].addEventListener('click', handler);
    }
    function nextRound() {
      idx++;
      if (idx >= total) {
        pads.forEach(p => p.classList.add('disabled'));
        let tier, mult, label;
        if (hits >= total) { tier = 'perfect'; mult = 1.6; label = '🌟 MANTRA SEMPURNA TERUCAP!'; }
        else if (hits >= Math.ceil(total / 2)) { tier = 'good'; mult = 1.15; label = `✅ Mantra cukup stabil (${hits}/${total})!`; }
        else { tier = 'miss'; mult = 0.5; label = `💢 Mantra kacau (${hits}/${total})! Damage -50%`; }
        mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
        return;
      }
      round();
    }
    round();
  });
}

/* --- 8) Hindari Proyektil (bullet-dodge ala Undertale) --- */
function mgBulletDodge(player, enemy) {
  return new Promise(resolve => {
    render(box('💨 Hindari Proyektil', `<p class="storytext">Geser jarimu / mouse di dalam kotak untuk menggerakkan sosok cahayamu dan menghindari proyektil musuh selama beberapa detik!</p>`));
    const dexBonus = Math.min(3, Math.floor((player.DEX || 0) / 12));
    let lives = 3 + dexBonus;
    const maxLives = lives;
    const duration = enemy && enemy.is_boss ? 4200 : 3400;
    const wrap = document.createElement('div');
    const fieldEl = elFromHtml(`<div class="mg-dodge-field"></div>`);
    const soul = elFromHtml(`<div class="mg-dodge-soul"></div>`);
    fieldEl.appendChild(soul);
    const heartsEl = elFromHtml(`<p class="mg-dodge-hearts"></p>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Geser jarimu / mouse di dalam kotak untuk bergerak!</p>`);
    wrap.appendChild(fieldEl); wrap.appendChild(heartsEl); wrap.appendChild(statusEl);
    appendEl(wrap);
    let soulX = 50; soul.style.left = soulX + '%';
    function renderHearts() { heartsEl.textContent = '💛'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, maxLives - lives)); }
    renderHearts();
    function moveTo(clientX) {
      const rect = fieldEl.getBoundingClientRect();
      soulX = clampNum(((clientX - rect.left) / rect.width) * 100, 3, 97);
      soul.style.left = soulX + '%';
    }
    function onMove(e) { moveTo(e.touches ? e.touches[0].clientX : e.clientX); }
    fieldEl.addEventListener('pointermove', onMove);
    fieldEl.addEventListener('pointerdown', onMove);

    const bullets = [];
    let ended = false;
    const spawnRate = enemy && enemy.is_boss ? 340 : 460;
    const spawnTimer = setInterval(() => {
      if (ended) return;
      const b = elFromHtml(`<div class="mg-dodge-bullet"></div>`);
      const x = ri(4, 96);
      b.style.left = x + '%';
      fieldEl.appendChild(b);
      bullets.push({ el: b, x, startTime: performance.now(), fallMs: ri(1400, 2000), hit: false, done: false });
    }, spawnRate);

    let raf = null;
    function tick(t) {
      bullets.forEach(bl => {
        if (bl.hit || bl.done) return;
        const prog = (t - bl.startTime) / bl.fallMs;
        if (prog >= 1) { bl.done = true; bl.el.remove(); return; }
        bl.el.style.top = (prog * 100) + '%';
        if (prog > 0.78) {
          if (Math.abs(bl.x - soulX) < 7) {
            bl.hit = true; bl.done = true; bl.el.remove();
            lives = Math.max(0, lives - 1);
            renderHearts();
            soul.classList.add('hit'); setTimeout(() => soul.classList.remove('hit'), 200);
          }
        }
      });
      if (!ended) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    setTimeout(() => {
      ended = true;
      clearInterval(spawnTimer);
      cancelAnimationFrame(raf);
      fieldEl.querySelectorAll('.mg-dodge-bullet').forEach(b => b.remove());
      const hitsTaken = maxLives - lives;
      let tier, mult, label;
      if (hitsTaken <= 0) { tier = 'perfect'; mult = 0; label = '🛡️🌟 BERTAHAN SEMPURNA, TANPA TERGORES!'; }
      else if (hitsTaken <= 1) { tier = 'good'; mult = 0.4; label = '🛡️ Bertahan cukup baik, sedikit tergores!'; }
      else { tier = 'miss'; mult = 1.0; label = '💥 Pertahananmu jebol, banyak proyektil menembus!'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    }, duration);
  });
}

/* --- 9) Parry Sempurna --- */
function mgParryQTE(player, enemy) {
  return new Promise(resolve => {
    render(box('🛡️ Parry Sempurna', `<p class="storytext">Lingkaran merah menyusut mendekati lingkaran target emas. Tekan PARRY tepat saat keduanya berhimpit untuk membalikkan serangan!</p>`));
    const targetSize = 74;
    const wrap = document.createElement('div');
    const parryWrap = elFromHtml(`<div class="mg-parry-wrap"><div class="mg-parry-field">
      <div class="mg-parry-outer"></div>
      <div class="mg-parry-target" style="width:${targetSize}px;height:${targetSize}px;margin:${-targetSize / 2}px 0 0 ${-targetSize / 2}px;"></div>
      <div class="mg-parry-shrink" style="width:160px;height:160px;margin:-80px 0 0 -80px;"></div>
    </div></div>`);
    const statusEl = elFromHtml(`<p class="mg-hint">Tekan PARRY saat cincin merah pas menghimpit cincin emas!</p>`);
    const btnWrap = elFromHtml(`<div class="mg-act-btn-wrap"><button class="btn primary">🛡️ PARRY!</button></div>`);
    wrap.appendChild(parryWrap); wrap.appendChild(statusEl); wrap.appendChild(btnWrap);
    appendEl(wrap);
    const shrinkEl = parryWrap.querySelector('.mg-parry-shrink');
    const btn = btnWrap.querySelector('button');
    let raf = null;
    const t0 = performance.now();
    const totalMs = enemy && enemy.is_boss ? 1250 : 1550;
    const startSize = 160, endSize = 20;
    let curSize = startSize, resolved = false;
    function tick(t) {
      const prog = Math.min(1, (t - t0) / totalMs);
      curSize = startSize + (endSize - startSize) * prog;
      shrinkEl.style.width = curSize + 'px'; shrinkEl.style.height = curSize + 'px';
      shrinkEl.style.margin = (-curSize / 2) + 'px 0 0 ' + (-curSize / 2) + 'px';
      if (prog >= 1) { finish(); return; }
      raf = requestAnimationFrame(tick);
    }
    function finish() {
      if (resolved) return;
      resolved = true;
      cancelAnimationFrame(raf); btn.disabled = true;
      const diff = Math.abs(curSize - targetSize);
      let tier, mult, label;
      if (diff <= 8) { tier = 'perfect'; mult = 0; label = '🛡️🌟 PARRY SEMPURNA! Serangan dibalikkan!'; }
      else if (diff <= 22) { tier = 'good'; mult = 0.4; label = '🛡️ Parry cukup tepat!'; }
      else { tier = 'miss'; mult = 1.0; label = '💥 Parry meleset total!'; }
      mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
    }
    raf = requestAnimationFrame(tick);
    btn.addEventListener('click', finish);
  });
}

/* --- 10) Baris Bertahan (memory guard 3 lajur) --- */
function mgMemoryGuard(player, enemy) {
  return new Promise(resolve => {
    render(box('🧭 Baris Bertahan', `<p class="storytext">Perhatikan arah serangan musuh yang ditelegrafikan, lalu ketuk lajur yang sama secara berurutan untuk memblokirnya!</p>`));
    const lanes = ['◀️ Kiri', '⏺️ Tengah', '▶️ Kanan'];
    const len = enemy && enemy.is_boss ? 4 : 3;
    const sequence = []; for (let i = 0; i < len; i++) sequence.push(ri(0, 2));
    let hits = 0, playerIdx = 0, accepting = false;
    const wrap = document.createElement('div');
    const gridEl = elFromHtml(`<div class="mg-guard-lanes"></div>`);
    const laneEls = lanes.map((l, i) => { const el = elFromHtml(`<div class="mg-guard-lane" data-i="${i}">${l}</div>`); gridEl.appendChild(el); return el; });
    const statusEl = elFromHtml(`<p class="mg-hint">Perhatikan arah serangan...</p>`);
    wrap.appendChild(gridEl); wrap.appendChild(statusEl);
    appendEl(wrap);
    function flash(i, dur) {
      return new Promise(res => {
        laneEls[i].classList.add('telegraph');
        setTimeout(() => { laneEls[i].classList.remove('telegraph'); setTimeout(res, 160); }, dur);
      });
    }
    async function telegraphAll() {
      accepting = false;
      laneEls.forEach(l => l.classList.add('disabled'));
      statusEl.textContent = 'Perhatikan arah serangan musuh...';
      await new Promise(r => setTimeout(r, 400));
      for (const i of sequence) await flash(i, enemy && enemy.is_boss ? 430 : 520);
      statusEl.textContent = `Giliranmu! Blokir ${sequence.length} arah sesuai urutan.`;
      laneEls.forEach(l => l.classList.remove('disabled'));
      accepting = true; playerIdx = 0;
    }
    laneEls.forEach((el, i) => {
      el.addEventListener('click', () => {
        if (!accepting) return;
        const correct = i === sequence[playerIdx];
        el.classList.add(correct ? 'correct' : 'wrong');
        setTimeout(() => el.classList.remove('correct', 'wrong'), 220);
        if (correct) hits++;
        playerIdx++;
        if (playerIdx >= sequence.length) {
          accepting = false;
          laneEls.forEach(l => l.classList.add('disabled'));
          let tier, mult, label;
          if (hits >= sequence.length) { tier = 'perfect'; mult = 0; label = '🛡️🌟 SEMUA ARAH TERBLOKIR SEMPURNA!'; }
          else if (hits >= Math.ceil(sequence.length / 2)) { tier = 'good'; mult = 0.4; label = `🛡️ Sebagian besar terblokir (${hits}/${sequence.length})!`; }
          else { tier = 'miss'; mult = 1.0; label = `💥 Pertahanan gagal (${hits}/${sequence.length})!`; }
          mgFinish(wrap, statusEl, label, { tier, mult, label }, resolve);
        }
      });
    });
    telegraphAll();
  });
}

/* --- Dispatcher: pilih satu mekanik secara acak setiap giliran --- */
async function runOffenseMinigame(player, enemy) {
  const pool = [mgTimingStrike, mgHoldCharge, mgMashButton, mgRhythmCombo, mgReflexTargets, mgAimReticle];
  const fn = choiceArr(pool);
  return await fn(player, enemy);
}
async function runDefenseMinigame(player, enemy) {
  const pool = [mgBulletDodge, mgParryQTE, mgMemoryGuard];
  const fn = choiceArr(pool);
  return await fn(player, enemy);
}

async function battle(player, enemy, floor) {
  let msg = `⚠️ Musuh muncul: ${enemy.name}!`;
  if (enemy.is_boss) {
    render(box('🔥 PERTEMPURAN BOSS 🔥', `
      <div class="boss-warn">🚨 PERTEMPURAN BOSS LANTAI ${floor} 🚨</div>
      <div class="boss-name">${esc(enemy.name.toUpperCase())}</div>
    `));
    await continueBtn('Mulai Pertempuran! ⚔️');
  }

  while (player.hp > 0 && enemy.hp > 0) {
    renderBattleScreen(player, enemy, floor, msg);
    const actions = [
      { label: '⚔️ Serangan Fisik', value: '1' },
      { label: '🪄 Skill Khusus', value: '2' },
      { label: `💖 Potion HP (${player.potions})`, value: '3' },
      { label: `🔷 Potion MP (${player.mana_potions})`, value: '4' },
      { label: `🌟 Elixir (${player.elixirs})`, value: '5' },
      { label: '🏃 Coba Kabur', value: '6', cls: 'danger' },
      { label: '🛡️ Fokus Bertahan', value: '7' },
    ];
    const action = await choose(actions);
    let skipPost = false;
    let guardMult = 1;

    if (action === '1') {
      const mg = await runOffenseMinigame(player, enemy);
      const isCrit = ri(1, 100) <= player.crit_rate;
      const mult = (isCrit ? 1.75 : 1.0) * mg.mult;
      const curseBonus = Math.floor(player.CRS / 3);
      const baseDmg = Math.max(1, player.atk + curseBonus - Math.floor(enemy.defense / 2));
      const dmg = Math.floor((baseDmg + ri(-3, 6)) * mult);
      enemy.hp -= dmg;
      const critText = isCrit ? '💥 KRITIKAL! ' : '';
      msg = `${mg.label} ${critText}Kamu menyerang ${enemy.name} menghasilkan ${dmg} DMG!`;

      if (ri(1, 100) <= Math.floor(player.SPD / 6)) {
        const extraDmg = Math.max(1, Math.floor(player.atk / 2) + ri(-2, 4));
        enemy.hp -= extraDmg;
        msg += ` | ⚡ SPD memicu serangan kilat tambahan! +${extraDmg} DMG!`;
      }
      const lifestealRate = player.race_info.lifesteal || 0;
      if (lifestealRate > 0) {
        const stolen = Math.floor(dmg * lifestealRate);
        player.hp = Math.min(player.max_hp, player.hp + stolen);
        msg += ` (Menyerap +${stolen} HP)`;
      }
      if (player.CRS > 0 && ri(1, 100) <= Math.floor(player.CRS / 8)) {
        const backlash = Math.max(1, Math.floor(player.CRS / 4));
        player.hp -= backlash;
        msg += ` | 🩸 Kutukan membalik! Kamu terluka ${backlash} HP!`;
      }
    } else if (action === '2') {
      const chosenSkill = await chooseSkillForBattle(player);
      if (!chosenSkill) { msg = 'Penggunaan skill dibatalkan.'; skipPost = true; }
      else {
        let mpCost = chosenSkill.cost;
        if (player.race_info.mp_cost_reduce) mpCost = Math.max(1, Math.floor(mpCost * (1 - player.race_info.mp_cost_reduce)));
        if (player.mp < mpCost) { msg = `⚠️ MP tidak mencukupi! Butuh ${mpCost} MP.`; skipPost = true; }
        else {
          player.mp -= mpCost;
          const mg = await skillSignatureMiniGame(player, enemy, chosenSkill);
          const intBonus = Math.floor(player.INT / 2);
          let skillDmg = Math.floor((player.atk + (chosenSkill.dmg || 0) + intBonus + ri(8, 20)) * mg.mult);
          skillDmg = Math.max(1, skillDmg - Math.floor(enemy.defense / 3));
          enemy.hp -= skillDmg;
          msg = `${mg.label} ✨ [${chosenSkill.name}] meledak! ${skillDmg} DMG pada ${enemy.name}! (INT +${intBonus} DMG)`;
          if ((chosenSkill.heal || 0) > 0) {
            player.hp = Math.min(player.max_hp, player.hp + chosenSkill.heal);
            msg += ` (+${chosenSkill.heal} HP Pulih)`;
          }
          if ((chosenSkill.lifesteal || 0) > 0) {
            const stolen = Math.floor(skillDmg * chosenSkill.lifesteal);
            player.hp = Math.min(player.max_hp, player.hp + stolen);
            msg += ` (+${stolen} HP Terserap)`;
          }
          if ((chosenSkill.poison_turns || 0) > 0) {
            enemy.poison_turns = chosenSkill.poison_turns;
            enemy.poison_dmg = chosenSkill.poison_dmg;
            msg += ` | ☠️ ${enemy.name} terinfeksi racun!`;
          }
        }
      }
    } else if (action === '3') {
      if (player.potions > 0) {
        player.potions -= 1;
        const healVal = Math.floor(player.max_hp * 0.45) + 30;
        player.hp = Math.min(player.max_hp, player.hp + healVal);
        msg = `🧪 Meminum Potion HP! (+${healVal} HP)`;
      } else { msg = '⚠️ Potion HP sudah habis!'; skipPost = true; }
    } else if (action === '4') {
      if (player.mana_potions > 0) {
        player.mana_potions -= 1;
        const manaVal = Math.floor(player.max_mp * 0.50) + 25;
        player.mp = Math.min(player.max_mp, player.mp + manaVal);
        msg = `🔷 Meminum Potion MP! (+${manaVal} MP)`;
      } else { msg = '⚠️ Potion MP sudah habis!'; skipPost = true; }
    } else if (action === '5') {
      if (player.elixirs > 0) {
        player.elixirs -= 1;
        player.hp = player.max_hp; player.mp = player.max_mp; player.poison_turns = 0;
        msg = '🌟 Meminum Elixir Purba! HP & MP Pulih 100% dan semua racun disembuhkan!';
      } else { msg = '⚠️ Elixir tidak tersedia!'; skipPost = true; }
    } else if (action === '6') {
      if (enemy.is_boss) { msg = '🚫 Kamu tidak bisa kabur dari pertempuran Boss!'; skipPost = true; }
      else {
        const evasion = player.evasion_rate + 35;
        if (ri(1, 100) <= evasion) {
          render(box(null, `<p class="logmsg">🏃💨 Kamu berhasil meloloskan diri ke lorong yang aman!</p>`));
          await new Promise(r => setTimeout(r, 900));
          return false;
        } else { msg = '❌ Gagal kabur! Musuh menghalangi jalanmu!'; }
      }
    } else if (action === '7') {
      const mg = await runDefenseMinigame(player, enemy);
      guardMult = mg.mult;
      msg = `${mg.label} Kamu memusatkan fokus pertahanan menghadapi ${enemy.name}!`;
    }

    if (skipPost) continue;

    if (enemy.hp > 0 && enemy.poison_turns > 0) {
      enemy.hp -= enemy.poison_dmg;
      enemy.poison_turns -= 1;
      msg += ` | ☠️ Racun mengurangi ${enemy.poison_dmg} HP musuh!`;
    }
    if (enemy.is_boss && enemy.hp > 0) {
      const ratio = enemy.hp / enemy.max_hp;
      if (ratio <= 0.40 && !enemy.enraged) {
        enemy.enraged = true;
        enemy.atk = Math.floor(enemy.atk * 1.35);
        msg += `\n🔥🔥 ${enemy.name} MEMASUKI AMUKAN ENRAGED! Serangannya meningkat pesat!`;
      }
      if (ratio <= 0.15 && !enemy.overdrive) {
        enemy.overdrive = true;
        enemy.atk = Math.floor(enemy.atk * 1.30);
        msg += `\n💢💢💢 ${enemy.name} MEMASUKI OVERDRIVE SEKARAT! Sisa tenaganya berubah jadi amukan mematikan!`;
      }
    }
    if (enemy.hp <= 0) {
      let out = `<div class="win-title">🎉🎉 KEMENANGAN! ${esc(enemy.name)} BERHASIL DIKALAHKAN! 🎉🎉</div>${divider()}`;
      const chaGold = Math.floor(enemy.gold_reward * (player.CHA * 0.01));
      const totalGold = enemy.gold_reward + chaGold;
      player.gold += totalGold;
      out += chaGold > 0
        ? `<p>💰 +${totalGold} Gold (termasuk bonus CHA +${chaGold})</p>`
        : `<p>💰 +${totalGold} Gold</p>`;

      if (enemy.loot_drop && (enemy.is_boss || rf() < 0.75)) {
        // Boss punya peluang menjatuhkan banyak material sekaligus (1-3 stack), musuh elite sarang (1-2 stack).
        const matCount = enemy.is_boss ? ri(1, 3) : (enemy.is_elite && rf() < 0.5 ? 2 : 1);
        for (let i = 0; i < matCount; i++) player.inventory.push(enemy.loot_drop);
        out += matCount > 1
          ? `<p>📦 ${enemy.is_boss ? 'Boss' : 'Buruan sarang'} menjatuhkan LIMPAHAN Material: [${esc(enemy.loot_drop)}] x${matCount}!</p>`
          : `<p>📦 Menemukan Material: [${esc(enemy.loot_drop)}]</p>`;
      }
      const zone = getZoneInfo(floor);
      const zId = zone.id;
      const gearChance = enemy.is_elite ? 0.5 : 0.35;
      if (rf() < gearChance || enemy.is_boss) {
        const wList = WEAPONS_TIER[zId] || [];
        if (wList.length) {
          const w = choiceArr(wList);
          player.weapon_loot.push(Object.assign({}, w));
          out += `<p>🗡️ Senjata Ditemukan: [${esc(w.name)}] (+${w.atk} ATK)</p>`;
        }
      }
      if (rf() < gearChance || enemy.is_boss) {
        const aList = ARMORS_TIER[zId] || [];
        if (aList.length) {
          const a = choiceArr(aList);
          player.armor_loot.push(Object.assign({}, a));
          out += `<p>🛡️ Zirah Ditemukan: [${esc(a.name)}] (+${a.def} DEF)</p>`;
        }
      }
      if (rf() < (enemy.is_boss ? 0.55 : (enemy.is_elite ? 0.35 : 0.25))) {
        const sList = SKILL_SCROLLS_TIER[zId] || [];
        if (sList.length) {
          const s = choiceArr(sList);
          player.skill_loot.push(Object.assign({}, s));
          out += `<p>📜 Gulungan Skill: [${esc(s.name)}]</p>`;
        }
      }
      // Peluang drop LEGENDARIS khusus boss lantai: senjata/zirah/skill jauh di atas
      // tier normal zona tersebut. Boss di lantai "puncak zona" (kelipatan 10) sedikit
      // lebih murah hati ketimbang mini-boss di tengah zona.
      if (enemy.is_boss) {
        const isMajorBoss = (floor % 10 === 0);
        const legendChance = isMajorBoss ? 0.30 : 0.18;
        const legendPool = LEGENDARY_LOOT[zId];
        if (legendPool && rf() < legendChance) {
          const rollType = choiceArr(['weapon', 'armor', 'skill']);
          if (rollType === 'weapon') {
            const lw = Object.assign({}, legendPool.weapon);
            player.weapon_loot.push(lw);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Senjata [${esc(lw.name)}] (+${lw.atk} ATK) berhasil didapat!</p>`;
          } else if (rollType === 'armor') {
            const la = Object.assign({}, legendPool.armor);
            player.armor_loot.push(la);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Zirah [${esc(la.name)}] (+${la.def} DEF) berhasil didapat!</p>`;
          } else {
            const ls = Object.assign({}, legendPool.skill);
            player.skill_loot.push(ls);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Gulungan Skill [${esc(ls.name)}] berhasil didapat!</p>`;
          }
        }
      } else {
        // Peluang kecil "keberuntungan liar": bahkan musuh biasa/elite sarang bisa
        // menjatuhkan item legendaris zona ini. Elite sedikit lebih beruntung.
        // Ini yang bikin SETIAP pertarungan terasa berharga untuk dicoba, bukan cuma boss fight.
        const wildLegendChance = enemy.is_elite ? 0.02 : 0.008;
        const legendPool = LEGENDARY_LOOT[zId];
        if (legendPool && rf() < wildLegendChance) {
          const rollType = choiceArr(['weapon', 'armor', 'skill']);
          if (rollType === 'weapon') {
            const lw = Object.assign({}, legendPool.weapon);
            player.weapon_loot.push(lw);
            out += `<p class="win-title">✨🍀 KEBERUNTUNGAN LIAR! ${esc(enemy.name)} ternyata membawa Senjata [${esc(lw.name)}] (+${lw.atk} ATK)!</p>`;
          } else if (rollType === 'armor') {
            const la = Object.assign({}, legendPool.armor);
            player.armor_loot.push(la);
            out += `<p class="win-title">✨🍀 KEBERUNTUNGAN LIAR! ${esc(enemy.name)} ternyata membawa Zirah [${esc(la.name)}] (+${la.def} DEF)!</p>`;
          } else {
            const ls = Object.assign({}, legendPool.skill);
            player.skill_loot.push(ls);
            out += `<p class="win-title">✨🍀 KEBERUNTUNGAN LIAR! ${esc(enemy.name)} ternyata membawa Gulungan Skill [${esc(ls.name)}]!</p>`;
          }
        }
      }
      const expRes = player.gainExp(enemy.exp_reward);
      out += `<p>✨ +${expRes.amount} EXP!</p>`;
      if (enemy.is_boss) player.bosses_defeated.push(enemy.name);

      render(box(null, out));
      updateHud(player);
      await continueBtn('Lanjutkan ➜');

      if (enemy.is_boss) {
        await handleBossChest(player, floor, enemy);
      }

      for (const ev of expRes.events) {
        render(box('🎉🎉 LEVEL UP! 🎉🎉', `
          <p>Kamu mencapai Level ${ev.level}!</p>
          <p>📈 HP +${ev.hp_gain} | MP +${ev.mp_gain} | ATK +${ev.atk_gain} | DEF +${ev.def_gain}</p>
          <p>✨ STR +${ev.str_gain} | INT +${ev.int_gain} | CHA +${ev.cha_gain} | SPD +${ev.spd_gain} | DEX +${ev.dex_gain}${ev.crs_gain ? ` | CRS +${ev.crs_gain}` : ''}</p>
          <p>💖 HP & MP Dipulihkan Penuh!</p>
        `));
        updateHud(player);
        await continueBtn('Lanjutkan ➜');
      }
      return true;
    }

    const evasionChance = player.evasion_rate;
    if (guardMult <= 0) {
      msg += ` | 🛡️✨ Bertahan sempurna! Serangan ${enemy.name} sama sekali tidak berpengaruh!`;
    } else if (ri(1, 100) <= evasionChance) {
      msg += ` | 🌀 Kamu berhasil MENGHINDARI serangan ${enemy.name}!`;
    } else {
      const dmgTaken = Math.max(guardMult < 1 ? 1 : 2, Math.floor((enemy.atk + ri(-4, 5) - player.defense) * guardMult));
      player.hp -= dmgTaken;
      msg += ` | 👹 ${enemy.name} membalas dengan ${dmgTaken} DMG!`;
      if (guardMult >= 1 && (enemy.name.includes('Beracun') || enemy.name.includes('Bisa') || enemy.is_boss)) {
        if (player.poison_turns === 0 && rf() < 0.25) {
          player.poison_turns = 3;
          player.poison_dmg = Math.max(5, Math.floor(enemy.atk / 6));
          msg += ' | ☠️ Kamu terinfeksi racun musuh!';
        }
      }
    }
    if (player.hp > 0 && player.poison_turns > 0) {
      player.hp -= player.poison_dmg;
      player.poison_turns -= 1;
      msg += ` | ☠️ Racun menggerogoti ${player.poison_dmg} HP milikmu!`;
    }
    player.mp = Math.min(player.max_mp, player.mp + 2);
    updateHud(player);
  }
  return false;
}
