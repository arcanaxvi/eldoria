</script>
<script>
"use strict";
/* ============================================================
   ELDORIA RPG — port JavaScript dari eldo.py
   ============================================================ */
const DATA = JSON.parse(document.getElementById('gamedata').textContent);
const RACES = DATA.RACES, RACE_LORE = DATA.RACE_LORE, BASE_CLASSES = DATA.BASE_CLASSES,
      CLASS_LORE = DATA.CLASS_LORE, CLASS_PROMOTIONS = DATA.CLASS_PROMOTIONS, ZONES = DATA.ZONES,
      BOSS_DATA = DATA.BOSS_DATA, ZONE_ENEMIES = DATA.ZONE_ENEMIES, WEAPONS_TIER = DATA.WEAPONS_TIER,
      ARMORS_TIER = DATA.ARMORS_TIER, SKILL_SCROLLS_TIER = DATA.SKILL_SCROLLS_TIER,
      LOOT_SELL_VALUE = DATA.LOOT_SELL_VALUE, CRAFT_RECIPES = DATA.CRAFT_RECIPES,
      LEGENDARY_LOOT = DATA.LEGENDARY_LOOT,
      STORY_DATA = DATA.STORY_DATA, STORY_EVENTS = DATA.STORY_EVENTS,
      GUARANTEED_STORY_FLOORS = DATA.GUARANTEED_STORY_FLOORS, MAX_FLOORS = DATA.MAX_FLOORS,
      MAX_ACTIVE_SKILLS = DATA.MAX_ACTIVE_SKILLS, PROLOGUE_STORY = DATA.PROLOGUE_STORY;

const EXPLORES_PER_FLOOR = 30;

/* ============================================================
   MODE NERAKA — DUNGEON VS SARANG MONSTER
   ------------------------------------------------------------
   Sarang Monster = tempat grinding. Musuh Elite lebih ringan
   daripada penghuni koridor Dungeon Neraka.

   Dungeon Neraka = konten utama yang JAUH lebih brutal.
   Pemain wajib mengumpulkan "Persiapan Abyss" dari grinding
   Sarang Monster sebelum dapat menjelajah setiap lantai baru.
   ============================================================ */
const HELL_DEN_ELITE_MULT = 1.55;
const HELL_DUNGEON_MULT = { hp: 3.0, atk: 2.35, def: 2.2, exp: 2.1, gold: 1.9 };
const HELL_BOSS_MULT  = { hp: 2.1,  atk: 1.65, def: 1.55, exp: 1.8, gold: 1.6 };

/* Rekomendasi grinding — BUKAN syarat masuk.
   Angka ini hanya dipakai untuk memberi pemain gambaran apakah
   persiapan mereka cukup untuk menghadapi lantai tersebut. */
function getHellGrindRequirement(floor) {
  return 3 + Math.floor((Math.max(1, floor) - 1) / 5);
}

const INITIAL_WEAPONS = {
  "1": {name: "Pedang Baja Tempa", atk: 10, price: 30, lore: "Pedang standar ksatria Eldoria."},
  "2": {name: "Tongkat Kayu Kuno", atk: 8, price: 30, lore: "Menghantarkan energi mana alami."},
  "3": {name: "Belati Kembar Pemburu", atk: 11, price: 30, lore: "Ringan dan sangat cepat."},
  "4": {name: "Palu Perang Suci", atk: 12, price: 30, lore: "Palu besi pelindung kaum suci."},
  "5": {name: "Busur Kayu Elm", atk: 10, price: 30, lore: "Busur jarak jauh berkecepatan tinggi."},
  "6": {name: "Tongkat Tulang Terkutuk", atk: 9, price: 30, lore: "Memancarkan aura kegelapan halus."},
};

/* ---------------- util ---------------- */
function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function rf() { return Math.random(); }
function choiceArr(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }
function fmtSigned(n) { return (n >= 0 ? "+" : "") + n; }

/* ---------------- Player ---------------- */
class Player {
  constructor(name, raceKey, classKey, weaponInfo, bonus, difficulty) {
    this.name = name;
    this.race_key = raceKey;
    this.race_info = RACES[raceKey];
    this.race_name = this.race_info.name;
    this.base_class_info = BASE_CLASSES[classKey];
    this.class_name = this.base_class_info.name;
    this.tier = 1;
    this.difficulty = difficulty || 'normal';
    bonus = bonus || {};
    this.STR = 5 + (this.race_info.str || 0) + (this.base_class_info.str || 0) + (bonus.str || 0);
    this.INT = 5 + (this.race_info.int || 0) + (this.base_class_info.int || 0) + (bonus.int || 0);
    this.CHA = 5 + (this.race_info.cha || 0) + (this.base_class_info.cha || 0) + (bonus.cha || 0);
    this.SPD = 5 + (this.race_info.spd || 0) + (this.base_class_info.spd || 0) + (bonus.spd || 0);
    this.DEX = 5 + (this.race_info.dex || 0) + (this.base_class_info.dex || 0) + (bonus.dex || 0);
    this.CRS = 0 + (this.race_info.crs || 0) + (this.base_class_info.crs || 0) + (bonus.crs || 0);

    this.level = 1;
    this.exp = 0;
    this.exp_needed = 60;
    this.gold = 100;

    this.equipped_weapon = Object.assign({}, weaponInfo);
    this.weapon_upgrade = 0;
    this.equipped_armor = { name: "Zirah Kulit Pemula", def: 4, hp: 20 };
    this.armor_upgrade = 0;

    this.base_max_hp = 120 + this.race_info.hp + this.base_class_info.hp;
    this.max_hp = this.base_max_hp + (this.equipped_armor.hp || 0);
    this.hp = this.max_hp;

    this.base_max_mp = 40 + this.race_info.mp + this.base_class_info.mp;
    this.max_mp = this.base_max_mp;
    this.mp = this.max_mp;

    this.base_atk = 12 + this.race_info.atk + this.base_class_info.atk;
    this.base_def = 2 + (this.race_info.def || 0) + (this.base_class_info.def || 0);

    const initialSkill = {
      name: this.base_class_info.skill_name, cost: this.base_class_info.skill_cost,
      dmg: this.base_class_info.skill_dmg, heal: this.base_class_info.skill_heal || 0,
      lifesteal: this.base_class_info.skill_lifesteal || 0,
      poison_turns: this.base_class_info.skill_poison_turns || 0,
      poison_dmg: this.base_class_info.skill_poison_dmg || 0,
    };
    this.learned_skills = [initialSkill];
    this.active_skills = [Object.assign({}, initialSkill)];

    this.poison_turns = 0;
    this.poison_dmg = 0;

    this.potions = 4;
    this.mana_potions = 3;
    this.elixirs = 1;
    this.inventory = [];
    this.weapon_loot = [];
    this.armor_loot = [];
    this.skill_loot = [];

    this.reputation = 0;
    this.story_flags = [];
    this.quest_flags = [];
    this.bosses_defeated = [];
    this.current_floor = 1;
    this.explore_count = 0;

    /* Mode Neraka: resource hasil grinding untuk mempersiapkan
       diri sebelum memasuki koridor Dungeon Neraka. */
    this.hell_grind = 0;
    this.hell_prepared_floor = 0;
  }

  get atk() {
    const wAtk = (this.equipped_weapon.atk || 0) + this.weapon_upgrade * 6;
    return this.base_atk + wAtk + Math.floor(this.STR / 2);
  }
  get defense() {
    const aDef = (this.equipped_armor.def || 0) + this.armor_upgrade * 5;
    let total = this.base_def + aDef;
    if (this.race_info.def_bonus) total = Math.floor(total * (1 + this.race_info.def_bonus));
    return total;
  }
  get crit_rate() { return (this.race_info.crit || 5) + Math.floor(this.level / 4) + Math.floor(this.DEX / 4); }
  get evasion_rate() { return (this.race_info.evasion || 5) + Math.floor(this.SPD / 5); }
  get shop_discount() { return Math.min(0.30, this.CHA * 0.01); }
  get isHell() { return this.difficulty === 'hell'; }
  get weapon_name() { return this.equipped_weapon.name + (this.weapon_upgrade > 0 ? ` +${this.weapon_upgrade}` : ""); }
  get armor_name() { return this.equipped_armor.name + (this.armor_upgrade > 0 ? ` +${this.armor_upgrade}` : ""); }

  statLine() {
    return `🎯 STR:${this.STR}  🧠 INT:${this.INT}  💬 CHA:${this.CHA}  🌀 SPD:${this.SPD}  🏹 DEX:${this.DEX}  🩸 CRS:${this.CRS}`;
  }
  recalcHpMp() {
    this.max_hp = this.base_max_hp + (this.equipped_armor.hp || 0);
    this.max_mp = this.base_max_mp + (this.equipped_armor.mp || 0);
    this.hp = Math.min(this.hp, this.max_hp);
    this.mp = Math.min(this.mp, this.max_mp);
  }
  equipWeapon(w) {
    if (this.equipped_weapon) this.weapon_loot.push(this.equipped_weapon);
    this.equipped_weapon = Object.assign({}, w);
    this.weapon_upgrade = 0;
  }
  equipArmor(a) {
    if (this.equipped_armor && this.equipped_armor.name !== "Tanpa Zirah") this.armor_loot.push(this.equipped_armor);
    this.equipped_armor = Object.assign({}, a);
    this.armor_upgrade = 0;
    this.recalcHpMp();
  }
  gainExp(amount) {
    if (this.race_info.exp_bonus) amount = Math.floor(amount * (1 + this.race_info.exp_bonus));
    this.exp += amount;
    const events = [];
    while (this.exp >= this.exp_needed) events.push(this.levelUp());
    return { amount, events };
  }
  levelUp() {
    this.level += 1;
    this.exp -= this.exp_needed;
    this.exp_needed = Math.floor(this.exp_needed * 1.45) + 20;

    const hp_gain = 35 + this.tier * 10, mp_gain = 18 + this.tier * 5,
          atk_gain = 8 + this.tier * 2, def_gain = 3 + this.tier;
    const str_gain = 1 + Math.floor(((this.race_info.str || 0) + (this.base_class_info.str || 0)) / 6);
    const int_gain = 1 + Math.floor(((this.race_info.int || 0) + (this.base_class_info.int || 0)) / 6);
    const cha_gain = 1 + Math.floor(((this.race_info.cha || 0) + (this.base_class_info.cha || 0)) / 6);
    const spd_gain = 1 + Math.floor(((this.race_info.spd || 0) + (this.base_class_info.spd || 0)) / 6);
    const dex_gain = 1 + Math.floor(((this.race_info.dex || 0) + (this.base_class_info.dex || 0)) / 6);
    const crs_gain = Math.floor(((this.race_info.crs || 0) + (this.base_class_info.crs || 0)) / 5);

    this.base_max_hp += hp_gain; this.base_max_mp += mp_gain;
    this.base_atk += atk_gain; this.base_def += def_gain;
    this.STR += str_gain; this.INT += int_gain; this.CHA += cha_gain;
    this.SPD += spd_gain; this.DEX += dex_gain; this.CRS += crs_gain;
    this.recalcHpMp();
    this.hp = this.max_hp; this.mp = this.max_mp;

    return { level: this.level, hp_gain, mp_gain, atk_gain, def_gain, str_gain, int_gain, cha_gain, spd_gain, dex_gain, crs_gain };
  }
}

/* ---------------- Enemy ---------------- */
function makeEnemy(name, hp, atk, def_, expReward, goldReward, lootDrop, isBoss) {
  return {
    name, max_hp: hp, hp, atk, defense: def_, exp_reward: expReward, gold_reward: goldReward,
    loot_drop: lootDrop || null, is_boss: !!isBoss, enraged: false, poison_turns: 0, poison_dmg: 0,
  };
}

function getZoneInfo(floor) {
  for (const z of ZONES) if (z.floors[0] <= floor && floor <= z.floors[1]) return z;
  return ZONES[ZONES.length - 1];
}

function getEnemyForFloor(floor, player) {
  const zone = getZoneInfo(floor);
  const monsters = ZONE_ENEMIES[zone.id] || ZONE_ENEMIES[1];
  const [name, hp, atk, defVal, expR, goldR, loot] = choiceArr(monsters);
  // Skala berkelanjutan berdasarkan posisi lantai di dalam zona (dulu memakai floor%10
  // yang reset tiap 10 lantai & membuat musuh di ujung zona jadi TERLEMAH, bukan terkuat).
  const posInZone = floor - zone.floors[0];
  const floorMod = 1 + (posInZone * 0.14);
  const hm = (player && player.isHell) ? HELL_DUNGEON_MULT : null;
  const finalHp = Math.floor(hp * floorMod * (hm ? hm.hp : 1));
  const finalAtk = Math.floor(atk * floorMod * (hm ? hm.atk : 1));
  const finalDef = Math.floor(defVal * floorMod * (hm ? hm.def : 1));
  const finalExp = Math.floor(expR * (hm ? hm.exp : 1));
  const finalGold = Math.floor(goldR * (hm ? hm.gold : 1));
  const finalName = hm ? `${name} (Neraka)` : name;
  return makeEnemy(finalName, finalHp, finalAtk, finalDef, finalExp, finalGold, loot, false);
}

/* Boss lantai: pakai BOSS_DATA jika lantai itu sudah punya boss cerita,
   kalau tidak, generate boss dari musuh zona yang di-scale up jadi versi "penguasa lantai". */
function getFloorBoss(floor, player) {
  const hm = (player && player.isHell) ? HELL_BOSS_MULT : null;

  const scripted = BOSS_DATA[floor];
  if (scripted) {
    const b = Object.assign({ generated: false }, scripted);
    if (hm) {
      b.hp = Math.floor(b.hp * hm.hp);
      b.atk = Math.floor(b.atk * hm.atk);
      b.def = Math.floor(b.def * hm.def);
      b.exp = Math.floor(b.exp * hm.exp);
      b.gold = Math.floor(b.gold * hm.gold);
      b.name = `${b.name} 🔥[Neraka]`;
    }
    return b;
  }

  const zone = getZoneInfo(floor);
  const monsters = ZONE_ENEMIES[zone.id] || ZONE_ENEMIES[1];
  const [baseName, hp, atk, defVal, expR, goldR, loot] = choiceArr(monsters);
  // Dulu boss hanya sedikit lebih kuat dari musuh biasa (mudah dikalahkan 2-3 hit).
  // Sekarang pengganda dasar jauh lebih tinggi + skala per-lantai lebih curam,
  // supaya boss lantai benar-benar terasa seperti "penguasa lantai".
  const floorMod = 1 + (floor * 0.07);
  const name = `Boss Lantai ${floor}: ${baseName} Sang Penguasa${hm ? ' 🔥[Neraka]' : ''}`;
  return {
    generated: true,
    name,
    hp: Math.floor(hp * 6.8 * floorMod * (hm ? hm.hp : 1)),
    atk: Math.floor(atk * 2.9 * floorMod * (hm ? hm.atk : 1)),
    def: Math.floor(defVal * 2.4 * floorMod * (hm ? hm.def : 1)),
    exp: Math.floor(expR * 4.2 * floorMod * (hm ? hm.exp : 1)),
    gold: Math.floor(goldR * 3.8 * floorMod * (hm ? hm.gold : 1)),
    loot: loot,
    intro: `👹 ${baseName} raksasa yang telah menyerap kekuatan gelap lantai ${floor} bangkit menghadangmu!`,
    lore: `Penguasa sementara lantai ${floor}, hasil mutasi ${baseName} yang menyerap sisa energi Abyss di kedalaman ini.`,
  };
}

function learnSkill(player, skill) {
  if (!player.learned_skills.some(s => s.name === skill.name)) {
    player.learned_skills.push(Object.assign({}, skill));
    if (player.active_skills.length < MAX_ACTIVE_SKILLS) player.active_skills.push(Object.assign({}, skill));
    return true;
  }
  return false;
}

/* ============================================================
   UI HELPERS
   ============================================================ */
const screenEl = document.getElementById('screen');
const hudEl = document.getElementById('hud');

function render(html) {
  screenEl.innerHTML = html;
  screenEl.scrollTop = 0;
  window.scrollTo(0, 0);
}
function appendEl(el) { screenEl.appendChild(el); }

function choose(options) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'btnrow';
    options.forEach(o => {
      const b = document.createElement('button');
      b.className = 'btn' + (o.cls ? (' ' + o.cls) : '');
      b.innerHTML = o.label;
      if (o.disabled) { b.disabled = true; }
      else b.onclick = () => { wrap.remove(); resolve(o.value); };
      wrap.appendChild(b);
    });
    appendEl(wrap);
  });
}

function askText(placeholder, defaultVal) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'inputrow';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = placeholder || '';
    inp.value = defaultVal || '';
    inp.className = 'textinput';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'OK ➜';
    const submit = () => { wrap.remove(); resolve(inp.value); };
    btn.onclick = submit;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    wrap.appendChild(inp);
    wrap.appendChild(btn);
    appendEl(wrap);
    setTimeout(() => inp.focus(), 30);
  });
}

function askNumber(min, max, defaultVal) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'inputrow';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = min; inp.max = max;
    inp.value = defaultVal != null ? defaultVal : min;
    inp.className = 'textinput numinput';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'OK ➜';
    const err = document.createElement('div');
    err.className = 'errtext';
    const submit = () => {
      const v = parseInt(inp.value, 10);
      if (isNaN(v) || v < min || v > max) { err.textContent = `⚠️ Masukkan angka ${min}-${max}!`; return; }
      wrap.remove(); resolve(v);
    };
    btn.onclick = submit;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    wrap.appendChild(inp);
    wrap.appendChild(btn);
    wrap.appendChild(err);
    appendEl(wrap);
    setTimeout(() => inp.focus(), 30);
  });
}

function continueBtn(label) {
  return choose([{ label: label || 'Lanjutkan ➜', value: true, cls: 'primary' }]);
}

function updateHud(player) {
  if (!player) { hudEl.innerHTML = ''; hudEl.classList.add('hidden'); return; }
  hudEl.classList.remove('hidden');
  const hpPct = Math.max(0, Math.min(100, Math.round((player.hp / player.max_hp) * 100)));
  const mpPct = Math.max(0, Math.min(100, Math.round((player.mp / player.max_mp) * 100)));
  hudEl.innerHTML = `
    <div class="hud-row">
      <span class="hud-name">${esc(player.name)}${player.isHell ? ' <span style="color:var(--red);font-size:0.75rem;">🔥NERAKA</span>' : ''}</span>
      <span class="hud-tag">Lv.${player.level} ${esc(player.race_name)} ${esc(player.class_name)} (T${player.tier})</span>
      <span class="hud-gold">💰 ${player.gold}G</span>
    </div>
    <div class="bar"><div class="bar-fill hp" style="width:${hpPct}%"></div><span class="bar-label">💖 ${player.hp}/${player.max_hp}</span></div>
    <div class="bar"><div class="bar-fill mp" style="width:${mpPct}%"></div><span class="bar-label">🔷 ${player.mp}/${player.max_mp}</span></div>
    ${player.isHell ? `
      <div class="hud-row" style="margin-top:7px;margin-bottom:0;">
        <span class="hud-tag">🩸 Persiapan Abyss</span>
        <span class="hud-gold">${player.hell_grind}/${getHellGrindRequirement(player.current_floor)} poin ${player.hell_prepared_floor === player.current_floor ? '✅ SIAP' : '⚠️ BELUM SIAP'}</span>
      </div>` : ''}
  `;
}

function box(title, bodyHtml) {
  return `<div class="panel">${title ? `<h2>${title}</h2>` : ''}${bodyHtml}</div>`;
}
function divider() { return `<hr class="sep">`; }

/* ============================================================
   PROMOSI KELAS
   ============================================================ */
async function checkAndPromoteClass(player) {
  const options = CLASS_PROMOTIONS[player.class_name] || [];
  const validOptions = options.filter(o => player.level >= o.req_level);
  if (validOptions.length === 0) return false;

  let body = `<p>Pahlawan <b>${esc(player.name)}</b> telah mencapai Level ${player.level}!</p>
  <p>Pilihlah cabang jalan evolusi takdirmu:</p>${divider()}`;
  validOptions.forEach((opt, i) => {
    const bonusParts = [];
    if (opt.hp) bonusParts.push(`+${opt.hp} HP`);
    if (opt.mp) bonusParts.push(`+${opt.mp} MP`);
    if (opt.atk) bonusParts.push(`+${opt.atk} ATK`);
    if (opt.def) bonusParts.push(`+${opt.def} DEF`);
    body += `<div class="card">
      <div class="card-title">🏆 ${esc(opt.name)}</div>
      <div class="card-desc">📜 ${esc(opt.lore || '')}</div>
      <div class="card-stat">📈 Bonus Stat: ${bonusParts.join(', ')}</div>
      <div class="card-stat">✨ Skill Baru: ${esc(opt.skill_name)} (${opt.skill_cost} MP, +${opt.skill_dmg} DMG)</div>
    </div>`;
  });
  render(box('🌟🌟 EVOLUSI KELAS TINGKAT TINGGI 🌟🌟', body));
  const idx = await choose(validOptions.map((o, i) => ({ label: `Pilih ${esc(o.name)}`, value: i, cls: 'primary' })));
  const chosen = validOptions[idx];

  player.class_name = chosen.name;
  applyClassTheme(player.class_name);
  player.tier += 1;
  player.base_max_hp += chosen.hp || 0;
  player.base_max_mp += chosen.mp || 0;
  player.base_atk += chosen.atk || 0;
  player.base_def += chosen.def || 0;

  const promoBonus = 3 * player.tier;
  player.STR += promoBonus; player.INT += promoBonus; player.CHA += promoBonus;
  player.SPD += promoBonus; player.DEX += promoBonus; player.CRS += Math.floor(promoBonus / 2);

  player.recalcHpMp();
  player.hp = player.max_hp; player.mp = player.max_mp;

  const newSkill = {
    name: chosen.skill_name, cost: chosen.skill_cost, dmg: chosen.skill_dmg,
    heal: chosen.skill_heal || 0, lifesteal: chosen.skill_lifesteal || 0,
    poison_turns: chosen.skill_poison_turns || 0, poison_dmg: chosen.skill_poison_dmg || 0,
  };
  learnSkill(player, newSkill);

  render(box('🎉 EVOLUSI BERHASIL!', `
    <p>Kamu telah berevolusi menjadi: <b>${esc(chosen.name)}</b>!</p>
    <p>✨ Mempelajari jurus pamungkas: [${esc(chosen.skill_name)}]!</p>
    <p>📈 Semua stat tambahan meningkat +${promoBonus} (CRS +${Math.floor(promoBonus / 2)})!</p>
    <p>💖 Status tempur diperkuat secara permanen!</p>
  `));
  updateHud(player);
  await continueBtn('Lanjutkan petualangan ➜');
  return true;
}

/* ============================================================
   SISTEM PERTEMPURAN
   ============================================================ */
async function chooseSkillForBattle(player) {
  let body = '';
  const opts = player.active_skills.map((sk, idx) => {
    let cost = sk.cost;
    if (player.race_info.mp_cost_reduce) cost = Math.max(1, Math.floor(cost * (1 - player.race_info.mp_cost_reduce)));
    const label = `${esc(sk.name)} (${cost} MP) → +${sk.dmg || 0} DMG${sk.heal ? ` | Heal ${sk.heal}` : ''}${sk.lifesteal ? ` | Lifesteal ${Math.round(sk.lifesteal*100)}%` : ''}${sk.poison_turns ? ` | Racun ${sk.poison_dmg}/turn` : ''}`;
    return { label, value: idx };
  });
  opts.push({ label: 'Batal', value: -1, cls: 'danger' });
  render(box('🪄 PILIH SKILL AKTIF', body || '<p>Pilih jurus yang ingin digunakan:</p>'));
  const idx = await choose(opts);
  if (idx === -1) return null;
  return player.active_skills[idx];
}

function renderBattleScreen(player, enemy, floor, msg) {
  let html = `<div class="battle-title">🏰 LANTAI ${floor}/${MAX_FLOORS} ⚔️ ${esc(player.name)} [${esc(player.class_name)}] vs ${esc(enemy.name)}</div>${divider()}`;
  const hpPct = Math.max(0, Math.round((player.hp / player.max_hp) * 100));
  const mpPct = Math.max(0, Math.round((player.mp / player.max_mp) * 100));
  const ehpPct = Math.max(0, Math.round((enemy.hp / enemy.max_hp) * 100));
  html += `<div class="bar"><div class="bar-fill hp" style="width:${hpPct}%"></div><span class="bar-label">👤 HP: ${player.hp}/${player.max_hp}</span></div>`;
  html += `<div class="bar"><div class="bar-fill mp" style="width:${mpPct}%"></div><span class="bar-label">🔷 MP: ${player.mp}/${player.max_mp} | 🛡️ DEF: ${player.defense}</span></div>`;
  html += `<p class="statline">${player.statLine()}</p>`;
  html += `<div class="bar enemy"><div class="bar-fill enemy-hp" style="width:${ehpPct}%"></div><span class="bar-label">👹 ${esc(enemy.name)} HP: ${enemy.hp}/${enemy.max_hp}</span></div>`;
  if (player.poison_turns > 0) html += `<p class="poison">☠️ Kamu keracunan! (${player.poison_turns} turn | -${player.poison_dmg} HP/turn)</p>`;
  if (enemy.poison_turns > 0) html += `<p class="poison">☠️ ${esc(enemy.name)} keracunan! (${enemy.poison_turns} turn | -${enemy.poison_dmg} HP/turn)</p>`;
  html += divider();
  if (msg) html += `<p class="logmsg">${nl2br(msg)}</p>${divider()}`;
  render(box(null, html));
}

async function battle(player, enemy, floor) {
  let msg = `⚠️ Musuh muncul: ${enemy.name}!`;
  if (enemy.is_boss) {
    render(box('🔥 PERTEMPURAN BOSS 🔥', `
      <div class="boss-warn">🚨 PERTEMPURAN BOSS LANTAI ${floor} 🚨</div>
      <div class="boss-name">${esc(enemy.name.toUpperCase())}</div>
    `));
    await continueBtn('Mulai Pertempuran! ⚔️');
  }

  while (player.hp > 0 && enemy.hp > 0) {
    renderBattleScreen(player, enemy, floor, msg);
    const actions = [
      { label: '⚔️ Serangan Fisik', value: '1' },
      { label: '🪄 Skill Khusus', value: '2' },
      { label: `💖 Potion HP (${player.potions})`, value: '3' },
      { label: `🔷 Potion MP (${player.mana_potions})`, value: '4' },
      { label: `🌟 Elixir (${player.elixirs})`, value: '5' },
      { label: '🏃 Coba Kabur', value: '6', cls: 'danger' },
    ];
    const action = await choose(actions);
    let skipPost = false;

    if (action === '1') {
      const isCrit = ri(1, 100) <= player.crit_rate;
      const mult = isCrit ? 1.75 : 1.0;
      const curseBonus = Math.floor(player.CRS / 3);
      const baseDmg = Math.max(1, player.atk + curseBonus - Math.floor(enemy.defense / 2));
      const dmg = Math.floor((baseDmg + ri(-3, 6)) * mult);
      enemy.hp -= dmg;
      const critText = isCrit ? '💥 KRITIKAL! ' : '';
      msg = `${critText}Kamu menyerang ${enemy.name} menghasilkan ${dmg} DMG!`;

      if (ri(1, 100) <= Math.floor(player.SPD / 6)) {
        const extraDmg = Math.max(1, Math.floor(player.atk / 2) + ri(-2, 4));
        enemy.hp -= extraDmg;
        msg += ` | ⚡ SPD memicu serangan kilat tambahan! +${extraDmg} DMG!`;
      }
      const lifestealRate = player.race_info.lifesteal || 0;
      if (lifestealRate > 0) {
        const stolen = Math.floor(dmg * lifestealRate);
        player.hp = Math.min(player.max_hp, player.hp + stolen);
        msg += ` (Menyerap +${stolen} HP)`;
      }
      if (player.CRS > 0 && ri(1, 100) <= Math.floor(player.CRS / 8)) {
        const backlash = Math.max(1, Math.floor(player.CRS / 4));
        player.hp -= backlash;
        msg += ` | 🩸 Kutukan membalik! Kamu terluka ${backlash} HP!`;
      }
    } else if (action === '2') {
      const chosenSkill = await chooseSkillForBattle(player);
      if (!chosenSkill) { msg = 'Penggunaan skill dibatalkan.'; skipPost = true; }
      else {
        let mpCost = chosenSkill.cost;
        if (player.race_info.mp_cost_reduce) mpCost = Math.max(1, Math.floor(mpCost * (1 - player.race_info.mp_cost_reduce)));
        if (player.mp < mpCost) { msg = `⚠️ MP tidak mencukupi! Butuh ${mpCost} MP.`; skipPost = true; }
        else {
          player.mp -= mpCost;
          const intBonus = Math.floor(player.INT / 2);
          let skillDmg = player.atk + (chosenSkill.dmg || 0) + intBonus + ri(8, 20);
          skillDmg = Math.max(1, skillDmg - Math.floor(enemy.defense / 3));
          enemy.hp -= skillDmg;
          msg = `✨ [${chosenSkill.name}] meledak! ${skillDmg} DMG pada ${enemy.name}! (INT +${intBonus} DMG)`;
          if ((chosenSkill.heal || 0) > 0) {
            player.hp = Math.min(player.max_hp, player.hp + chosenSkill.heal);
            msg += ` (+${chosenSkill.heal} HP Pulih)`;
          }
          if ((chosenSkill.lifesteal || 0) > 0) {
            const stolen = Math.floor(skillDmg * chosenSkill.lifesteal);
            player.hp = Math.min(player.max_hp, player.hp + stolen);
            msg += ` (+${stolen} HP Terserap)`;
          }
          if ((chosenSkill.poison_turns || 0) > 0) {
            enemy.poison_turns = chosenSkill.poison_turns;
            enemy.poison_dmg = chosenSkill.poison_dmg;
            msg += ` | ☠️ ${enemy.name} terinfeksi racun!`;
          }
        }
      }
    } else if (action === '3') {
      if (player.potions > 0) {
        player.potions -= 1;
        const healVal = Math.floor(player.max_hp * 0.45) + 30;
        player.hp = Math.min(player.max_hp, player.hp + healVal);
        msg = `🧪 Meminum Potion HP! (+${healVal} HP)`;
      } else { msg = '⚠️ Potion HP sudah habis!'; skipPost = true; }
    } else if (action === '4') {
      if (player.mana_potions > 0) {
        player.mana_potions -= 1;
        const manaVal = Math.floor(player.max_mp * 0.50) + 25;
        player.mp = Math.min(player.max_mp, player.mp + manaVal);
        msg = `🔷 Meminum Potion MP! (+${manaVal} MP)`;
      } else { msg = '⚠️ Potion MP sudah habis!'; skipPost = true; }
    } else if (action === '5') {
      if (player.elixirs > 0) {
        player.elixirs -= 1;
        player.hp = player.max_hp; player.mp = player.max_mp; player.poison_turns = 0;
        msg = '🌟 Meminum Elixir Purba! HP & MP Pulih 100% dan semua racun disembuhkan!';
      } else { msg = '⚠️ Elixir tidak tersedia!'; skipPost = true; }
    } else if (action === '6') {
      if (enemy.is_boss) { msg = '🚫 Kamu tidak bisa kabur dari pertempuran Boss!'; skipPost = true; }
      else {
        const evasion = player.evasion_rate + 35;
        if (ri(1, 100) <= evasion) {
          render(box(null, `<p class="logmsg">🏃💨 Kamu berhasil meloloskan diri ke lorong yang aman!</p>`));
          await new Promise(r => setTimeout(r, 900));
          return false;
        } else { msg = '❌ Gagal kabur! Musuh menghalangi jalanmu!'; }
      }
    }

    if (skipPost) continue;

    if (enemy.hp > 0 && enemy.poison_turns > 0) {
      enemy.hp -= enemy.poison_dmg;
      enemy.poison_turns -= 1;
      msg += ` | ☠️ Racun mengurangi ${enemy.poison_dmg} HP musuh!`;
    }
    if (enemy.is_boss && enemy.hp > 0) {
      const ratio = enemy.hp / enemy.max_hp;
      if (ratio <= 0.40 && !enemy.enraged) {
        enemy.enraged = true;
        enemy.atk = Math.floor(enemy.atk * 1.35);
        msg += `\n🔥🔥 ${enemy.name} MEMASUKI AMUKAN ENRAGED! Serangannya meningkat pesat!`;
      }
      if (ratio <= 0.15 && !enemy.overdrive) {
        enemy.overdrive = true;
        enemy.atk = Math.floor(enemy.atk * 1.30);
        msg += `\n💢💢💢 ${enemy.name} MEMASUKI OVERDRIVE SEKARAT! Sisa tenaganya berubah jadi amukan mematikan!`;
      }
    }
    if (enemy.hp <= 0) {
      let out = `<div class="win-title">🎉🎉 KEMENANGAN! ${esc(enemy.name)} BERHASIL DIKALAHKAN! 🎉🎉</div>${divider()}`;
      const chaGold = Math.floor(enemy.gold_reward * (player.CHA * 0.01));
      const totalGold = enemy.gold_reward + chaGold;
      player.gold += totalGold;
      out += chaGold > 0
        ? `<p>💰 +${totalGold} Gold (termasuk bonus CHA +${chaGold})</p>`
        : `<p>💰 +${totalGold} Gold</p>`;

      if (enemy.loot_drop && (enemy.is_boss || rf() < 0.75)) {
        // Boss punya peluang menjatuhkan banyak material sekaligus (1-3 stack), musuh elite sarang (1-2 stack).
        const matCount = enemy.is_boss ? ri(1, 3) : (enemy.is_elite && rf() < 0.5 ? 2 : 1);
        for (let i = 0; i < matCount; i++) player.inventory.push(enemy.loot_drop);
        out += matCount > 1
          ? `<p>📦 ${enemy.is_boss ? 'Boss' : 'Buruan sarang'} menjatuhkan LIMPAHAN Material: [${esc(enemy.loot_drop)}] x${matCount}!</p>`
          : `<p>📦 Menemukan Material: [${esc(enemy.loot_drop)}]</p>`;
      }
      const zone = getZoneInfo(floor);
      const zId = zone.id;
      const gearChance = enemy.is_elite ? 0.5 : 0.35;
      if (rf() < gearChance || enemy.is_boss) {
        const wList = WEAPONS_TIER[zId] || [];
        if (wList.length) {
          const w = choiceArr(wList);
          player.weapon_loot.push(Object.assign({}, w));
          out += `<p>🗡️ Senjata Ditemukan: [${esc(w.name)}] (+${w.atk} ATK)</p>`;
        }
      }
      if (rf() < gearChance || enemy.is_boss) {
        const aList = ARMORS_TIER[zId] || [];
        if (aList.length) {
          const a = choiceArr(aList);
          player.armor_loot.push(Object.assign({}, a));
          out += `<p>🛡️ Zirah Ditemukan: [${esc(a.name)}] (+${a.def} DEF)</p>`;
        }
      }
      if (rf() < (enemy.is_boss ? 0.55 : (enemy.is_elite ? 0.35 : 0.25))) {
        const sList = SKILL_SCROLLS_TIER[zId] || [];
        if (sList.length) {
          const s = choiceArr(sList);
          player.skill_loot.push(Object.assign({}, s));
          out += `<p>📜 Gulungan Skill: [${esc(s.name)}]</p>`;
        }
      }
      // Peluang drop LEGENDARIS khusus boss lantai: senjata/zirah/skill jauh di atas
      // tier normal zona tersebut. Boss di lantai "puncak zona" (kelipatan 10) sedikit
      // lebih murah hati ketimbang mini-boss di tengah zona.
      if (enemy.is_boss) {
        const isMajorBoss = (floor % 10 === 0);
        const legendChance = isMajorBoss ? 0.30 : 0.18;
        const legendPool = LEGENDARY_LOOT[zId];
        if (legendPool && rf() < legendChance) {
          const rollType = choiceArr(['weapon', 'armor', 'skill']);
          if (rollType === 'weapon') {
            const lw = Object.assign({}, legendPool.weapon);
            player.weapon_loot.push(lw);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Senjata [${esc(lw.name)}] (+${lw.atk} ATK) berhasil didapat!</p>`;
          } else if (rollType === 'armor') {
            const la = Object.assign({}, legendPool.armor);
            player.armor_loot.push(la);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Zirah [${esc(la.name)}] (+${la.def} DEF) berhasil didapat!</p>`;
          } else {
            const ls = Object.assign({}, legendPool.skill);
            player.skill_loot.push(ls);
            out += `<p class="win-title">🌟💎 DROP LEGENDARIS! Gulungan Skill [${esc(ls.name)}] berhasil didapat!</p>`;
          }
        }
      }
      const expRes = player.gainExp(enemy.exp_reward);
      out += `<p>✨ +${expRes.amount} EXP!</p>`;
      if (enemy.is_boss) player.bosses_defeated.push(enemy.name);

      render(box(null, out));
      updateHud(player);
      await continueBtn('Lanjutkan ➜');

      for (const ev of expRes.events) {
        render(box('🎉🎉 LEVEL UP! 🎉🎉', `
          <p>Kamu mencapai Level ${ev.level}!</p>
          <p>📈 HP +${ev.hp_gain} | MP +${ev.mp_gain} | ATK +${ev.atk_gain} | DEF +${ev.def_gain}</p>
          <p>✨ STR +${ev.str_gain} | INT +${ev.int_gain} | CHA +${ev.cha_gain} | SPD +${ev.spd_gain} | DEX +${ev.dex_gain}${ev.crs_gain ? ` | CRS +${ev.crs_gain}` : ''}</p>
          <p>💖 HP & MP Dipulihkan Penuh!</p>
        `));
        updateHud(player);
        await continueBtn('Lanjutkan ➜');
      }
      return true;
    }

    const evasionChance = player.evasion_rate;
    if (ri(1, 100) <= evasionChance) {
      msg += ` | 🌀 Kamu berhasil MENGHINDARI serangan ${enemy.name}!`;
    } else {
      const dmgTaken = Math.max(2, enemy.atk + ri(-4, 5) - player.defense);
      player.hp -= dmgTaken;
      msg += ` | 👹 ${enemy.name} membalas dengan ${dmgTaken} DMG!`;
      if (enemy.name.includes('Beracun') || enemy.name.includes('Bisa') || enemy.is_boss) {
        if (player.poison_turns === 0 && rf() < 0.25) {
          player.poison_turns = 3;
          player.poison_dmg = Math.max(5, Math.floor(enemy.atk / 6));
          msg += ' | ☠️ Kamu terinfeksi racun musuh!';
        }
      }
    }
    if (player.hp > 0 && player.poison_turns > 0) {
      player.hp -= player.poison_dmg;
      player.poison_turns -= 1;
      msg += ` | ☠️ Racun menggerogoti ${player.poison_dmg} HP milikmu!`;
    }
    player.mp = Math.min(player.max_mp, player.mp + 2);
    updateHud(player);
  }
  return false;
}

async function shopMenu(player) {
  let msg = '';
  while (true) {
    const zone = getZoneInfo(player.current_floor);
    const zId = zone.id;
    const disc = player.shop_discount;
    const pricePotion = Math.max(1, Math.floor(35 * (1 - disc)));
    const priceMana = Math.max(1, Math.floor(30 * (1 - disc)));
    const priceElixir = Math.max(1, Math.floor(150 * (1 - disc)));

    let body = `<p>💰 Gold Kamu: ${player.gold}G | 🏰 Lokasi: ${esc(zone.name)}</p>`;
    if (disc > 0) body += `<p>💬 Diskon CHA: -${Math.round(disc * 100)}% untuk semua pembelian!</p>`;
    if (msg) body += `<p class="logmsg">💬 ${nl2br(msg)}</p>`;
    render(box('🏬 TOKO & PANDAI BESI KOTA', body));

    const pilihan = await choose([
      { label: `🧪 Potion HP (+45% HP) — ${pricePotion}G`, value: '1' },
      { label: `🔷 Potion MP (+50% MP) — ${priceMana}G`, value: '2' },
      { label: `🌟 Elixir Purba (Full) — ${priceElixir}G`, value: '3' },
      { label: '🗡️ Beli Senjata Zona Ini', value: '4' },
      { label: '🛡️ Beli Zirah Zona Ini', value: '5' },
      { label: '🔨 Tempa & Upgrade (+1 s/d +10)', value: '6' },
      { label: '🛠️ Meja Crafting Material', value: '7' },
      { label: '💰 Jual Material Monster', value: '8' },
      { label: '💰 Jual Senjata/Zirah/Scroll', value: '9' },
      { label: '↩️ Kembali ke Dungeon', value: '0', cls: 'danger' },
    ]);

    if (pilihan === '1') {
      if (player.gold >= pricePotion) { player.gold -= pricePotion; player.potions += 1; msg = 'Berhasil membeli 1 Potion HP!'; }
      else msg = 'Gold tidak cukup untuk membeli Potion HP!';
    } else if (pilihan === '2') {
      if (player.gold >= priceMana) { player.gold -= priceMana; player.mana_potions += 1; msg = 'Berhasil membeli 1 Potion MP!'; }
      else msg = 'Gold tidak cukup untuk membeli Potion MP!';
    } else if (pilihan === '3') {
      if (player.gold >= priceElixir) { player.gold -= priceElixir; player.elixirs += 1; msg = 'Berhasil membeli 1 Elixir Purba!'; }
      else msg = 'Gold tidak cukup untuk membeli Elixir!';
    } else if (pilihan === '4') {
      const wList = WEAPONS_TIER[zId] || [];
      let b2 = '';
      wList.forEach((w, i) => {
        const wPrice = Math.max(1, Math.floor(w.price * (1 - disc)));
        b2 += `<div class="card"><div class="card-title">${esc(w.name)} (+${w.atk} ATK) — ${wPrice}G</div><div class="card-desc">${esc(w.lore || '')}</div></div>`;
      });
      render(box('🗡️ ETALASE SENJATA', b2));
      const opts = wList.map((w, i) => ({ label: `Beli ${esc(w.name)}`, value: i }));
      opts.push({ label: 'Batal', value: -1, cls: 'danger' });
      const sel = await choose(opts);
      if (sel !== -1) {
        const chosen = wList[sel];
        const wPrice = Math.max(1, Math.floor(chosen.price * (1 - disc)));
        if (player.gold >= wPrice) { player.gold -= wPrice; player.equipWeapon(chosen); msg = `Berhasil membeli dan memasang [${chosen.name}]!`; }
        else msg = 'Gold tidak cukup!';
      } else msg = 'Batal membeli senjata.';
    } else if (pilihan === '5') {
      const aList = ARMORS_TIER[zId] || [];
      let b2 = '';
      aList.forEach((a) => { b2 += `<div class="card"><div class="card-title">${esc(a.name)} (+${a.def} DEF, +${a.hp || 0} HP) — ${Math.max(1, Math.floor(a.price * (1 - disc)))}G</div></div>`; });
      render(box('🛡️ ETALASE ZIRAH', b2));
      const opts = aList.map((a, i) => ({ label: `Beli ${esc(a.name)}`, value: i }));
      opts.push({ label: 'Batal', value: -1, cls: 'danger' });
      const sel = await choose(opts);
      if (sel !== -1) {
        const chosen = aList[sel];
        const aPrice = Math.max(1, Math.floor(chosen.price * (1 - disc)));
        if (player.gold >= aPrice) { player.gold -= aPrice; player.equipArmor(chosen); msg = `Berhasil membeli dan mengenakan [${chosen.name}]!`; }
        else msg = 'Gold tidak cukup!';
      } else msg = 'Batal membeli zirah.';
    } else if (pilihan === '6') {
      await upgradeMenu(player); msg = 'Selesai dari pandai besi.';
    } else if (pilihan === '7') {
      await craftingMenu(player); msg = 'Selesai dari meja crafting.';
    } else if (pilihan === '8') {
      await sellMaterialsMenu(player); msg = 'Selesai menjual material.';
    } else if (pilihan === '9') {
      await sellEquipmentMenu(player); msg = 'Selesai menjual perlengkapan.';
    } else if (pilihan === '0') {
      break;
    }
    updateHud(player);
  }
}

    render(box('🔨 PANDAI BESI: TEMPA & UPGRADE', `
      <p>💰 Gold Kamu: ${player.gold}G</p>
      <p>⚔️ Senjata Saat Ini: ${esc(player.weapon_name)} (+${player.atk} Total ATK)</p>
      <p>🛡️ Zirah Saat Ini: ${esc(player.armor_name)} (+${player.defense} Total DEF)</p>

        player.gold -= aCost; player.armor_upgrade += 1;

async function craftingMenu(player) {
  let msg = '';
  while (true) {
    let body = '';
    CRAFT_RECIPES.forEach((r) => {
      const canCraft = Object.entries(r.requires).every(([k, v]) => player.inventory.filter(x => x === k).length >= v);
      const status = canCraft ? '✅ SIAP' : '❌ KURANG';
      const reqStr = Object.entries(r.requires).map(([k, v]) => `${v}x ${k}`).join(', ');
      const statStr = r.type === 'weapon' ? `+${r.atk || 0} ATK` : `+${r.def || 0} DEF, +${r.hp || 0} HP`;
      body += `<div class="card">
        <div class="card-title">${status} [${esc(r.name)}] (${statStr})</div>
        <div class="card-desc">Butuh: ${esc(reqStr)}</div>
        <div class="card-desc">Lore: ${esc(r.desc || '')}</div>
      </div>`;
    });
    if (msg) body += `<p class="logmsg">💬 ${nl2br(msg)}</p>`;
    render(box('🛠️ MEJA TEMPA RESEP MATERIAL', body));
    const opts = CRAFT_RECIPES.map((r, i) => {
      const canCraft = Object.entries(r.requires).every(([k, v]) => player.inventory.filter(x => x === k).length >= v);
      return { label: `Tempa ${esc(r.name)}`, value: i, disabled: !canCraft };
    });
    opts.push({ label: '↩️ Kembali', value: -1, cls: 'danger' });
    const ch = await choose(opts);
    if (ch === -1) break;
    const r = CRAFT_RECIPES[ch];
    const canCraft = Object.entries(r.requires).every(([k, v]) => player.inventory.filter(x => x === k).length >= v);
    if (canCraft) {
      for (const [k, v] of Object.entries(r.requires)) {
        for (let i = 0; i < v; i++) {
          const idx = player.inventory.indexOf(k);
          if (idx !== -1) player.inventory.splice(idx, 1);
        }
      }
      if (r.type === 'weapon') player.equipWeapon({ name: r.name, atk: r.atk });
      else player.equipArmor({ name: r.name, def: r.def, hp: r.hp || 0 });
      msg = `🎉 Berhasil menempa [${r.name}] dan langsung dipasangkan!`;
    } else msg = 'Material monster belum mencukupi untuk resep ini!';
    updateHud(player);
  }
}

async function sellMaterialsMenu(player) {
  let msg = '';
  while (true) {
    const sellMult = 1 + (player.CHA * 0.005);
    if (!player.inventory.length) {
      render(box('💰 JUAL MATERIAL MONSTER', `<p>💰 Gold Kamu: ${player.gold}G</p><p>(Tidak ada material monster di dalam tas.)</p>`));
      await continueBtn('Kembali ➜');
      return;
    }
    const uniqueItems = Array.from(new Set(player.inventory)).sort();
    let body = `<p>💰 Gold Kamu: ${player.gold}G</p>`;
    if (player.CHA > 5) body += `<p>💬 Bonus CHA: harga jual +${Math.round((sellMult - 1) * 100)}%!</p>`;
    uniqueItems.forEach((item) => {
      const count = player.inventory.filter(x => x === item).length;
      const val = Math.floor((LOOT_SELL_VALUE[item] || 25) * sellMult);
      body += `<div class="card"><div class="card-title">${esc(item)} x${count}</div><div class="card-desc">${val}G / item (Total: ${val * count}G)</div></div>`;
    });
    if (msg) body += `<p class="logmsg">💬 ${nl2br(msg)}</p>`;
    render(box('💰 JUAL MATERIAL MONSTER', body));

    const opts = uniqueItems.map((item, i) => ({ label: `Jual ${esc(item)}`, value: `i${i}` }));
    opts.push({ label: '💰 Jual SEMUA Sekaligus', value: '99', cls: 'primary' });
    opts.push({ label: '↩️ Kembali', value: '0', cls: 'danger' });
    const ch = await choose(opts);

    if (ch === '0') break;
    else if (ch === '99') {
      let totalEarned = 0;
      for (const itm of player.inventory.slice()) totalEarned += Math.floor((LOOT_SELL_VALUE[itm] || 25) * sellMult);
      player.inventory.length = 0;
      player.gold += totalEarned;
      msg = `Menjual seluruh material mendapatkan ${totalEarned}G!`;
    } else if (ch.startsWith('i')) {
      const target = uniqueItems[parseInt(ch.slice(1), 10)];
      const cnt = player.inventory.filter(x => x === target).length;
      const val = Math.floor((LOOT_SELL_VALUE[target] || 25) * sellMult);
      const amt = await askNumber(1, cnt, cnt);
      for (let i = 0; i < amt; i++) {
        const idx = player.inventory.indexOf(target);
        if (idx !== -1) player.inventory.splice(idx, 1);
      }
      const earned = val * amt;
      player.gold += earned;
      msg = `Menjual ${amt}x ${target} seharga ${earned}G!`;
    }
    updateHud(player);
  }
}

async function sellEquipmentMenu(player) {

  while (true) {

      items.push({ kind: 'armor', idx: i, obj: a, price });
      body += `<div class="card"><div class="card-title">🛡️ ${esc(a.name)} (+${a.def} DEF) → ${price}G</div></div>`;
    });
    player.skill_loot.forEach((s, i) => {
      const price = s.sell_price != null ? s.sell_price : 100;

      body += `<div class="card"><div class="card-title">📜 ${esc(s.name)} → ${price}G</div></div>`;

    render(box('💰 JUAL PERLENGKAPAN SIMPANAN', body));

    const opts = items.map((it, i) => ({ label: `Jual ${esc(it.obj.name)}`, value: i }));
    opts.push({ label: '↩️ Kembali', value: -1, cls: 'danger' });
    const ch = await choose(opts);
    if (ch === -1) break;
    const it = items[ch];
    if (it.kind === 'weapon') player.weapon_loot.splice(it.idx, 1);

    player.gold += it.price;

    updateHud(player);
  }
}

async function manageActiveSkills(player) {
  while (true) {
    let body = `<p>Total Skill Dikuasai: ${player.learned_skills.length}</p>`;
    player.learned_skills.forEach((sk) => {
      const isActive = player.active_skills.some(s => s.name === sk.name);
      let statDesc = `+${sk.dmg || 0} DMG`;
      if (sk.heal) statDesc += ` | +${sk.heal} Heal`;
      if (sk.lifesteal) statDesc += ` | ${Math.round(sk.lifesteal * 100)}% Lifesteal`;
      if (sk.poison_turns) statDesc += ` | Racun ${sk.poison_dmg}/turn`;
      const status = isActive ? '✅ AKTIF' : '⬜ Nonaktif';
      body += `<div class="card"><div class="card-title">${status} — ${esc(sk.name)} (${sk.cost} MP)</div><div class="card-desc">${statDesc}</div></div>`;
    });
    render(box('🪄 PENGATURAN SKILL AKTIF (MAKS 3)', body));
    const opts = player.learned_skills.map((sk, i) => {
      const isActive = player.active_skills.some(s => s.name === sk.name);
      return { label: `${isActive ? 'Matikan' : 'Aktifkan'}: ${esc(sk.name)}`, value: i };
    });
    opts.push({ label: '↩️ Selesai & Kembali', value: -1, cls: 'danger' });
    const idx = await choose(opts);
    if (idx === -1) break;
    const chosen = player.learned_skills[idx];
    const existing = player.active_skills.findIndex(s => s.name === chosen.name);
    if (existing !== -1) {
      if (player.active_skills.length > 1) player.active_skills.splice(existing, 1);
      else { render(box(null, '<p class="logmsg">⚠️ Kamu harus membawa minimal 1 skill aktif!</p>')); await continueBtn(); }
    } else {
      if (player.active_skills.length < MAX_ACTIVE_SKILLS) player.active_skills.push(Object.assign({}, chosen));
      else { render(box(null, `<p class="logmsg">⚠️ Slot skill penuh! Matikan salah satu dari ${MAX_ACTIVE_SKILLS} skill aktif terlebih dahulu.</p>`)); await continueBtn(); }
    }
  }
}

/* ============================================================
   SARANG MONSTER (khusus Mode Neraka) — grinding strategis:
   pemain memilih SATU jenis musuh dari zona ini untuk dihadapi berturut-turut
   sebagai versi Elite. Tiap gelombang yang dimenangkan bertambah kuat, tapi
   loot & exp juga ikut naik — pemain sendiri yang memutuskan kapan berhenti.
   ============================================================ */
async function denMenu(player) {
  const zone = getZoneInfo(player.current_floor);
  const monsters = ZONE_ENEMIES[zone.id] || ZONE_ENEMIES[1];
  const required = getHellGrindRequirement(player.current_floor);

  let body = `<p class="storytext">🕳️ Kabut merah pekat menuntunmu ke celah tersembunyi di dinding dungeon.</p>`;
  body += `<p class="storytext">Di sinilah para petualang mengasah diri sebelum kembali menghadapi koridor Dungeon Neraka. Monster sarang memang ganas, tetapi <b>masih lebih lemah daripada monster koridor Dungeon Neraka</b>.</p>`;
  body += `<p class="statline">🔥 Persiapan Abyss saat ini: <b>${player.hell_grind}</b> poin | Rekomendasi lantai ${player.current_floor}: <b>${required}</b> poin.</p>`;
  body += `<p class="statline">Menang setiap gelombang memberi Persiapan Abyss sebagai bekal. Tidak ada jumlah minimum yang diwajibkan untuk masuk dungeon. Semakin lama bertahan, semakin besar EXP, Gold, loot, dan Persiapan Abyss yang diperoleh. Mundur setelah menang tetap menyimpan hasil grinding.</p>`;
  

  const opts = monsters.map((m, i) => ({
    label: `${m[0]} (HP~${m[1]} / ATK~${m[2]} / DEF~${m[3]})`, value: i,
  }));
  opts.push({ label: '↩️ Batal, Kembali ke Lantai', value: -1, cls: 'danger' });
  const sel = await choose(opts);
  if (sel === -1) return;

  const template = monsters[sel];
  const [baseName, baseHp, baseAtk, baseDef, baseExp, baseGold, loot] = template;

  let wave = 1;
  while (player.hp > 0) {
    /* Sarang sengaja dibuat lebih mudah daripada Dungeon Neraka.
       Ia adalah tempat grinding, bukan jalur utama. */
    const eliteMod = HELL_DEN_ELITE_MULT + (wave - 1) * 0.20;
    const rewardMod = 1.35 + (wave - 1) * 0.16;
    const enemy = makeEnemy(
      `${baseName} Elite (Gelombang ${wave})`,
      Math.floor(baseHp * eliteMod), Math.floor(baseAtk * eliteMod), Math.floor(baseDef * eliteMod),
      Math.floor(baseExp * rewardMod), Math.floor(baseGold * rewardMod), loot, false
    );
    enemy.is_elite = true;

    
    await continueBtn('Hadapi Gelombang! ⚔️');

    const won = await battle(player, enemy, player.current_floor);
    if (player.hp <= 0) return;
    if (!won) {
      render(box(null, `<p class="logmsg">🏃 Kamu mundur dari Sarang Monster. Persiapan Abyss yang sudah dikumpulkan tetap tersimpan.</p>`));
      await continueBtn('Kembali ➜');
      return;
    }

    const grindGain = 2 + zone.id + Math.floor(wave / 3);
    player.hell_grind += grindGain;

    const reqNow = getHellGrindRequirement(player.current_floor);
    render(box(null, `
      <p class="logmsg">🩸 Gelombang ${wave} berhasil ditumbangkan!</p>
      <p>🔥 Persiapan Abyss +${grindGain}. Total: <b>${player.hell_grind}</b> / ${reqNow} untuk kesiapan lantai ini.</p>
      <p class="statline">Sarang Monster masih berada di bawah tingkat ancaman Dungeon Neraka. Jangan terlalu percaya diri.</p>
    `));

    const cont = await choose([
      { label: `➡️ Lanjut Gelombang ${wave + 1} (Lebih Kuat & Grinding Lebih Besar)`, value: 'continue', cls: 'primary' },
      { label: '🚪 Cukup, Kembali ke Lantai', value: 'leave', cls: 'danger' },
    ]);
    if (cont === 'leave') return;
    wave += 1;
    updateHud(player);
  }
}

function saveGameToFile(player) {
  const data = playerToSaveData(player);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'eldoria_save.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function pickSaveFile() {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json';
    inp.onchange = () => {
      const file = inp.files[0];
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.onload = () => {
        try { resolve(JSON.parse(reader.result)); } catch (e) { resolve(null); }
      };
      reader.onerror = () => resolve(null);
      reader.readAsText(file);
    };
    inp.click();
  });
}

/* ============================================================
   PEMBUATAN KARAKTER
   ============================================================ */
async function allocateBonusStats() {
  const pointsTotal = 15;
  const labels = {
    str: '🎯 STR (Strength — Kekuatan Fisik/ATK)',
    int: '🧠 INT (Intelligence — Daya Sihir/Skill)',
    cha: '💬 CHA (Charisma — Diskon Toko & Gold)',
    spd: '🌀 SPD (Speed — Evasion & Serangan Kilat)',
    dex: '🏹 DEX (Dexterity — Critical & Evasion)',
    crs: '🩸 CRS (Curse — Kutukan, Damage Ekstra tapi Berisiko)',
  };
  const keys = Object.keys(labels);

  return new Promise((resolve) => {
    function draw() {
      let body = `<p>Kamu memiliki <b>${pointsTotal}</b> poin bakat untuk dibagikan ke 6 stat berikut. Sisa poin otomatis masuk ke STR.</p>${divider()}`;
      body += `<div id="statform">`;
      keys.forEach(k => {
        body += `<div class="statrow"><label>${labels[k]}</label><input type="number" min="0" max="${pointsTotal}" value="0" id="stat_${k}" class="statinput"></div>`;
      });
      body += `</div><p id="statremain" class="statline">Sisa poin: ${pointsTotal}</p>`;
      render(box('🌟 DISTRIBUSI BAKAT STAT TAMBAHAN', body));

      const inputs = {};
      keys.forEach(k => { inputs[k] = document.getElementById(`stat_${k}`); });
      const remainEl = document.getElementById('statremain');
      function recalcRemain() {
        let used = 0;
        keys.forEach(k => { used += Math.max(0, parseInt(inputs[k].value, 10) || 0); });
        const remain = pointsTotal - used;
        remainEl.textContent = `Sisa poin: ${remain}`;
        remainEl.classList.toggle('overspend', remain < 0);
        return remain;
      }
      keys.forEach(k => inputs[k].addEventListener('input', recalcRemain));
      recalcRemain();

      choose([{ label: 'Selesai & Mulai Petualangan ➜', value: true, cls: 'primary' }]).then(() => {
        const stats = { str: 0, int: 0, cha: 0, spd: 0, dex: 0, crs: 0 };
        let used = 0;
        keys.forEach(k => {
          const v = Math.max(0, Math.min(pointsTotal, parseInt(inputs[k].value, 10) || 0));
          stats[k] = v; used += v;
        });
        if (used > pointsTotal) {
          // terlalu banyak dialokasikan: skala ulang sederhana, sisakan minimal 0
          let excess = used - pointsTotal;
          for (const k of keys) {
            if (excess <= 0) break;
            const cut = Math.min(stats[k], excess);
            stats[k] -= cut; excess -= cut;
          }
        } else if (used < pointsTotal) {
          stats.str += (pointsTotal - used);
        }
        resolve(stats);
      });
    }
    draw();
  });
}

function applyClassTheme(className) {
  const body = document.body;
  [...body.classList].filter(c => c.startsWith('class-theme-')).forEach(c => body.classList.remove(c));
  if (className) body.classList.add('class-theme-' + classThemeKey(className));
  body.dataset.classTheme = className || '';
}

function selectCardGrid(items, kind) {
  return new Promise(resolve => {
    const grid = document.createElement('div');
    grid.className = 'selection-grid';
    items.forEach(item => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `select-card ${kind === 'race' ? 'race-card' : kind === 'class' ? 'class-card' : 'weapon-card'}`;
      b.innerHTML = item.html;
      b.onclick = () => {
        grid.querySelectorAll('.select-card').forEach(x => x.classList.remove('race-selected','class-selected'));
        b.classList.add(kind === 'race' ? 'race-selected' : kind === 'class' ? 'class-selected' : 'weapon-selected');
      if (kind === 'class' && item && (item.name || item.label)) {
        window.setEldoriaClassTheme(item.name || item.label);
        document.dispatchEvent(new CustomEvent('eldoria:class-selected', { detail: { name: item.name || item.label } }));
      }

        grid.remove();
        resolve(item.value);
      };
      grid.appendChild(b);
    });
    appendEl(grid);
  });
}

/* ============================================================
   EVENT PLOT & RANDOM ENCOUNTER
   ============================================================ */
function findEventByFlag(flag) {
  for (const zoneEvents of Object.values(STORY_EVENTS)) {
    for (const ev of zoneEvents) if (ev[0] === flag) return ev;
  }
  return null;
}

async function runStoryEvent(player, event) {
  const [flag, text] = event;
  player.story_flags.push(flag);

  let body = `<p class="storytext">${nl2br(text)}</p>`;
  if (event.length === 3) {
    const choices = event[2];
    render(box(null, body));
    const idx = await choose(choices.map((c, i) => ({ label: esc(c.label), value: i })));
    const sel = choices[idx];
    player.reputation += sel.rep || 0;
    if (sel.stat) {
      const [statName, val] = sel.stat;
      player[statName] = (player[statName] || 0) + val;
    }
    if (sel.flag) player.quest_flags.push(sel.flag);

    let repTxt = '';
    if ((sel.rep || 0) > 0) repTxt = `(+${sel.rep} Reputasi)`;
    else if ((sel.rep || 0) < 0) repTxt = `(${sel.rep} Reputasi)`;
    render(box(null, `<p class="storytext">${nl2br(text)}</p>${divider()}<p>💬 ${esc(sel.result || 'Pilihanmu telah menentukan arah takdirmu.')}</p>${repTxt ? `<p class="statline">${repTxt}</p>` : ''}`));
  } else {
    if (flag.includes('seal_fragment')) { player.inventory.push('Pecahan Segel Eldoria'); player.reputation += 10; }
    else if (flag.includes('kael') || flag.includes('truth') || flag.includes('elara') || flag.includes('prayer')) {
      player.quest_flags.push(flag); player.reputation += 5;
    }
    render(box(null, body));
  }
  updateHud(player);
  await continueBtn('Lanjutkan ➜');
  return true;
}

async function triggerStoryOrEvent(player, floor) {
  const zone = getZoneInfo(floor);
  const events = STORY_EVENTS[zone.id] || [];

  const guaranteedFlag = GUARANTEED_STORY_FLOORS[floor];
  if (guaranteedFlag && !player.story_flags.includes(guaranteedFlag)) {
    const event = findEventByFlag(guaranteedFlag);
    if (event) return await runStoryEvent(player, event);
  }

  const available = events.filter(e => !player.story_flags.includes(e[0]));
  if (available.length && rf() < 0.35) {
    return await runStoryEvent(player, choiceArr(available));
  }

  const roll = rf();
  if (roll < 0.20) {
    player.hp = player.max_hp; player.mp = player.max_mp; player.poison_turns = 0;
    render(box('💧 MATA AIR SUCI PURBA 💧', '<p>Kamu menemukan kubangan mata air berkilau cahaya biru.</p><p>Meminumnya memulihkan HP & MP sampai batas penuh!</p>'));
    updateHud(player);
    await continueBtn('Lanjutkan ➜');
    return true;
  } else if (roll < 0.35) {
    const goldFound = ri(40, 90) * zone.id;
    player.gold += goldFound;
    let extra = '';
    if (rf() < 0.40) { player.potions += 1; extra = '<p>🧪 Mendapatkan tambahan +1 Potion HP!</p>'; }
    render(box('📦 PETI HARTA TERSEMBUNYI! 📦', `<p>Kamu membongkar peti kuno dan menemukan +${goldFound} Gold!</p>${extra}`));
    updateHud(player);
    await continueBtn('Lanjutkan ➜');
    return true;
  } else if (roll < 0.45) {
    const expRes = player.gainExp(ri(40, 100) * zone.id);
    render(box('🔮 ALTAR MISTERI PURBA 🔮', `<p>Aura misterius menyelimuti tubuhmu.</p><p>✨ +${expRes.amount} EXP!</p>`));
    updateHud(player);
    await continueBtn('Lanjutkan ➜');
    for (const ev of expRes.events) {
      render(box('🎉🎉 LEVEL UP! 🎉🎉', `
        <p>Kamu mencapai Level ${ev.level}!</p>
        <p>📈 HP +${ev.hp_gain} | MP +${ev.mp_gain} | ATK +${ev.atk_gain} | DEF +${ev.def_gain}</p>
        <p>✨ STR +${ev.str_gain} | INT +${ev.int_gain} | CHA +${ev.cha_gain} | SPD +${ev.spd_gain} | DEX +${ev.dex_gain}${ev.crs_gain ? ` | CRS +${ev.crs_gain}` : ''}</p>
        <p>💖 HP & MP Dipulihkan Penuh!</p>
      `));
      updateHud(player);
      await continueBtn('Lanjutkan ➜');
    }
    return true;
  }
  return false;
}

    { label: '🚪 Keluar', value: '0', cls: 'danger' },

  let player = null;
  if (startCh === '0') {
    render(box(null, '<p class="storytext">Sampai jumpa di petualangan berikutnya!</p>'));
    return;
  } else if (startCh === '2') {
    const d = await pickSaveFile();

        applyClassTheme(player.class_name);
        render(box(null, `<p class="storytext">🎉 Game berhasil dimuat! Selamat datang kembali, ${esc(player.name)}!</p>`));
        await new Promise(r => setTimeout(r, 500));
      }
    }
    if (!player) {
      render(box(null, '<p class="logmsg">⚠️ Save file tidak ditemukan atau rusak. Memulai game baru...</p>'));
      await new Promise(r => setTimeout(r, 800));
      render(box('📖 PROLOG: KEBANGKITAN KEGELAPAN ELDORIA', `<p class="storytext">${nl2br(PROLOGUE_STORY)}</p>`));
      await continueBtn('Mulai Petualangan ➜');
      player = await createCharacter();
    }
  } else {
    render(box('📖 PROLOG: KEBANGKITAN KEGELAPAN ELDORIA', `<p class="storytext">${nl2br(PROLOGUE_STORY)}</p>`));
    await continueBtn('Mulai Petualangan ➜');
    player = await createCharacter();
  }

  let logMsg = `Petualangan dimulai di Lantai ${player.current_floor}!`;

  while (player.hp > 0 && player.current_floor <= MAX_FLOORS) {
    await checkAndPromoteClass(player);

    const zone = getZoneInfo(player.current_floor);
    const bossPending = player.explore_count >= EXPLORES_PER_FLOOR;
    const bossInfo = bossPending ? getFloorBoss(player.current_floor, player) : null;

    updateHud(player);
    let body = `<p class="zone-name">🏰 LANTAI ${player.current_floor}/${MAX_FLOORS} | ${esc(zone.name)}${player.isHell ? ' <span style="color:var(--red)">🔥 MODE NERAKA</span>' : ''}</p>`;
    body += `<p>⚔️ Senjata: ${esc(player.weapon_name)} (+${player.atk} ATK) | 🛡️ Zirah: ${esc(player.armor_name)} (+${player.defense} DEF)</p>`;
    body += `<p class="statline">${player.statLine()}</p>`;
    if (!bossPending) body += `<p class="statline">🧭 Progres Jelajah: ${player.explore_count}/${EXPLORES_PER_FLOOR} menuju Boss Lantai</p>`;
    if (player.isHell && !bossPending) {
      const req = getHellGrindRequirement(player.current_floor);
      const prepared = player.hell_prepared_floor === player.current_floor;
      body += `<p class="statline">🔥 Persiapan Abyss: ${player.hell_grind}/${req} ${prepared ? '✅ LANTAI SIAP DIJELAJAHI' : '⚠️ GRINDING DIPERLUKAN'}</p>`;
    }
    body += divider();

    let actions;
    if (bossPending) {
      body += ``;
      body += `<p class="boss-name">👹 BOSS: ${esc(bossInfo.name)}</p>`;
      body += `<p class="storytext">📜 ${esc(bossInfo.intro)}</p>`;
      actions = [
        { label: '⚔️ TANTANG PERTEMPURAN BOSS!', value: '1', cls: 'primary' },
        { label: '⛺ Istirahat di Kamp (25G)', value: '2' },
        { label: '🏬 Toko, Pandai Besi & Crafting', value: '3' },
        { label: '🎒 Buka Tas / Inventori', value: '4' },
        { label: '💾 Simpan Game', value: '5' },
      ];
      if (player.isHell) actions.push({ label: '🕳️ Sarang Monster (Grinding Strategis)', value: '6' });
    } else {
      body += `<p>Pilih tindakanmu:</p>`;
      actions = [
        { label: player.isHell ? '🔥 Jelajahi Dungeon Neraka (Sangat Berbahaya)' : '🧭 Jelajahi Koridor Lantai Ini', value: '1', cls: 'primary' },
        { label: '⛺ Istirahat di Kamp (25G → Full HP/MP)', value: '2' },
        { label: '🏬 Kunjungi Toko & Pandai Besi', value: '3' },
        { label: '🎒 Buka Tas / Inventori & Status', value: '4' },
        { label: '💾 Simpan Game', value: '5' },
      ];
      if (player.isHell) actions.push({ label: '🕳️ Sarang Monster (Grinding Strategis)', value: '6' });
    }
    body += divider() + `<p class="logmsg">INFO: ${nl2br(logMsg)}</p>`;
    render(box(null, body));
    const act = await choose(actions);

    if (bossPending) {
      if (act === '1') {
        const b = bossInfo;
        const bossEnemy = makeEnemy(b.name, b.hp, b.atk, b.def, b.exp, b.gold, b.loot, true);
        const won = await battle(player, bossEnemy, player.current_floor);
        if (won) {
          logMsg = `🎉 Berhasil menaklukkan Boss ${b.name}!`;
          if (player.current_floor === MAX_FLOORS) break;
          player.current_floor += 1;
          player.explore_count = 0;
          if (player.isHell) player.hell_prepared_floor = 0;
          if (STORY_DATA[player.current_floor]) {
            render(box(null, `<p class="storytext">${nl2br(STORY_DATA[player.current_floor])}</p>`));
            await continueBtn('Melangkah Maju ➜');
          }
          logMsg = `Menjejakkan kaki di Lantai ${player.current_floor}!`;
        } else {
          if (player.hp <= 0) break;
          logMsg = 'Berhasil mundur dari ruang Boss.';
        }
      } else if (act === '2') {
        if (player.gold >= 25) { player.gold -= 25; player.hp = player.max_hp; player.mp = player.max_mp; player.poison_turns = 0; logMsg = 'Istirahat selesai. HP & MP dipulihkan penuh!'; }
        else logMsg = 'Gold tidak cukup untuk menyewa kamp (25G)!';
      } else if (act === '3') { await shopMenu(player); logMsg = 'Kembali dari pedagang & pandai besi.'; }
      else if (act === '4') { await inventoryMenu(player); logMsg = 'Selesai mengatur inventori.'; }
      else if (act === '5') {
        saveGameToFile(player);
        logMsg = '✅ Progres game berhasil disimpan! (File eldoria_save.json terunduh)';
      } else if (act === '6') {
        await denMenu(player);
        if (player.hp <= 0) break;
        logMsg = 'Kembali dari Sarang Monster.';
      }
    } else {
      if (act === '1') {
        /* ========================================================
           DUNGEON NERAKA — TANPA RESTRIKSI GRINDING
           Grinding di Sarang Monster hanya REKOMENDASI.
           Player tetap boleh masuk kapan saja, tetapi monster
           Dungeon Neraka sengaja dibuat jauh lebih kuat.
           Tidak ada level minimum, biaya masuk, atau syarat
           Persiapan Abyss. Kalau memaksa masuk tanpa persiapan,
           konsekuensinya ditentukan oleh pertarungan: player bisa
           kehilangan banyak HP atau mati.
           ======================================================== */
        if (player.isHell) {
          const req = getHellGrindRequirement(player.current_floor);
          const grind = player.hell_grind || 0;
          let dangerText = '';

          if (grind === 0) {
            dangerText = `
              
              <p class="storytext">Tidak ada yang menghalangimu masuk. Tetapi tekanan Abyss dan monster di koridor ini jauh lebih brutal daripada Sarang Monster. Masuk sekarang berarti mempertaruhkan nyawamu.</p>
            `;
          } else if (grind < req) {
            dangerText = `
              <p class="boss-warn">⚠️ Persiapanmu masih di bawah rekomendasi lantai ini.</p>
              <p class="statline">🔥 Persiapan Abyss: <b>${grind}</b> | Rekomendasi: <b>${req}</b></p>
              <p class="storytext">Kamu tetap bisa masuk. Tidak ada larangan. Namun kekuatanmu belum ideal untuk menghadapi tekanan Abyss lantai ini.</p>
            `;
          } else {
            dangerText = `
              <p class="statline">🛡️ Persiapan Abyss: <b>${grind}</b> | Rekomendasi: <b>${req}</b></p>
              <p class="storytext">Kamu memiliki bekal grinding yang cukup untuk menghadapi lantai ini. Tetap waspada — Dungeon Neraka tidak pernah menjadi aman.</p>
            `;
          }

          
          const triggered = await triggerStoryOrEvent(player, player.current_floor);
          if (!triggered) {
            const enemy = getEnemyForFloor(player.current_floor, player);
            await battle(player, enemy, player.current_floor);
            logMsg = 'Selesai menjelajahi koridor Dungeon Neraka.';
          } else {
            logMsg = 'Menemukan peristiwa khusus di Dungeon Neraka.';
          }

          if (player.hp > 0) {
            player.explore_count += 1;
            if (player.explore_count >= EXPLORES_PER_FLOOR) {
              logMsg += ' Kabut tebal mendadak menyelimuti koridor... sesuatu yang besar sedang mendekat!';
            }
          }
                } else {
          const triggered = await triggerStoryOrEvent(player, player.current_floor);
          if (!triggered) {
            const enemy = getEnemyForFloor(player.current_floor, player);
            await battle(player, enemy, player.current_floor);
            logMsg = player.isHell ? 'Selesai menjelajahi koridor Dungeon Neraka.' : 'Selesai menjelajahi koridor dungeon.';
          } else logMsg = player.isHell ? 'Menemukan peristiwa khusus di Dungeon Neraka.' : 'Menemukan peristiwa khusus di dungeon.';
          if (player.hp > 0) {
            player.explore_count += 1;
            if (player.explore_count >= EXPLORES_PER_FLOOR) {
              logMsg += ' Kabut tebal mendadak menyelimuti koridor... sesuatu yang besar sedang mendekat!';
            }
          }
        }
      } else if (act === '2') {
        if (player.gold >= 25) { player.gold -= 25; player.hp = player.max_hp; player.mp = player.max_mp; player.poison_turns = 0; logMsg = 'Istirahat selesai. HP & MP dipulihkan penuh!'; }
        else logMsg = 'Gold tidak cukup untuk menyewa kamp (25G)!';
      } else if (act === '3') { await shopMenu(player); logMsg = 'Kembali dari pedagang & pandai besi.'; }
      else if (act === '4') { await inventoryMenu(player); logMsg = 'Selesai memeriksa inventori.'; }
      else if (act === '5') {
        saveGameToFile(player);
        logMsg = '✅ Progres game berhasil disimpan ke file! (eldoria_save.json terunduh)';
      } else if (act === '6') {
        await denMenu(player);
        if (player.hp <= 0) break;
        logMsg = 'Kembali dari Sarang Monster.';
      }
    }
    updateHud(player);
  }

  if (player.hp <= 0) {
    updateHud(null);
    render(box('💀 KEMATIAN PAHLAWAN 💀', `
      <p>💀💀 KEMATIAN PAHLAWAN DI LANTAI ${player.current_floor} 💀💀</p>
      <p>${esc(player.name)} sang ${esc(player.class_name)} telah gugur dalam kegelapan Abyss.</p>
      <p>Kerajaan Eldoria runtuh ditelan amukan monster purba...</p>
    `));
    await choose([{ label: '🔄 Mulai Petualangan Baru', value: true, cls: 'primary' }]);
  } else {
    await showGameEnding(player);
    updateHud(null);
  }
}

async function bootLoop() {
  while (true) {
    try {
      await mainGame();
    } catch (e) {
      console.error(e);
      render(box('⚠️ Terjadi Kesalahan', `<p class="logmsg">${esc(e.message || String(e))}</p>`));
      await continueBtn('Mulai Ulang ➜');
    }
  }
}

bootLoop();

</script>




<script id="eldoria-class-theme-engine">
(function () {
  const THEMES = {
    warrior: 'class-theme-warrior',
    mage: 'class-theme-mage',
    rogue: 'class-theme-rogue',
    paladin: 'class-theme-paladin',
    archer: 'class-theme-archer',
    necromancer: 'class-theme-necromancer'
  };

  function normalizeClassName(name) {
    return String(name || '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function resolveTheme(className) {
    const n = normalizeClassName(className);

    // Exact / family matching keeps promoted classes on their original fantasy theme.
    if (n.includes('warrior') || n.includes('berserker') || n.includes('champion') ||
        n.includes('warlord') || n.includes('guardian')) return 'warrior';

    if (n.includes('mage') || n.includes('archmage') || n.includes('wizard') ||
        n.includes('sorcer') || n.includes('invoker') || n.includes('archon')) return 'mage';

    if (n.includes('rogue') || n.includes('assassin') || n.includes('shadow') ||
        n.includes('phantom') || n.includes('thief')) return 'rogue';

    if (n.includes('paladin') || n.includes('aegis') || n.includes('holy') ||
        n.includes('crusader')) return 'paladin';

    if (n.includes('archer') || n.includes('ranger') || n.includes('marksman') ||
        n.includes('hunter')) return 'archer';

    if (n.includes('necromancer') || n.includes('lich') || n.includes('death lord') ||
        n.includes('reaper') || n.includes('undead')) return 'necromancer';

    return null;
  }

  window.setEldoriaClassTheme = function (className) {
    const theme = resolveTheme(className);
    if (!theme) return;

    Object.values(THEMES).forEach(cls => document.body.classList.remove(cls));
    document.body.classList.add(THEMES[theme]);
    document.body.dataset.classTheme = theme;
  };

  // Listen for custom events from the game's selection flow.
  document.addEventListener('eldoria:class-selected', e => {
    if (e.detail) setEldoriaClassTheme(e.detail.name || e.detail.className || e.detail);
  });

  // Watch for common game state variables when they are exposed globally.
  function syncFromGlobals() {
    const candidates = [
      window.selectedClass,
      window.currentClass,
      window.playerClass,
      window.gameState && window.gameState.class,
      window.gameState && window.gameState.currentClass
    ];
    const candidate = candidates.find(Boolean);
    if (candidate) {
      setEldoriaClassTheme(candidate.name || candidate);
    }
  }

  window.addEventListener('eldoria:state-changed', syncFromGlobals);
  setTimeout(syncFromGlobals, 0);
  setTimeout(syncFromGlobals, 150);
  setTimeout(syncFromGlobals, 500);
})();
</script>


<script id="eldoria-hp-mp-bar-fix">
(function () {
  function percent(current, max) {
    current = Number(current);
    max = Number(max);
    if (!Number.isFinite(current) || !Number.isFinite(max) || max <= 0) return 0;
    return Math.max(0, Math.min(100, current / max * 100));
  }

  window.updateEldoriaHpMpBars = function (hp, maxHp, mp, maxMp) {
    const hpPct = percent(hp, maxHp);
    const mpPct = percent(mp, maxMp);

    document.querySelectorAll(
      '.hp-fill, .health-fill, .bar-hp, .health-bar > .fill, .stat-bar.hp .fill'
    ).forEach(el => {
      el.style.width = hpPct + '%';
    });

    document.querySelectorAll(
      '.mp-fill, .mana-fill, .bar-mp, .mana-bar > .fill, .stat-bar.mp .fill'
    ).forEach(el => {
      el.style.width = mpPct + '%';
    });
  };
})();
</script>

<script id="eldoria-pwa-install">
(function () {
  "use strict";

  var isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;

  var isFileProtocol = location.protocol === 'file:';
  var isSecureHost = location.protocol === 'https:' || location.hostname === 'localhost';

  // ---- 1. Build manifest.json dynamically from embedded icon data & register it ----
  function setupManifest() {
    try {
      var dataEl = document.getElementById('eldoria-manifest-data');
      if (!dataEl) return;
      var icons = JSON.parse(dataEl.textContent);
      var manifest = {
        name: 'Eldoria RPG — 50 Floors of Abyss',
        short_name: 'Eldoria RPG',
        description: 'Petualangan Text-RPG Epik 50 Lantai Abyss',
        start_url: location.pathname + location.search,
        scope: location.pathname.replace(/[^\/]*$/, ''),
        display: 'standalone',
        orientation: 'portrait-primary',
        background_color: '#0b0b12',
        theme_color: '#0b0b12',
        icons: [
          { src: 'data:image/png;base64,' + icons.icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: 'data:image/png;base64,' + icons.icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: 'data:image/png;base64,' + icons.icon512m, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var url = URL.createObjectURL(blob);
      var link = document.getElementById('eldoria-manifest-link');
      if (link) link.setAttribute('href', url);
    } catch (e) {
      console.warn('Eldoria: gagal membuat manifest', e);
    }
  }

  // ---- 2. Register a minimal service worker (required by Chrome for install eligibility) ----
  function setupServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (isFileProtocol || !isSecureHost) return; // SW needs https or localhost
    try {
      var swSource = [
        "self.addEventListener('install', function(e){ self.skipWaiting(); });",
        "self.addEventListener('activate', function(e){ self.clients.claim(); });",
        "self.addEventListener('fetch', function(e){ /* pass-through, no caching */ });"
      ].join('\n');
      var swBlob = new Blob([swSource], { type: 'application/javascript' });
      var swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function (err) {
        console.warn('Eldoria: registrasi service worker gagal', err);
      });
    } catch (e) {
      console.warn('Eldoria: service worker tidak didukung di lingkungan ini', e);
    }
  }

  // ---- 3. Handle the native "beforeinstallprompt" (Chrome/Android) ----
  var deferredPrompt = null;
  var installBtn = document.getElementById('eldoria-install-btn');

  function showInstallBtn() {
    if (installBtn) installBtn.classList.remove('hidden');
  }
  function hideInstallBtn() {
    if (installBtn) installBtn.classList.add('hidden');
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    showInstallBtn();
  });

  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    hideInstallBtn();
  });

  // ---- 4. Manual instructions modal (iOS Safari / browsers without beforeinstallprompt) ----
  function detectPlatform() {
    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);
    var isChrome = /chrome|crios/i.test(ua) && !/edg|opr/i.test(ua);
    var isSafari = /safari/i.test(ua) && !/chrome|crios|android/i.test(ua);
    return { isIOS: isIOS, isAndroid: isAndroid, isChrome: isChrome, isSafari: isSafari };
  }

  function showManualInstructions() {
    var p = detectPlatform();
    var title = '📲 Tambahkan ke Layar Utama';
    var bodyHtml = '';

    if (p.isIOS) {
      bodyHtml = '<p>Di Safari (iOS), instalasi otomatis tidak tersedia — ikuti langkah manual:</p>' +
        '<ol>' +
        '<li>Ketuk ikon <strong>Bagikan</strong> (kotak dengan panah ke atas) di bar bawah Safari.</li>' +
        '<li>Gulir ke bawah dan pilih <strong>"Tambah ke Layar Utama"</strong>.</li>' +
        '<li>Ketuk <strong>"Tambah"</strong> di pojok kanan atas.</li>' +
        '</ol>';
    } else if (p.isAndroid) {
      bodyHtml = '<p>Jika tombol install tidak muncul otomatis, tambahkan shortcut secara manual:</p>' +
        '<ol>' +
        '<li>Ketuk ikon <strong>⋮ (titik tiga)</strong> di pojok kanan atas browser.</li>' +
        '<li>Pilih <strong>"Tambahkan ke Layar Utama"</strong> atau <strong>"Instal aplikasi"</strong>.</li>' +
        '<li>Konfirmasi dengan menekan <strong>"Tambah" / "Instal"</strong>.</li>' +
        '</ol>' +
        (isFileProtocol ? '<p><em>Catatan: file ini dibuka secara lokal (file://). Untuk pengalaman instal penuh (ikon berdiri sendiri tanpa address bar), unggah file ini ke hosting HTTPS (mis. GitHub Pages / Netlify) lalu buka dari sana.</em></p>' : '');
    } else {
      bodyHtml = '<p>Buka menu browser (biasanya ikon <strong>⋮</strong> atau <strong>Bagikan</strong>) lalu cari opsi <strong>"Tambahkan ke Layar Utama"</strong> atau <strong>"Instal Aplikasi"</strong>.</p>';
    }

    var backdrop = document.createElement('div');
    backdrop.className = 'eldoria-install-modal-backdrop';
    backdrop.innerHTML =
      '<div class="eldoria-install-modal" role="dialog" aria-modal="true">' +
        '<h3>' + title + '</h3>' +
        bodyHtml +
        '<div class="btnrow"><button type="button" data-close>Tutup</button></div>' +
      '</div>';
    document.body.appendChild(backdrop);

    function close() { backdrop.remove(); }
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
    backdrop.querySelector('[data-close]').addEventListener('click', close);
  }

  // ---- 5. Wire up the install button ----
  if (installBtn) {
    installBtn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          hideInstallBtn();
        });
      } else {
        showManualInstructions();
      }
    });
  }

  // ---- Boot ----
  if (!isStandalone) {
    setupManifest();
    setupServiceWorker();
    // On Android/Chrome the native prompt may not fire immediately (engagement
    // heuristics); reveal the button after a short delay so users on eligible
    // browsers always have a manual fallback via the instructions modal.
    setTimeout(function () {
      var p = detectPlatform();
      if (!deferredPrompt && (p.isIOS || p.isAndroid)) showInstallBtn();
    }, 1200);
  }
})();
</script>
